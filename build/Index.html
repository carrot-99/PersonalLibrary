    <script>
      // 配色（ライト／ダーク）を描画前に反映する（ちらつき防止。切り替えは Common.html の setThemeChoice）
      try {
        var savedTheme = localStorage.getItem('personalLibrary.theme');
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
      } catch (e) {}
    </script>
