<script>
//////////////////////////////
// 初期化
//////////////////////////////
const masterCache = {};

function init(){
  refreshMasterData();
  loadLibrarySummary('libraryGlobal');
  loadRecentLibrary('globalRecentLibraryTable');
  showTab('LibraryMasterView');
  closeSidebar();
}

function toggleSidebar(){
  const sideMenu = document.getElementById('sideMenu');
  if(!sideMenu) return;
  sideMenu.classList.toggle('open');
}

function closeSidebar(){
  const sideMenu = document.getElementById('sideMenu');
  if(!sideMenu) return;
  sideMenu.classList.remove('open');
}

//////////////////////////////
// マスタ選択肢再読み込み
//////////////////////////////
function refreshMasterData(){
  callGAS('getTitleMaster', populateTitle);
  callGAS('getBoxMaster', populateBoxes);
  callGAS('getSeriesMaster', populateSeries);
}

//////////////////////////////
// GAS 呼び出し共通
//////////////////////////////
function callGAS(funcName, successHandler, ...args){
  google.script.run
    .withSuccessHandler(successHandler)
    .withFailureHandler(function(error){
      showError(error && error.message ? error.message : '通信に失敗しました');
    })[funcName](...args);
}

//////////////////////////////
// タブ切替
//////////////////////////////
function showTab(tabId){

  let targetView = document.getElementById(tabId);
  if(!targetView){
    targetView = document.querySelector('.view');
  }
  if(!targetView) return;

  const buttons = document.querySelectorAll('.tabs button');
  buttons.forEach(b => b.classList.remove('active'));

  const activeButton = document.querySelector(`.tabs button[data-tab="${tabId}"]`);
  if(activeButton) activeButton.classList.add('active');

  document.querySelectorAll('.view')
    .forEach(v => v.style.display = 'none');

  targetView.style.display = 'block';

  clearGlobalMessage();

  const loaders = {
    LibraryMasterView: loadLibraryMaster,
    BoxMasterView: loadBoxMaster,
    SeriesMasterView: loadSeriesMaster,
    TitleMasterView: loadTitleMaster,
    SeriesListView: function(){ showInlineLoading('SeriesListView', '読み込み中...'); loadSeriesList(1); },
    TitleListView: function(){ showInlineLoading('TitleListView', '読み込み中...'); loadTitleList(1); },
    BoxListView: function(){ showInlineLoading('BoxListView', '読み込み中...'); loadBoxList(1); },
    LibraryListView: function(){ showInlineLoading('LibraryListView', '読み込み中...'); loadLibraryList(1); }
  };

  loadLibrarySummary('libraryGlobal');
  loadRecentLibrary('globalRecentLibraryTable');

  if(loaders[tabId]) loaders[tabId]();
}

//////////////////////////////
// メッセージ管理
//////////////////////////////
let messageTimeout = null;

function clearGlobalMessage(){
  const notification = document.getElementById('globalNotification');
  if(!notification) return;
  notification.textContent = '';
  notification.className = 'notification';
  notification.style.display = 'none';
  if(messageTimeout){
    clearTimeout(messageTimeout);
    messageTimeout = null;
  }
}

function showSuccess(message){
  const notification = document.getElementById('globalNotification');
  if(!notification) return;
  notification.textContent = message;
  notification.className = 'notification success';
  notification.style.display = 'block';
  if(messageTimeout) clearTimeout(messageTimeout);
  messageTimeout = setTimeout(clearGlobalMessage, 4000);
}

function showError(message){
  const notification = document.getElementById('globalNotification');
  if(!notification) return;
  notification.textContent = message;
  notification.className = 'notification error';
  notification.style.display = 'block';
  if(messageTimeout) clearTimeout(messageTimeout);
  messageTimeout = setTimeout(clearGlobalMessage, 6000);
}

function showInlineLoading(containerId, message = '検索中...'){
  const container = document.getElementById(containerId);
  if(!container) return null;

  let loader = container.querySelector('.inline-loading');
  if(!loader){
    loader = document.createElement('div');
    loader.className = 'inline-loading';
    loader.innerHTML = `
      <span class="inline-spinner"></span>
      <span class="inline-loading-text">${message}</span>
    `;
    container.appendChild(loader);
  } else {
    const text = loader.querySelector('.inline-loading-text');
    if(text) text.textContent = message;
    loader.style.display = 'inline-flex';
  }

  return loader;
}

function hideInlineLoading(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;

  const loader = container.querySelector('.inline-loading');
  if(loader) loader.remove();
}

window.showInlineLoading = showInlineLoading;
window.hideInlineLoading = hideInlineLoading;

function shouldTruncateTableText(fieldName){
  const normalized = String(fieldName || '').toLowerCase();
  if(!normalized) return false;
  return normalized === 'name'
    || normalized === 'title'
    || normalized === 'series'
    || normalized === 'seriesname'
    || normalized.endsWith('name')
    || normalized.endsWith('series')
    || normalized.includes('seriesname')
    || normalized.includes('title');
}

function getDisplayTableValue(value, fieldName){
  const text = value == null ? '' : String(value);
  if(!shouldTruncateTableText(fieldName) || text.length <= 20){
    return text;
  }

  return text.slice(0, 20) + '…';
}

function getPreferredColumnWidth(fieldName){
  const normalized = String(fieldName || '').toLowerCase();

  if(normalized.includes('series') || normalized.includes('title') || normalized.includes('name')) return '36%';
  if(normalized.includes('id') || normalized === 'seriesid' || normalized === 'titleid' || normalized === 'boxid') return '10%';
  if(normalized.includes('volume') || normalized.includes('count') || normalized === '巻数' || normalized === '巻') return '12%';
  if(normalized.includes('box') || normalized.includes('place')) return '14%';
  if(normalized.includes('type')) return '12%';
  if(normalized.includes('complete') || normalized.includes('done')) return '10%';
  if(normalized.includes('date')) return '14%';
  return '16%';
}

function applyColumnWidthHints(table){
  if(!table) return;

  const headers = Array.from(table.querySelectorAll('thead th'));
  if(headers.length === 0) return;

  const rows = table.querySelectorAll('tbody tr');
  const firstRowCells = rows.length > 0 ? rows[0].cells : [];

  headers.forEach((header, index) => {
    const fieldName = header.dataset.field || (firstRowCells[index] && firstRowCells[index].dataset.field) || '';
    const width = getPreferredColumnWidth(fieldName || header.textContent || '');
    header.style.width = width;
    header.style.maxWidth = width;

    Array.from(table.querySelectorAll('tbody tr')).forEach(row => {
      const cell = row.cells[index];
      if(cell){
        cell.style.width = width;
        cell.style.maxWidth = width;
      }
    });
  });
}

//////////////////////////////
// テーブル描画共通（編集あり）
//////////////////////////////
function renderTableRows(tbody, data, columns, editable){

  tbody.innerHTML = '';

  data.forEach(row => {

    const tr = document.createElement('tr');

    columns.forEach(col=>{
      const td = document.createElement('td');
      const rawValue = row[col] ?? '';
      const displayValue = getDisplayTableValue(rawValue, col);
      td.textContent = displayValue;
      td.title = String(rawValue);
      td.dataset.field = col;
      tr.appendChild(td);
    });

    if(editable){
      const actionTd = document.createElement('td');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'edit-action';
      btn.textContent = '編集';
      btn.onclick = function(){
        startEdit(this);
      };
      actionTd.appendChild(btn);
      tr.appendChild(actionTd);
    }

    tbody.appendChild(tr);
  });

  const table = tbody.closest('table');
  if(table) applyColumnWidthHints(table);
}

function renderTable(tableId, data, columns){
  const tbody = document
    .getElementById(tableId)
    .querySelector('tbody');

  renderTableRows(tbody, data, columns, true);
}

//////////////////////////////
// テーブル描画（編集なし・検索用）
//////////////////////////////
function renderTableReadOnly(tableId, data, columns) {
  const tbody = document.getElementById(tableId).querySelector('tbody');
  tbody.innerHTML = '';

  data.forEach(row => {
    const tr = document.createElement('tr');

    columns.forEach(col => {
      const td = document.createElement('td');
      const rawValue = row[col] ?? '';
      td.textContent = getDisplayTableValue(rawValue, col);
      td.title = String(rawValue);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  const table = tbody.closest('table');
  if(table) applyColumnWidthHints(table);
}

//////////////////////////////
// ページネーション付きマスタ描画
//////////////////////////////
function renderPagedTableDOM(options){
  // options:
  // tableId, data, columns, currentPage, pageSize, totalRows, onPageChange, editable

  const { tableId, data, columns, currentPage, pageSize, totalRows, onPageChange, editable } = options;

  const tbody = document.getElementById(tableId).querySelector('tbody');
  tbody.innerHTML = ''; // tbody は clear してもOK

  data.forEach(row => {
    const tr = document.createElement('tr');

    columns.forEach(col => {
      const td = document.createElement('td');
      const rawValue = row[col] ?? '';
      td.textContent = getDisplayTableValue(rawValue, col);
      td.title = String(rawValue);
      td.dataset.field = col;
      tr.appendChild(td);
    });

    if(editable){
      const actionTd = document.createElement('td');
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'edit-action';
      editBtn.textContent = '編集';
      editBtn.onclick = () => startEdit(editBtn);
      actionTd.appendChild(editBtn);
      tr.appendChild(actionTd);
    }

    tbody.appendChild(tr);
  });

  const table = document.getElementById(tableId);
  if(table) applyColumnWidthHints(table);

  // ページネーション表示
  const paginationDivId = tableId + "_pagination";
  let paginationDiv = document.getElementById(paginationDivId);

  if(!paginationDiv){
    paginationDiv = document.createElement('div');
    paginationDiv.id = paginationDivId;
    paginationDiv.style.marginTop = "10px";
    document.getElementById(tableId).after(paginationDiv);
  }

  paginationDiv.innerHTML = '';

  const totalPages = Math.ceil(totalRows / pageSize);
  if(totalPages <= 1) return;

  const maxButtons = 5; // ← 表示する中央ページ数
  const half = Math.floor(maxButtons / 2);

  let startPage = Math.max(1, currentPage - half);
  let endPage   = Math.min(totalPages, currentPage + half);

  if(endPage - startPage < maxButtons - 1){
    if(startPage === 1){
      endPage = Math.min(totalPages, startPage + maxButtons - 1);
    } else if(endPage === totalPages){
      startPage = Math.max(1, endPage - maxButtons + 1);
    }
  }

  // 「前へ」
  if(currentPage > 1){
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '« 前へ';
    prevBtn.onclick = () => onPageChange(currentPage - 1);
    prevBtn.style.marginRight = '5px';
    paginationDiv.appendChild(prevBtn);
  }

  // 先頭ページ + 省略
  if(startPage > 1){
    const firstBtn = document.createElement('button');
    firstBtn.textContent = 1;
    firstBtn.onclick = () => onPageChange(1);
    firstBtn.style.marginRight = '5px';
    paginationDiv.appendChild(firstBtn);

    if(startPage > 2){
      const dots = document.createElement('span');
      dots.textContent = '...';
      dots.style.marginRight = '5px';
      paginationDiv.appendChild(dots);
    }
  }

  // 中央ページ群
  for(let p = startPage; p <= endPage; p++){
    if(p === currentPage){
      const span = document.createElement('span');
      span.textContent = p;
      span.style.fontWeight = 'bold';
      span.style.marginRight = '5px';
      paginationDiv.appendChild(span);
    } else {
      const btn = document.createElement('button');
      btn.textContent = p;
      btn.style.marginRight = '5px';
      btn.onclick = () => onPageChange(p);
      paginationDiv.appendChild(btn);
    }
  }

  // 末尾ページ + 省略
  if(endPage < totalPages){
    if(endPage < totalPages - 1){
      const dots = document.createElement('span');
      dots.textContent = '...';
      dots.style.marginRight = '5px';
      paginationDiv.appendChild(dots);
    }

    const lastBtn = document.createElement('button');
    lastBtn.textContent = totalPages;
    lastBtn.onclick = () => onPageChange(totalPages);
    lastBtn.style.marginRight = '5px';
    paginationDiv.appendChild(lastBtn);
  }

  // 「次へ」
  if(currentPage < totalPages){
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '次へ »';
    nextBtn.onclick = () => onPageChange(currentPage + 1);
    paginationDiv.appendChild(nextBtn);
  }

}

//////////////////////////////
// 日付フォーマット
//////////////////////////////
function formatDate(date){
  if(!date) return '';
  const d = new Date(date);
  if(isNaN(d)) return '';
  return d.getFullYear() + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' +
         String(d.getDate()).padStart(2,'0');
}

//////////////////////////////
// トグル切り替え
//////////////////////////////
function toggleAddForm(id){
  const form = document.getElementById(id);
  if(!form) return;

  const view = form.closest('.view') || form.parentElement;
  if(view){
    view.querySelectorAll('.master-form')
      .forEach(f => f.style.display = 'none');
  }

  form.style.display = 'block';
  syncMasterToolbarLayout(view);
}

function toggleSearchForm(id){
  const form = document.getElementById(id);
  if(!form) return;

  const view = form.closest('.view') || form.parentElement;
  if(view){
    view.querySelectorAll('.master-form')
      .forEach(f => f.style.display = 'none');
  }

  form.style.display = (form.style.display === 'none') ? 'block' : 'none';
  syncMasterToolbarLayout(view);
}

function syncMasterToolbarLayout(view){
  if(!view) return;

  const toolbar = view.querySelector('.master-toolbar');
  if(!toolbar) return;

  const isTablet = window.matchMedia('(max-width: 1100px)').matches;
  if(!isTablet){
    toolbar.style.flexDirection = '';
    toolbar.style.alignItems = '';
    toolbar.style.gap = '';
    return;
  }

  toolbar.style.display = 'flex';
  toolbar.style.flexDirection = 'row';
  toolbar.style.flexWrap = 'wrap';
  toolbar.style.alignItems = 'stretch';
  toolbar.style.gap = '8px';

  toolbar.querySelectorAll('button').forEach(button => {
    button.style.marginTop = '0';
    button.style.width = 'auto';
    button.style.flex = '1 1 180px';
  });
}

///////////////////////////////
// 選択肢取得
///////////////////////////////
function populateSelect(selectIds, data, labelFn, valueKey = 'id', placeholderText = null, clear = true){

  if(!Array.isArray(selectIds)) {
    selectIds = [selectIds];
  }

  selectIds.forEach(id => {
    const sel = document.getElementById(id);
    if(!sel) return;

    if(clear) sel.innerHTML = '';

    if(placeholderText){
      const placeholder = new Option(placeholderText, '');
      placeholder.disabled = true;
      placeholder.selected = true;
      sel.add(placeholder);
    }

    data.forEach(item => {
      const option = new Option(
        labelFn(item),
        item[valueKey]
      );
      sel.add(option);
    });
  });
}

function showAutocompleteSuggestions(inputId, data, labelFn, valueKey = 'id'){
  const input = document.getElementById(inputId);
  if(!input) return;

  const listId = input.getAttribute('list') || (inputId + 'List');
  const list = document.getElementById(listId);
  const suggestionBoxId = inputId + 'Suggestions';
  let suggestionBox = document.getElementById(suggestionBoxId);
  if(!suggestionBox){
    suggestionBox = document.createElement('div');
    suggestionBox.id = suggestionBoxId;
    suggestionBox.className = 'autocomplete-suggestions';
    input.parentNode.insertBefore(suggestionBox, input.nextSibling);
  }

  const keyword = input.value.trim().toLowerCase();
  const matches = !keyword
    ? data
    : data.filter(item => String(labelFn(item)).toLowerCase().includes(keyword));

  suggestionBox.innerHTML = '';
  if(!list) return;

  if(matches.length === 0){
    const empty = document.createElement('div');
    empty.className = 'autocomplete-empty';
    empty.textContent = '該当なし';
    suggestionBox.appendChild(empty);
    suggestionBox.style.display = 'block';
    return;
  }

  matches.slice(0, 10).forEach(item => {
    const option = document.createElement('button');
    option.type = 'button';
    option.className = 'autocomplete-item';
    option.textContent = labelFn(item);
    option.addEventListener('click', function(){
      input.value = labelFn(item);
      input.dataset.selectedId = String(item[valueKey]);
      suggestionBox.style.display = 'none';
    });
    suggestionBox.appendChild(option);
  });

  suggestionBox.style.display = 'block';
}

function populateAutocomplete(inputId, data, labelFn, valueKey = 'id', placeholderText = ''){
  const input = document.getElementById(inputId);
  const listId = input ? input.getAttribute('list') : null;
  const list = listId ? document.getElementById(listId) : document.getElementById(inputId + 'List');
  if(!input || !list) return;

  input.placeholder = placeholderText || '選択肢を入力';
  list.innerHTML = '';

  data.forEach(item => {
    const option = document.createElement('option');
    option.value = labelFn(item);
    option.dataset.value = String(item[valueKey]);
    list.appendChild(option);
  });

  input.oninput = function(){
    const keyword = input.value.trim().toLowerCase();
    const match = Array.from(list.options).find(opt =>
      opt.value.toLowerCase() === keyword ||
      opt.value.toLowerCase().includes(keyword)
    );
    input.dataset.selectedId = match ? match.dataset.value : '';
    showAutocompleteSuggestions(inputId, data, labelFn, valueKey);
  };

  input.onfocus = function(){
    showAutocompleteSuggestions(inputId, data, labelFn, valueKey);
  };

  input.onblur = function(){
    setTimeout(() => {
      const box = document.getElementById(inputId + 'Suggestions');
      if(box) box.style.display = 'none';
    }, 120);
  };
}

function getAutocompleteValue(inputId){
  const input = document.getElementById(inputId);
  const listId = input ? input.getAttribute('list') : null;
  const list = listId ? document.getElementById(listId) : document.getElementById(inputId + 'List');
  if(!input || !list) return '';

  const value = input.value.trim();
  if(!value) return '';

  const match = Array.from(list.options).find(opt =>
    opt.value.toLowerCase() === value.toLowerCase() ||
    opt.value.toLowerCase().includes(value.toLowerCase())
  );

  if(match){
    input.dataset.selectedId = match.dataset.value;
    return match.dataset.value;
  }

  return '';
}

// シリーズ選択肢取得
function populateSeries(series){

///////////////////////////////
// CRUD共通
///////////////////////////////
// 検索
function filterMaster(tbodyId, keywordInputId){

  const keywordInput = document.getElementById(keywordInputId);
  const table = document.getElementById(tbodyId)?.closest('table');
  if(!keywordInput || !table) return;

  const keyword = keywordInput.value.trim().toLowerCase();
  const rows = document.getElementById(tbodyId).getElementsByTagName('tr');
  let visibleRows = 0;

  Array.from(rows).forEach(row => {
    const match = Array.from(row.cells).some(cell =>
      cell.textContent.toLowerCase().includes(keyword)
    );

    row.style.display = match ? '' : 'none';
    if(match) visibleRows++;
  });

  table.style.display = visibleRows > 0 ? 'table' : 'none';
}

function renderFilteredTable(tableId, rows, columns, keywordInputId, editable = true){
  const table = document.getElementById(tableId);
  if(!table) return;

  const keyword = document.getElementById(keywordInputId).value.trim().toLowerCase();
  const filtered = !keyword
    ? rows
    : rows.filter(row =>
        Object.values(row).some(value =>
          String(value ?? '').toLowerCase().includes(keyword)
        )
      );

  const tbody = table.querySelector('tbody');
  tbody.innerHTML = '';

  if(filtered.length === 0){
    table.style.display = 'none';
    return;
  }

  filtered.forEach(row => {
    const tr = document.createElement('tr');

    columns.forEach(col => {
      const td = document.createElement('td');
      td.textContent = row[col] ?? '';
      td.dataset.field = col;
      tr.appendChild(td);
    });

    if(editable){
      const actionTd = document.createElement('td');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'edit-action';
      btn.textContent = '編集';
      btn.onclick = function(){ startEdit(this); };
      actionTd.appendChild(btn);
      tr.appendChild(actionTd);
    }

    tbody.appendChild(tr);
  });

  applyColumnWidthHints(table);
  table.style.display = 'table';
}

// 更新
function startEdit(btn){

  const tr = btn.closest('tr');

  Array.from(tr.cells).forEach((td, index)=>{

    // 最後の列（操作列）は除外
    if(index === tr.cells.length - 1) return;

    const value = td.textContent;
    td.dataset.original = value;

    const input = document.createElement('input');
    input.type = 'text';
    input.value = value;

    td.textContent = '';
    td.appendChild(input);
  });

  // 操作ボタン列を書き換え
  const actionTd = tr.cells[tr.cells.length - 1];
  actionTd.textContent = '';

  const saveBtn = document.createElement('button');
  saveBtn.textContent = '保存';
  saveBtn.addEventListener('click', function(){
    saveEdit(this);
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '取消';
  cancelBtn.style.marginLeft = '5px';
  cancelBtn.addEventListener('click', function(){
    cancelEdit(this);
  });

  actionTd.appendChild(saveBtn);
  actionTd.appendChild(cancelBtn);
}

function cancelEdit(btn){

  const tr = btn.closest('tr');

  Array.from(tr.cells).forEach((td, index)=>{

    if(index === tr.cells.length - 1) return;

    td.textContent = td.dataset.original || '';
  });

  // 操作列を戻す
  const actionTd = tr.cells[tr.cells.length - 1];
  actionTd.textContent = '';

  const editBtn = document.createElement('button');
  editBtn.textContent = '編集';
  editBtn.addEventListener('click', function(){
    startEdit(this);
  });

  actionTd.appendChild(editBtn);
}

function saveEdit(btn){

  const tr = btn.closest('tr');
  const tableId = tr.closest('table').id;

  const cells = Array.from(tr.cells);

  // IDは1列目
  const idCell = cells[0];
  const idInput = idCell.querySelector('input');
  const id = idInput ? idInput.value : idCell.textContent;

  const values = cells.slice(1, cells.length - 1)
    .map(td => {
      const input = td.querySelector('input');
      return input ? input.value : td.textContent;
    });

  let gasFunction = null;
  let reloadFunction = null;

  if(tableId === 'boxMasterTable'){
    gasFunction = 'updateBoxMaster';
    reloadFunction = loadBoxMaster;
  }

  if(tableId === 'seriesMasterTable'){
    gasFunction = 'updateSeriesMaster';
    reloadFunction = loadSeriesMaster;
  }

  if(tableId === 'titleMasterTable'){
    gasFunction = 'updateTitleMaster';
    reloadFunction = loadTitleMaster;
  }

  if(tableId === 'libraryMasterTable'){
    gasFunction = 'updateLibraryMaster';
    reloadFunction = loadLibraryMaster;
  }

  if(!gasFunction) return;

  callGAS(gasFunction, function(res){

    if(res && res.success){
      showSuccess(res.message);
      reloadFunction();
      if(tableId === 'titleMasterTable' || tableId === 'seriesMasterTable' || tableId === 'boxMasterTable'){
        refreshMasterData();
      }
    } else {
      showError(res?.message || '更新に失敗しました');
    }

  }, id, values);
}

function initApp(){
  init();
}

window.initApp = initApp;
window.toggleSidebar = toggleSidebar;
window.closeSidebar = closeSidebar;
window.refreshMasterData = refreshMasterData;
window.callGAS = callGAS;
window.showTab = showTab;
window.clearGlobalMessage = clearGlobalMessage;
window.showSuccess = showSuccess;
window.showError = showError;

</script>
