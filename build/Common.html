<script>
//////////////////////////////
// 初期化
//////////////////////////////
const masterCache = {};

// 書籍／アニメの切り替え。モードごとに最初に開く画面
const APP_MODE_HOME = { book: 'PhotoImportView', anime: 'AnimeWatchingView' };
const APP_MODE_STORAGE_KEY = 'personalLibrary.appMode';
let appMode = null;

function init(){
  refreshMasterData(true);
  // 起動時はホーム（共通の画面でモードを決めないので、前回のモードを先に反映する）
  applyAppMode(loadSavedAppMode());
  showTab('HomeView');
  closeSidebar();
}

// 書籍・アニメ共通の画面（開いてもモードを切り替えない）
const COMMON_VIEW_IDS = ['HomeView', 'SeriesListView', 'SeriesView'];

// 戻り値: 'anime' / 'book'、共通の画面は null
function getModeOfView(viewId){
  if(COMMON_VIEW_IDS.includes(viewId)) return null;
  return String(viewId || '').startsWith('Anime') ? 'anime' : 'book';
}

function loadSavedAppMode(){
  try {
    const saved = localStorage.getItem(APP_MODE_STORAGE_KEY);
    if(APP_MODE_HOME[saved]) return saved;
  } catch(e) {}
  return 'book';
}

// メニュー・上部バー・サマリーの表示をモードに合わせる（画面は切り替えない）
function applyAppMode(mode){
  if(!mode || appMode === mode) return;
  appMode = mode;
  document.body.dataset.mode = mode;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  try { localStorage.setItem(APP_MODE_STORAGE_KEY, mode); } catch(e) {}
}

// モード切替ボタン: 切り替えたらそのモードの最初の画面を開く
function setAppMode(mode){
  if(!APP_MODE_HOME[mode] || appMode === mode) return;
  showTab(APP_MODE_HOME[mode]);
}

function toggleSidebar(){
  const sideMenu = document.getElementById('sideMenu');
  if(!sideMenu) return;
  const opened = sideMenu.classList.toggle('open');
  const backdrop = document.getElementById('sideMenuBackdrop');
  if(backdrop) backdrop.classList.toggle('open', opened);
}

function closeSidebar(){
  const sideMenu = document.getElementById('sideMenu');
  if(!sideMenu) return;
  sideMenu.classList.remove('open');
  const backdrop = document.getElementById('sideMenuBackdrop');
  if(backdrop) backdrop.classList.remove('open');
}

//////////////////////////////
// マスタ選択肢再読み込み
//////////////////////////////
// useCache: true なら前回の結果をすぐ反映してから取り直す（起動時）。保存・削除の後は省略して取り直すだけにする
function refreshMasterData(useCache){
  const options = { refresh: !useCache };
  callGASCached('master.titles', 'getTitleMaster', populateTitle, options);
  callGASCached('master.boxes', 'getBoxMaster', populateBoxes, options);
  callGASCached('master.series', 'getSeriesMaster', populateSeries, options);
}

//////////////////////////////
// GAS 呼び出し共通
//////////////////////////////
function callGAS(funcName, successHandler, ...args){
  google.script.run
    .withSuccessHandler(successHandler)
    .withFailureHandler(function(error){
      showError(error && error.message ? error.message : '通信に失敗しました');
    })[funcName](...args);
}

//////////////////////////////
// 取得結果のキャッシュ（一覧を開いたときにすぐ表示する）
// 前回の結果（このブラウザの localStorage に保存）をすぐ描画し、裏でサーバーから取り直して、
// 内容が変わっていれば描画し直す。取り直している間は画面に「最新の情報を確認中」を出す。
// 同じ cacheKey は最後に呼んだ取得の結果だけを使う（保存の前に始めた取得の結果で、保存後の表示を上書きしない）
//   cacheKey: 保存先の名前（呼び出し元ごとに分ける） / funcName: サーバー関数（引数なし）
//   onData(data): 描画。キャッシュとサーバーの結果で最大 2 回呼ばれる
//   options: {
//     viewId       … 読み込み中・確認中の表示を出す画面
//     errorMessage … 取得に失敗したときのメッセージ
//     refresh      … true: キャッシュは描画せず、表示中の内容のまま取り直す（保存・削除の後）
//   }
//////////////////////////////
const SERVER_CACHE_PREFIX = 'personalLibrary.cache.v1.';
const serverCacheMemory = {};
const serverCacheSeq = {};

function readServerCache(cacheKey){
  if(cacheKey in serverCacheMemory) return serverCacheMemory[cacheKey];
  try {
    const json = localStorage.getItem(SERVER_CACHE_PREFIX + cacheKey);
    if(json !== null) serverCacheMemory[cacheKey] = json;
    return json;
  } catch(e) {
    return null;
  }
}

function writeServerCache(cacheKey, json){
  serverCacheMemory[cacheKey] = json;
  try { localStorage.setItem(SERVER_CACHE_PREFIX + cacheKey, json); } catch(e) {}
}

function callGASCached(cacheKey, funcName, onData, options = {}){
  const seq = (serverCacheSeq[cacheKey] || 0) + 1;
  serverCacheSeq[cacheKey] = seq;

  let shown = null;
  if(!options.refresh){
    const cached = readServerCache(cacheKey);
    if(cached !== null){
      try {
        onData(JSON.parse(cached));
        shown = cached;
      } catch(e) {}
    }
  }

  const viewId = options.viewId;
  if(viewId){
    if(shown !== null || options.refresh) showRefreshIndicator(viewId);
    else showInlineLoading(viewId, '読み込み中...');
  }
  const done = function(){
    if(!viewId) return;
    hideInlineLoading(viewId);
    hideRefreshIndicator(viewId);
  };

  google.script.run
    .withSuccessHandler(function(data){
      if(serverCacheSeq[cacheKey] !== seq) return;
      done();
      const json = JSON.stringify(data ?? null);
      writeServerCache(cacheKey, json);
      if(json !== shown) onData(data);
    })
    .withFailureHandler(function(error){
      if(serverCacheSeq[cacheKey] !== seq) return;
      done();
      showError(error && error.message ? error.message : (options.errorMessage || '通信に失敗しました'));
    })[funcName]();
}

// 「最新の情報を確認中」（画面の見出しの横。キャッシュを表示したまま取り直しているとき）
function showRefreshIndicator(viewId){
  const view = document.getElementById(viewId);
  if(!view || view.querySelector('.refresh-indicator')) return;
  const indicator = document.createElement('span');
  indicator.className = 'refresh-indicator';
  indicator.innerHTML = '<span class="inline-spinner"></span><span>最新の情報を確認中...</span>';
  const heading = view.querySelector('h3');
  if(heading) heading.appendChild(indicator);
  else view.prepend(indicator);
}

function hideRefreshIndicator(viewId){
  const view = document.getElementById(viewId);
  const indicator = view && view.querySelector('.refresh-indicator');
  if(indicator) indicator.remove();
}

//////////////////////////////
// タブ切替
//////////////////////////////
function showTab(tabId){

  // メニューから開いたときは「戻る」の履歴を消す（詳細画面の移動・戻るでは残す）
  if(!navigating) navHistory.length = 0;
  navEntry = function(){ showTab(tabId); };

  let targetView = document.getElementById(tabId);
  if(!targetView){
    targetView = document.querySelector('.view');
  }
  if(!targetView) return;

  const buttons = document.querySelectorAll('.tabs button');
  buttons.forEach(b => b.classList.remove('active'));

  const activeButton = document.querySelector(`.tabs button[data-tab="${tabId}"]`);
  if(activeButton) activeButton.classList.add('active');

  document.querySelectorAll('.view')
    .forEach(v => v.style.display = 'none');

  applyAppMode(getModeOfView(targetView.id));

  resetViewState(targetView);
  targetView.style.display = 'block';

  clearGlobalMessage();

  const loaders = {
    HomeView: function(){ loadHomeView(); },
    PhotoImportView: loadPhotoImportView,
    WishListView: loadWishListView,
    ReleaseView: loadReleaseView,
    SeriesListView: function(){ loadSeriesList(); },
    TitleListView: function(){ loadTitleList(); },
    BoxListView: function(){ loadBoxList(); },
    LibraryListView: function(){ loadLibraryList(); loadLibraryAddForm(); },
    AnimeWatchingView: loadAnimeWatchingView,
    AnimeSeasonView: loadAnimeSeasonView,
    AnimeListView: loadAnimeListView
  };

  // サマリー・最近追加は書籍モードのときだけ表示・更新する
  if(appMode === 'book'){
    loadLibrarySummary('libraryGlobal');
    loadRecentLibrary('globalRecentLibraryTable');
  }

  if(loaders[tabId]) loaders[tabId]();
  updateDetailBackButtons();
}

//////////////////////////////
// 詳細画面（作品別・シリーズ別・箱別）への移動と「戻る」
// 一覧や詳細の中のリンクから ID を指定して開く。開く前の画面を navHistory に積み、[← 戻る] で開き直す
//////////////////////////////
const NAV_HISTORY_LIMIT = 20;
const navHistory = [];      // { reopen: 開き直す関数, mode: そのときのモード }
let navEntry = null;     // 今の画面を開き直す関数
let navigating = false;  // 詳細への移動・戻るの最中（showTab で履歴を消さない）

function openDetail(viewId, show){
  const reopen = function(){
    navigating = true;
    try { showTab(viewId); } finally { navigating = false; }
    navEntry = reopen;
    show();
    updateDetailBackButtons();
  };
  if(navEntry){
    // 共通の画面（シリーズ）はモードを切り替えないため、戻るときのモードも覚えておく
    navHistory.push({ reopen: navEntry, mode: appMode });
    if(navHistory.length > NAV_HISTORY_LIMIT) navHistory.shift();
  }
  closeSidebar();
  reopen();
}

function backFromDetail(){
  const previous = navHistory.pop();
  if(!previous) return;
  applyAppMode(previous.mode);
  navigating = true;
  try { previous.reopen(); } finally { navigating = false; }
  updateDetailBackButtons();
}

function updateDetailBackButtons(){
  document.querySelectorAll('.detail-back').forEach(btn => {
    btn.style.display = navHistory.length > 0 ? '' : 'none';
  });
}

function openTitleDetail(titleId){
  const id = String(titleId ?? '').trim();
  if(!id) return;
  openDetail('TitleView', function(){
    const title = (masterCache.titleOptions || []).find(t => String(t.id) === id);
    document.getElementById('titleViewSelectInput').value = title ? getTitleLabel(title) : '';
    showTitle(id);
  });
}

function openSeriesDetail(seriesId){
  const id = String(seriesId ?? '').trim();
  if(!id) return;
  openDetail('SeriesView', function(){
    const series = (masterCache.seriesOptions || []).find(s => String(s.id) === id);
    document.getElementById('seriesSelectInput').value = series ? series.name : '';
    showSeries(id);
  });
}

function openBoxDetail(boxId){
  const id = String(boxId ?? '').trim();
  if(!id) return;
  openDetail('BoxView', function(){
    const box = (masterCache.boxOptions || []).find(b => String(b.id) === id);
    document.getElementById('boxViewSelectInput').value = box ? `${box.id} : ${box.place}` : id;
    showBox(id);
  });
}

// 表のセルに置くリンク（詳細画面へ移動）
function createCellLink(text, onClick){
  const link = document.createElement('a');
  link.href = '#';
  link.className = 'table-link';
  link.textContent = text;
  link.addEventListener('click', function(event){
    event.preventDefault();
    onClick();
  });
  return link;
}

//////////////////////////////
// メッセージ管理
//////////////////////////////
let messageTimeout = null;

function clearGlobalMessage(){
  const notification = document.getElementById('globalNotification');
  if(!notification) return;
  notification.textContent = '';
  notification.className = 'notification';
  notification.style.display = 'none';
  if(messageTimeout){
    clearTimeout(messageTimeout);
    messageTimeout = null;
  }
}

function showSuccess(message){
  const notification = document.getElementById('globalNotification');
  if(!notification) return;
  notification.textContent = message;
  notification.className = 'notification success';
  notification.style.display = 'block';
  if(messageTimeout) clearTimeout(messageTimeout);
  messageTimeout = setTimeout(clearGlobalMessage, 4000);
}

function showError(message){
  const notification = document.getElementById('globalNotification');
  if(!notification) return;
  notification.textContent = message;
  notification.className = 'notification error';
  notification.style.display = 'block';
  if(messageTimeout) clearTimeout(messageTimeout);
  messageTimeout = setTimeout(clearGlobalMessage, 6000);
}

function showInlineLoading(containerId, message = '検索中...'){
  const container = document.getElementById(containerId);
  if(!container) return null;

  let loader = container.querySelector('.inline-loading');
  if(!loader){
    loader = document.createElement('div');
    loader.className = 'inline-loading';
    loader.innerHTML = `
      <span class="inline-spinner"></span>
      <span class="inline-loading-text">${message}</span>
    `;
    container.appendChild(loader);
  } else {
    const text = loader.querySelector('.inline-loading-text');
    if(text) text.textContent = message;
    loader.style.display = 'inline-flex';
  }

  return loader;
}

function hideInlineLoading(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;

  const loader = container.querySelector('.inline-loading');
  if(loader) loader.remove();
}

window.showInlineLoading = showInlineLoading;
window.hideInlineLoading = hideInlineLoading;

function shouldTruncateTableText(fieldName){
  const normalized = String(fieldName || '').toLowerCase();
  if(!normalized) return false;
  return normalized === 'name'
    || normalized === 'title'
    || normalized === 'series'
    || normalized === 'seriesname'
    || normalized.endsWith('name')
    || normalized.endsWith('series')
    || normalized.includes('seriesname')
    || normalized.includes('title');
}

function getDisplayTableValue(value, fieldName){
  const text = value == null ? '' : String(value);
  // スマホ幅ではセル内で折り返すため省略しない
  const isPhone = window.matchMedia('(max-width: 720px)').matches;
  if(isPhone || !shouldTruncateTableText(fieldName) || text.length <= 20){
    return text;
  }

  return text.slice(0, 20) + '…';
}

function getPreferredColumnWidth(fieldName){
  const normalized = String(fieldName || '').toLowerCase();

  if(normalized === 'owned') return '24%';
  if(normalized.includes('series') || normalized.includes('title') || normalized.includes('name')) return '36%';
  if(normalized.includes('id') || normalized === 'seriesid' || normalized === 'titleid' || normalized === 'boxid') return '10%';
  if(normalized.includes('volume') || normalized.includes('count') || normalized === '巻数' || normalized === '巻') return '12%';
  if(normalized.includes('box') || normalized.includes('place')) return '14%';
  if(normalized.includes('type')) return '12%';
  if(normalized.includes('complete') || normalized.includes('done')) return '10%';
  if(normalized.includes('date')) return '14%';
  return '16%';
}

function applyColumnWidthHints(table){
  if(!table) return;

  const headers = Array.from(table.querySelectorAll('thead th'));
  if(headers.length === 0) return;

  const rows = table.querySelectorAll('tbody tr');
  const firstRowCells = rows.length > 0 ? rows[0].cells : [];

  headers.forEach((header, index) => {
    const fieldName = header.dataset.field || (firstRowCells[index] && firstRowCells[index].dataset.field) || '';
    const width = getPreferredColumnWidth(fieldName || header.textContent || '');
    header.style.width = width;
    header.style.maxWidth = width;

    Array.from(table.querySelectorAll('tbody tr')).forEach(row => {
      const cell = row.cells[index];
      if(cell){
        cell.style.width = width;
        cell.style.maxWidth = width;
      }
    });
  });
}

//////////////////////////////
// [編集] ボタン生成（一覧描画・取消後で共通）
//////////////////////////////
function createEditButton(){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'edit-action';
  btn.textContent = '編集';
  btn.onclick = function(){ startEdit(this); };
  return btn;
}

//////////////////////////////
// テーブル描画（編集なし・検索用）
// links: { 列キー: row => 処理 }（指定した列はリンクにする。値が空の行はリンクなし）
//////////////////////////////
function renderTableReadOnly(tableId, data, columns, links = {}) {
  const table = document.getElementById(tableId);
  if(!table) return;

  const tbody = table.querySelector('tbody');
  tbody.innerHTML = '';

  if(!Array.isArray(data) || data.length === 0){
    table.style.display = 'none';
    return;
  }

  data.forEach(row => {
    const tr = document.createElement('tr');

    columns.forEach(col => {
      const td = document.createElement('td');
      const rawValue = row[col] ?? '';
      const text = getDisplayTableValue(rawValue, col);
      if(links[col] && String(rawValue) !== ''){
        td.appendChild(createCellLink(text, () => links[col](row)));
      } else {
        td.textContent = text;
      }
      td.title = String(rawValue);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  applyColumnWidthHints(table);
  table.style.display = 'table';
}

//////////////////////////////
// ページネーション付きマスタ描画
//////////////////////////////
function renderPagedTableDOM(options){
  // options:
  // tableId, data, columns, currentPage, pageSize, totalRows, onPageChange, editable, idKey
  // columns: 列キーの配列、または createListFilter の列定義（{ key, edit, link, button }）の配列

  const { tableId, data, columns, currentPage, pageSize, totalRows, onPageChange, editable, idKey } = options;

  const tbody = document.getElementById(tableId).querySelector('tbody');
  tbody.innerHTML = ''; // tbody は clear してもOK
  // 列名（スマホ幅のカード表示でセルの見出しにする。CSS の td::before { content: attr(data-label) }）
  const labels = Array.from(document.getElementById(tableId).querySelectorAll('thead th')).map(th => th.textContent.trim());

  data.forEach(row => {
    const tr = document.createElement('tr');
    if(idKey) tr.dataset.id = String(row[idKey] ?? '');

    columns.forEach((column, index) => {
      const col = typeof column === 'string' ? column : column.key;
      const td = document.createElement('td');
      td.dataset.label = labels[index] || '';
      const rawValue = row[col] ?? '';
      const text = getDisplayTableValue(rawValue, col);
      // 列定義の button: row => { label, onClick(btn), className } または null（行ごとの操作ボタン）
      if(column.button){
        const action = column.button(row);
        if(action){
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = action.className || 'anime-action';
          btn.textContent = action.label;
          btn.onclick = function(){ action.onClick(btn); };
          td.appendChild(btn);
        }
        td.dataset.field = col;
        tr.appendChild(td);
        return;
      }
      // 列定義の link: row => 処理（詳細画面へのリンク）
      if(column.link && String(rawValue) !== ''){
        td.appendChild(createCellLink(text, () => column.link(row)));
      } else {
        td.textContent = text;
      }
      td.title = String(rawValue);
      td.dataset.field = col;
      // 編集時の初期値（表示は省略・整形されるため元の値を持たせる）
      if(editable && column.edit){
        td.dataset.editValue = String((typeof column.edit === 'function' ? column.edit(row) : rawValue) ?? '');
      }
      tr.appendChild(td);
    });

    if(editable){
      const actionTd = document.createElement('td');
      actionTd.className = 'row-actions';
      appendRowActions(actionTd, tableId);
      tr.appendChild(actionTd);
    }

    tbody.appendChild(tr);
  });

  const table = document.getElementById(tableId);
  if(table) applyColumnWidthHints(table);

  // ページネーション表示
  const paginationDivId = tableId + "_pagination";
  let paginationDiv = document.getElementById(paginationDivId);

  if(!paginationDiv){
    paginationDiv = document.createElement('div');
    paginationDiv.id = paginationDivId;
    paginationDiv.className = 'pagination-bar';
    paginationDiv.style.marginTop = "10px";
    document.getElementById(tableId).after(paginationDiv);
  }

  paginationDiv.innerHTML = '';

  const totalPages = Math.ceil(totalRows / pageSize);
  if(totalPages <= 1) return;

  const maxButtons = 5; // ← 表示する中央ページ数
  const half = Math.floor(maxButtons / 2);

  let startPage = Math.max(1, currentPage - half);
  let endPage   = Math.min(totalPages, currentPage + half);

  if(endPage - startPage < maxButtons - 1){
    if(startPage === 1){
      endPage = Math.min(totalPages, startPage + maxButtons - 1);
    } else if(endPage === totalPages){
      startPage = Math.max(1, endPage - maxButtons + 1);
    }
  }

  // 「前へ」
  if(currentPage > 1){
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '« 前へ';
    prevBtn.onclick = () => onPageChange(currentPage - 1);
    prevBtn.style.marginRight = '5px';
    paginationDiv.appendChild(prevBtn);
  }

  // 先頭ページ + 省略
  if(startPage > 1){
    const firstBtn = document.createElement('button');
    firstBtn.textContent = 1;
    firstBtn.onclick = () => onPageChange(1);
    firstBtn.style.marginRight = '5px';
    paginationDiv.appendChild(firstBtn);

    if(startPage > 2){
      const dots = document.createElement('span');
      dots.textContent = '...';
      dots.style.marginRight = '5px';
      paginationDiv.appendChild(dots);
    }
  }

  // 中央ページ群
  for(let p = startPage; p <= endPage; p++){
    if(p === currentPage){
      const span = document.createElement('span');
      span.textContent = p;
      span.style.fontWeight = 'bold';
      span.style.marginRight = '5px';
      paginationDiv.appendChild(span);
    } else {
      const btn = document.createElement('button');
      btn.textContent = p;
      btn.style.marginRight = '5px';
      btn.onclick = () => onPageChange(p);
      paginationDiv.appendChild(btn);
    }
  }

  // 末尾ページ + 省略
  if(endPage < totalPages){
    if(endPage < totalPages - 1){
      const dots = document.createElement('span');
      dots.textContent = '...';
      dots.style.marginRight = '5px';
      paginationDiv.appendChild(dots);
    }

    const lastBtn = document.createElement('button');
    lastBtn.textContent = totalPages;
    lastBtn.onclick = () => onPageChange(totalPages);
    lastBtn.style.marginRight = '5px';
    paginationDiv.appendChild(lastBtn);
  }

  // 「次へ」
  if(currentPage < totalPages){
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '次へ »';
    nextBtn.onclick = () => onPageChange(currentPage + 1);
    paginationDiv.appendChild(nextBtn);
  }

}

//////////////////////////////
// 日付フォーマット
//////////////////////////////
function formatDate(date){
  if(!date) return '';
  const d = new Date(date);
  if(isNaN(d)) return '';
  return d.getFullYear() + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' +
         String(d.getDate()).padStart(2,'0');
}

//////////////////////////////
// トグル切り替え
//////////////////////////////
// 同一 View 内のフォームを閉じる
function closeMasterForms(view){
  if(!view) return;

  view.querySelectorAll('.master-form')
    .forEach(f => f.style.display = 'none');
}

// 指定フォームの表示をトグル（他のフォームは閉じる）
// 戻り値: フォームを開いたら true
function toggleMasterForm(id){
  const form = document.getElementById(id);
  if(!form) return false;

  const view = form.closest('.view') || form.parentElement;
  const wasHidden = form.style.display === 'none';
  closeMasterForms(view);

  form.style.display = wasHidden ? 'block' : 'none';
  syncMasterToolbarLayout(view);
  return wasHidden;
}

function toggleAddForm(id){
  return toggleMasterForm(id);
}

function toggleSearchForm(id){

function syncMasterToolbarLayout(view){

///////////////////////////////
// 選択肢取得
///////////////////////////////
function populateSelect(selectIds, data, labelFn, valueKey = 'id', placeholderText = null, clear = true){

  if(!Array.isArray(selectIds)) {
    selectIds = [selectIds];
  }

  selectIds.forEach(id => {
    const sel = document.getElementById(id);
    if(!sel) return;

    if(clear) sel.innerHTML = '';

    if(placeholderText){
      const placeholder = new Option(placeholderText, '');
      placeholder.disabled = true;
      placeholder.selected = true;
      sel.add(placeholder);
    }

    data.forEach(item => {
      const option = new Option(
        labelFn(item),
        item[valueKey]
      );
      sel.add(option);
    });
  });
}

function showAutocompleteSuggestions(inputId, data, labelFn, valueKey = 'id'){
  const input = document.getElementById(inputId);
  if(!input) return;

  const listId = input.getAttribute('list') || (inputId + 'List');
  const list = document.getElementById(listId);
  const suggestionBoxId = inputId + 'Suggestions';
  let suggestionBox = document.getElementById(suggestionBoxId);
  if(!suggestionBox){
    suggestionBox = document.createElement('div');
    suggestionBox.id = suggestionBoxId;
    suggestionBox.className = 'autocomplete-suggestions';
    input.parentNode.insertBefore(suggestionBox, input.nextSibling);
  }

  const keyword = input.value.trim().toLowerCase();
  const matches = !keyword
    ? data
    : data.filter(item => String(labelFn(item)).toLowerCase().includes(keyword));

  suggestionBox.innerHTML = '';
  if(!list) return;

  if(matches.length === 0){
    const empty = document.createElement('div');
    empty.className = 'autocomplete-empty';
    empty.textContent = '該当なし';
    suggestionBox.appendChild(empty);
    suggestionBox.style.display = 'block';
    return;
  }

  matches.slice(0, 10).forEach(item => {
    const option = document.createElement('button');
    option.type = 'button';
    option.className = 'autocomplete-item';
    option.textContent = labelFn(item);
    option.addEventListener('click', function(){
      input.value = labelFn(item);
      input.dataset.selectedId = String(item[valueKey]);
      suggestionBox.style.display = 'none';
    });
    suggestionBox.appendChild(option);
  });

  suggestionBox.style.display = 'block';
}

function populateAutocomplete(inputId, data, labelFn, valueKey = 'id', placeholderText = ''){
  const input = document.getElementById(inputId);
  const listId = input ? input.getAttribute('list') : null;
  const list = listId ? document.getElementById(listId) : document.getElementById(inputId + 'List');
  if(!input || !list) return;

  input.placeholder = placeholderText || '選択肢を入力';
  list.innerHTML = '';

  data.forEach(item => {
    const option = document.createElement('option');
    option.value = labelFn(item);
    option.dataset.value = String(item[valueKey]);
    list.appendChild(option);
  });

  input.oninput = function(){
    const match = findDatalistOption(list, input.value);
    input.dataset.selectedId = match ? match.dataset.value : '';
    showAutocompleteSuggestions(inputId, data, labelFn, valueKey);
  };

  input.onfocus = function(){
    showAutocompleteSuggestions(inputId, data, labelFn, valueKey);
  };

  input.onblur = function(){
    setTimeout(() => {
      const box = document.getElementById(inputId + 'Suggestions');
      if(box) box.style.display = 'none';
    }, 120);
  };
}

// datalist から入力値に対応する候補を探す
// 完全一致（大文字小文字無視）を優先し、なければ部分一致が 1 件のときだけ採用。
// 部分一致が複数ある場合は取り違えを防ぐため未選択（null）扱い
function findDatalistOption(list, value){
  const keyword = String(value || '').trim().toLowerCase();
  if(!list || !keyword) return null;

  const options = Array.from(list.options);
  const exact = options.find(opt => opt.value.trim().toLowerCase() === keyword);
  if(exact) return exact;

  const partial = options.filter(opt => opt.value.toLowerCase().includes(keyword));
  return partial.length === 1 ? partial[0] : null;
}

function getAutocompleteValue(inputId){
  const input = document.getElementById(inputId);
  const listId = input ? input.getAttribute('list') : null;
  const list = listId ? document.getElementById(listId) : document.getElementById(inputId + 'List');
  if(!input || !list) return '';

  const value = input.value.trim();
  if(!value) return '';

  const match = findDatalistOption(list, value);

  if(match){
    input.dataset.selectedId = match.dataset.value;
    return match.dataset.value;
  }

  input.dataset.selectedId = '';
  return '';
}

///////////////////////////////
// 一覧のインライン編集・削除
// createListFilter の edit オプションで有効にする。設定は tableId ごとに保持
//   edit: {
//     update: 'updateXxx',   … 保存時に呼ぶサーバー関数（id, values）。values は edit 指定の列の順
//     remove: 'deleteXxx',   … 指定すると [削除] を表示（2 回押しで確定）
//     onSaved()              … 保存・削除の成功後の処理（一覧の取り直しなど）。
//                              その前に、入力した値で行を書き換え（削除なら行を消し）て再描画しておく
//   }
// 列定義の edit: true（列の値をそのまま編集）／関数（行から編集の初期値を返す）
// editOptions: [...] を指定した列は選択式で編集する
///////////////////////////////
const listEditConfigs = {};

function getListEditConfig(el){
  const table = el.closest('table');
  return table ? listEditConfigs[table.id] : null;
}

// 行の操作ボタン（[編集]、削除できる一覧は [削除] も）
function appendRowActions(actionTd, tableId){
  const config = listEditConfigs[tableId];
  actionTd.appendChild(createEditButton());
  if(config && config.remove){
    actionTd.appendChild(createDeleteButton(deleteListRow));
  }
}

function startEdit(btn){
  const tr = btn.closest('tr');
  const config = getListEditConfig(tr);
  if(!config) return;

  tr.classList.add('editing');
  const headers = tr.closest('table').querySelectorAll('thead th');

  Array.from(tr.cells).forEach((td, index) => {
    const column = config.columns[index];
    if(!column || !column.edit) return;

    const value = td.dataset.editValue ?? td.textContent;
    // 取消でリンクごと元に戻せるよう、表示中の要素を退避
    td.originalNodes = Array.from(td.childNodes);

    let input;
    if(column.editOptions){
      // 選択肢にない値（未設定など）も元の値として残す
      input = document.createElement('select');
      const values = column.editOptions.includes(value) ? column.editOptions : [value].concat(column.editOptions);
      values.forEach(v => input.add(new Option(v || '（未設定）', v)));
      input.value = value;
    } else {
      input = document.createElement('input');
      input.type = 'text';
      input.value = value;
      input.placeholder = headers[index] ? headers[index].textContent : '';
    }

    td.textContent = '';
    td.appendChild(input);
  });

  // 操作ボタン列を書き換え
  const actionTd = tr.cells[tr.cells.length - 1];
  actionTd.textContent = '';

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.textContent = '保存';
  saveBtn.addEventListener('click', function(){
    saveEdit(this);
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.textContent = '取消';
  cancelBtn.style.marginLeft = '5px';
  cancelBtn.addEventListener('click', function(){
    cancelEdit(this);
  });

  actionTd.appendChild(saveBtn);
  actionTd.appendChild(cancelBtn);
}

function cancelEdit(btn){
  const tr = btn.closest('tr');
  const config = getListEditConfig(tr);
  tr.classList.remove('editing');

  Array.from(tr.cells).forEach((td, index) => {
    const column = config && config.columns[index];
    if(!column || !column.edit) return;
    td.replaceChildren(...(td.originalNodes || []));
  });

  // 操作列を戻す
  const actionTd = tr.cells[tr.cells.length - 1];
  actionTd.textContent = '';
  appendRowActions(actionTd, tr.closest('table').id);
}

function saveEdit(btn){
  const tr = btn.closest('tr');
  const config = getListEditConfig(tr);
  if(!config) return;

  const values = Array.from(tr.cells)
    .filter((td, index) => config.columns[index] && config.columns[index].edit)
    .map(td => {
      const input = td.querySelector('input, select');
      return input ? input.value : td.dataset.editValue;
    });

  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        showSuccess(res.message);
        // 取り直しを待たずに、入力した値で行を書き換えておく
        if(config.filter) config.filter.updateRow(tr.dataset.id, buildEditPatch(config.columns, values));
        if(config.onSaved) config.onSaved();
      } else {
        btn.disabled = false;
        showError(res?.message || '更新に失敗しました');
      }
    })
    .withFailureHandler(function(error){
      btn.disabled = false;
      showError(error && error.message ? error.message : '更新に失敗しました');
    })[config.update](tr.dataset.id, values);
}

// 保存した値を行に反映するための差分（edit: true の列だけ。関数で初期値を作る列は表示の形が違うので取り直しを待つ）
// values: 編集した列（edit 指定の列）の順の入力値
function buildEditPatch(columns, values){
  const patch = {};
  columns.filter(column => column && column.edit).forEach((column, index) => {
    if(column.edit === true) patch[column.key] = values[index];
  });
  return patch;
}

// 削除ボタン（誤操作防止のため 2 回押しで確定。4 秒で元に戻る）
// onConfirm(btn): 確定時の処理
function createDeleteButton(onConfirm){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'delete-action';
  btn.textContent = '削除';

  let resetTimer = null;
  btn.addEventListener('click', function(){
    if(!btn.classList.contains('is-confirm')){
      btn.classList.add('is-confirm');
      btn.textContent = '本当に削除';
      resetTimer = setTimeout(() => {
        btn.classList.remove('is-confirm');
        btn.textContent = '削除';
      }, 4000);
      return;
    }

    clearTimeout(resetTimer);
    onConfirm(btn);
  });

  return btn;
}

function deleteListRow(btn){
  const tr = btn.closest('tr');
  const config = getListEditConfig(tr);
  if(!config || !config.remove) return;

  btn.disabled = true;
  btn.textContent = '削除中...';

  const restore = function(message){
    btn.disabled = false;
    btn.classList.remove('is-confirm');
    btn.textContent = '削除';
    showError(message);
  };

  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        showSuccess(res.message);
        if(config.filter) config.filter.removeRow(tr.dataset.id);
        if(config.onSaved) config.onSaved();
      } else {
        restore(res?.message || '削除に失敗しました');
      }
    })
    .withFailureHandler(function(error){
      restore(error && error.message ? error.message : '削除に失敗しました');
    })[config.remove](tr.dataset.id);
}

//////////////////////////////
// 一覧の絞り込み・並べ替え・ページング（クライアント側）
// テーブルの直前に絞り込み欄（キーワード＋項目ごとの選択）を作り、見出しのクリックで並べ替える。
// options: {
//   tableId, pageSize,
//   columns: [{ key, compare?: (a, b) => number }]  … テーブルの列順。compare 省略時は値で比較
//   keywordKeys: ['name', ...]                      … キーワードの検索対象
//   filters: [{ key, label, options?: [...] }]      … 選択式フィルタ。options 省略時は行の値から作る
//   defaultSort: { key, dir: 'asc' | 'desc' }
//   idKey: 'id'                                    … 行の ID（編集・削除でサーバーに渡す）
//   edit: { update, remove?, onSaved }               … 行の [編集]・[削除]（listEditConfigs 参照）。
//                                                     列定義に edit / editOptions を指定し、表の最後に操作列の見出しを置く
// }
// 戻り値: {
//   setRows(rows)          … 行を入れ替えて再描画（絞り込み条件・ページは保持）
//   updateRow(id, patch)   … ID の行に patch の値を上書きして再描画
//   updateRows(ids, patch) … 複数の行に同じ patch を上書きして再描画
//   getFilteredRows()      … キーワード・絞り込みに合う行（全ページ分。並べ替え前）
//   removeRow(id)          … ID の行を消して再描画
// }
//////////////////////////////
function createListFilter(options){
  const table = document.getElementById(options.tableId);
  if(options.edit){
    listEditConfigs[options.tableId] = Object.assign({ columns: options.columns }, options.edit);
  }
  const state = {
    rows: [],
    keyword: '',
    values: {},
    sort: options.defaultSort ? Object.assign({}, options.defaultSort) : null,
    page: 1
  };

  // 絞り込み欄
  const panel = document.createElement('div');
  panel.className = 'list-filter';

  const keywordInput = document.createElement('input');
  keywordInput.type = 'search';
  keywordInput.className = 'list-filter-keyword';
  keywordInput.placeholder = 'キーワードで絞り込み';
  keywordInput.oninput = function(){
    state.keyword = keywordInput.value.trim().toLowerCase();
    state.page = 1;
    render();
  };
  panel.appendChild(keywordInput);

  const selects = {};
  (options.filters || []).forEach(filter => {
    const select = document.createElement('select');
    select.className = 'list-filter-select';
    select.onchange = function(){
      state.values[filter.key] = select.value;
      state.page = 1;
      render();
    };
    selects[filter.key] = select;
    panel.appendChild(select);
  });

  const footer = document.createElement('div');
  footer.className = 'list-filter-footer';
  const count = document.createElement('span');
  count.className = 'list-filter-count';
  const clear = document.createElement('button');
  clear.type = 'button';
  clear.className = 'list-filter-clear';
  clear.textContent = 'クリア';
  clear.onclick = function(){
    state.keyword = '';
    state.values = {};
    keywordInput.value = '';
    Object.values(selects).forEach(select => { select.value = ''; });
    state.page = 1;
    render();
  };
  footer.appendChild(count);
  footer.appendChild(clear);
  panel.appendChild(footer);

  table.parentNode.insertBefore(panel, table);

  // スマホ幅では 1 行を 1 枚のカードで表示する（Styles.html の table.card-list）
  table.classList.add('card-list');

  // 見出しクリックで並べ替え（同じ列をもう一度押すと逆順）
  const headers = Array.from(table.querySelectorAll('thead th'));
  headers.forEach((th, index) => {
    const column = options.columns[index];
    if(!column || column.button) return;
    th.classList.add('sortable');
    th.onclick = function(){
      if(state.sort && state.sort.key === column.key){
        state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sort = { key: column.key, dir: 'asc' };
      }
      state.page = 1;
      render();
    };
  });

  function fillSelectOptions(){
    (options.filters || []).forEach(filter => {
      const select = selects[filter.key];
      const values = filter.options || Array.from(new Set(
        state.rows.map(row => String(row[filter.key] ?? '').trim()).filter(Boolean)
      )).sort((a, b) => a.localeCompare(b, 'ja', { numeric: true }));
      const current = state.values[filter.key] || '';

      select.innerHTML = '';
      const all = document.createElement('option');
      all.value = '';
      all.textContent = `${filter.label}: すべて`;
      select.appendChild(all);
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = `${filter.label}: ${value}`;
        select.appendChild(option);
      });
      select.value = values.includes(current) ? current : '';
      if(select.value !== current) state.values[filter.key] = select.value;
    });
  }

  function compareValues(a, b){
    const textA = String(a ?? '');
    const textB = String(b ?? '');
    const numA = Number(textA);
    const numB = Number(textB);
    if(textA !== '' && textB !== '' && !isNaN(numA) && !isNaN(numB)) return numA - numB;
    return textA.localeCompare(textB, 'ja', { numeric: true });
  }

  // キーワード・絞り込みに合う行（全ページ分）
  function getFilteredRows(){
    const keys = options.keywordKeys || options.columns.map(c => c.key);
    return state.rows.filter(row => {
      if(state.keyword && !keys.some(key => String(row[key] ?? '').toLowerCase().includes(state.keyword))){
        return false;
      }
      return (options.filters || []).every(filter => {
        const value = state.values[filter.key];
        return !value || String(row[filter.key] ?? '').trim() === value;
      });
    });
  }

  function render(){
    const filtered = getFilteredRows();

    if(state.sort){
      const column = options.columns.find(c => c.key === state.sort.key) || { key: state.sort.key };
      const direction = state.sort.dir === 'desc' ? -1 : 1;
      filtered.sort((a, b) => direction * (column.compare
        ? column.compare(a, b)
        : compareValues(a[column.key], b[column.key])));
    }

    headers.forEach((th, index) => {
      const column = options.columns[index];
      const active = column && state.sort && state.sort.key === column.key;
      th.classList.toggle('sort-asc', !!active && state.sort.dir === 'asc');
      th.classList.toggle('sort-desc', !!active && state.sort.dir === 'desc');
    });

    const pageSize = options.pageSize || 20;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if(state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * pageSize;

    renderPagedTableDOM({
      tableId: options.tableId,
      data: filtered.slice(start, start + pageSize),
      columns: options.columns,
      currentPage: state.page,
      pageSize,
      totalRows: filtered.length,
      editable: !!options.edit,
      idKey: options.idKey || 'id',
      onPageChange: page => { state.page = page; render(); }
    });

    const filteredOut = filtered.length !== state.rows.length;
    count.textContent = filteredOut
      ? `${filtered.length}件 ／ 全${state.rows.length}件`
      : `全${state.rows.length}件`;
    clear.style.display = (state.keyword || Object.values(state.values).some(Boolean)) ? '' : 'none';
  }

  const idKey = options.idKey || 'id';
  const api = {
    setRows(rows){
      state.rows = rows || [];
      // 編集中の行があるときは描き直さない（裏で取り直した結果で入力中の内容を消さない）
      if(table.querySelector('tr.editing')) return;
      fillSelectOptions();
      render();
    },
    updateRow(id, patch){
      api.updateRows([id], patch);
    },
    updateRows(ids, patch){
      const targets = new Set(ids.map(String));
      const rows = state.rows.filter(r => targets.has(String(r[idKey])));
      if(rows.length === 0) return;
      rows.forEach(row => Object.assign(row, patch));
      fillSelectOptions();
      render();
    },
    getFilteredRows(){
      return getFilteredRows();
    },
    removeRow(id){
      state.rows = state.rows.filter(r => String(r[idKey]) !== String(id));
      fillSelectOptions();
      render();
    }
  };
  if(listEditConfigs[options.tableId]) listEditConfigs[options.tableId].filter = api;
  return api;
}

//////////////////////////////
// 書籍のまとまり（Box・シリーズ）の集計の表示
//////////////////////////////
// summary: サーバーの summarizeLibraryRows の結果 → [[見出し, 値], ...]（DOM を使わない）
function formatGroupSummaryLines(summary){
  const s = summary || {};
  if(!s.books) return [['冊数', '書籍は登録されていません']];
  const types = [s.manga ? `漫画 ${s.manga}` : '', s.novel ? `ラノベ ${s.novel}` : ''].filter(Boolean).join('・');
  return [
    ['冊数', `${s.books}冊${types ? `（${types}）` : ''}`],
    ['作品', `${s.titles}作品`],
    ['積読', `${s.unread || 0}冊${s.reading ? `（読書中 ${s.reading}冊）` : ''}`],
    ['最終追加', s.lastAdded || '-']
  ];
}

// lines: [[見出し, 値, className?], ...] を所持状況と同じ形（.ownership-line）で表示
function renderSummaryLines(containerId, lines){
  const box = document.getElementById(containerId);
  if(!box) return;
  box.innerHTML = '';
  lines.forEach(([label, value, className]) => {
    const line = document.createElement('div');
    line.className = `ownership-line ${className || ''}`.trim();
    const strong = document.createElement('strong');
    strong.textContent = label;
    const span = document.createElement('span');
    span.textContent = value;
    line.appendChild(strong);
    line.appendChild(span);
    box.appendChild(line);
  });
  box.style.display = 'block';
}

// 読書状況（サーバーの ReadService.js と同じ値）
//////////////////////////////
const READ_STATUS_OPTIONS = ['未読', '読書中', '読了'];

// 次に読む巻（読書中の巻、なければ未読のうち最小の巻）。サーバーの getNextReadVolume と同じ判定
// rows: [{ id, volume, read }] → 該当する要素（なければ null）
function pickNextReadVolume(rows){
  const sorted = (rows || []).slice().sort((a, b) => compareVolumes(a.volume, b.volume));
  return sorted.find(row => row.read === '読書中') || sorted.find(row => row.read === '未読') || null;
}

// 書籍の読書状況を変更（ids: LibraryID の配列）。成功したら onDone(res)
function setReadStatus(ids, status, onDone, btn){
  if(btn) btn.disabled = true;
  callGAS('setReadStatusWeb', function(res){
    if(btn) btn.disabled = false;
    if(res && res.success){
      showSuccess(res.message);
      loadLibrarySummary('libraryGlobal');
      if(onDone) onDone(res);
    } else {
      showError(res && res.message ? res.message : '読書状況の変更に失敗しました');
    }
  }, ids, status);
}

//////////////////////////////
// 所持巻の集計（抜け・次の巻）
// 数値の巻は 1 巻から最大巻までの抜けを判定する。「上」「外伝」など数値以外の巻は別扱い
//////////////////////////////
function summarizeOwnedVolumes(volumes){
  const numbers = new Set();
  const others = new Set();

  (volumes || []).forEach(value => {
    const text = String(value ?? '').trim();
    if(!text) return;
    if(/^\d+$/.test(text)) numbers.add(Number(text));
    else others.add(text);
  });

  const sorted = Array.from(numbers).sort((a, b) => a - b);
  const max = sorted.length ? sorted[sorted.length - 1] : 0;
  const missing = [];
  for(let n = 1; n < max; n++){
    if(!numbers.has(n)) missing.push(n);
  }

  return {
    count: sorted.length + others.size,
    numbers: sorted,
    others: Array.from(others),
    max,
    missing,
    next: max + 1
  };
}

// [1,2,3,5,7,8] → "1〜3, 5, 7〜8"
function formatVolumeRanges(numbers){
  const parts = [];
  let start = null;
  let prev = null;

  (numbers || []).forEach(n => {
    if(start === null){
      start = prev = n;
      return;
    }
    if(n === prev + 1){
      prev = n;
      return;
    }
    parts.push(start === prev ? `${start}` : `${start}〜${prev}`);
    start = prev = n;
  });
  if(start !== null) parts.push(start === prev ? `${start}` : `${start}〜${prev}`);

  return parts.join(', ');
}

// 一覧用の短い表記: "1〜12巻, 上（抜け: 7巻）"
function formatOwnershipText(summary, completed){
  if(!summary || summary.count === 0) return '未所持';

  const owned = [];
  if(summary.numbers.length > 0) owned.push(`${formatVolumeRanges(summary.numbers)}巻`);
  owned.push(...summary.others);

  let text = owned.join(', ');
  if(summary.missing.length > 0){
    text += `（抜け: ${formatVolumeRanges(summary.missing)}巻）`;
  } else if(String(completed || '').trim() === '完結済' && summary.numbers.length > 0){
    text += '（完結・抜けなし）';
  }
  return text;
}

// 巻数の並べ替え用（数値の巻を昇順、その後に数値以外）
function compareVolumes(a, b){
  const textA = String(a ?? '').trim();
  const textB = String(b ?? '').trim();
  const numA = /^\d+$/.test(textA);
  const numB = /^\d+$/.test(textB);
  if(numA && numB) return Number(textA) - Number(textB);
  if(numA) return -1;
  if(numB) return 1;
  return textA.localeCompare(textB, 'ja');
}

//////////////////////////////
// 上部バーの検索（作品名 → 作品別検索を表示）
// 完全一致、なければ部分一致が 1 件のときだけ確定する
//////////////////////////////
function runGlobalSearch(){
  const input = document.getElementById('globalSearchInput');
  const keyword = input.value.trim();
  if(!keyword) return;

  const titles = masterCache.titleOptions || [];
  const lower = keyword.toLowerCase();
  let match = titles.find(t => getTitleLabel(t).trim().toLowerCase() === lower);

  if(!match){
    const partial = titles.filter(t => getTitleLabel(t).toLowerCase().includes(lower));
    if(partial.length !== 1){
      showError(partial.length > 0
        ? `「${keyword}」を含む作品が${partial.length}件あります。候補から選んでください`
        : `「${keyword}」に一致する作品がありません`);
      return;
    }
    match = partial[0];
  }

  input.value = '';
  input.blur();
  openTitleDetail(match.id);
}
