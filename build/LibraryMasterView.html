<!-- LibraryMasterView.html -->
<div id="LibraryMasterView" class="view">
  <h3>書籍マスタ管理</h3>

  <!-- ツールバー -->
  <div class="master-toolbar" style="margin-bottom:10px;">
    <button onclick="toggleAddForm('libraryAddForm')">追加</button>
    <button onclick="loadRecentLibrary()">読込</button>
  </div>

  <!-- 追加フォーム（最初は非表示） -->
  <div id="libraryAddForm" class="master-form" style="display:none;">
    <select id="titleSelect"></select>

    <input type="text" id="volumeInput" placeholder="巻数を入力">

    <select id="boxSelect"></select>

    <div>
      <button onclick="addVolume()">追加</button>
    </div>
  </div>

  <!-- 全件表示テーブル -->
  <table class="table table-striped" id="libraryMasterTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>作品名</th>
        <th>巻数</th>
        <th>Box</th>
        <th>追加日</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- 最近追加履歴 -->
  <h4>最近追加した漫画（最大5件）</h4>
  <table class="table table-striped" id="recentLibraryTable">
    <thead>
      <tr>
        <th>追加日</th>
        <th>作品名</th>
        <th>巻数</th>
        <th>Box</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
