<!-- LibraryMasterView.html -->
<div id="LibraryMasterView" class="view">
  <h3>書籍マスタ管理</h3>

  <!-- ツールバー -->
  <div class="master-toolbar" style="margin-bottom:10px; align-items: center; display: flex; flex-wrap: wrap; gap: 10px;">
    <button onclick="showTab('LibraryEntryView')">登録画面へ</button>
    <div class="search-field">
      <input id="librarySearchInput" type="text" placeholder="テーブルを検索..." oninput="filterMaster('libraryMasterTable','librarySearchInput')">
    </div>
  </div>

  <div class="summary-panel" id="libraryMasterSummary">
    <div class="summary-item">所蔵冊数: <strong id="libraryMasterTotal">0</strong></div>
    <div class="summary-item">登録作品数: <strong id="libraryMasterUnique">0</strong></div>
    <div class="summary-item">登録Box数: <strong id="libraryMasterBoxes">0</strong></div>
    <div class="summary-item">最新登録: <strong id="libraryMasterLastAdded">-</strong></div>
  </div>

  <!-- 全件表示テーブル -->
  <div class="table-responsive">
    <table class="table table-striped" id="libraryMasterTable" style="display:none;">
      <thead>
        <tr>
          <th>ID</th>
          <th>作品名</th>
          <th>巻数</th>
          <th>Box</th>
          <th>追加日</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 最近追加履歴 -->
  <h4>最近追加した漫画（最大5件）</h4>
  <table class="table table-striped" id="recentLibraryTable">
    <thead>
      <tr>
        <th>追加日</th>
        <th>作品名</th>
        <th>巻数</th>
        <th>Box</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
