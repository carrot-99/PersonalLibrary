<!-- LibraryMasterView.html -->
<div id="LibraryMasterView" class="view">
  <h3>書籍マスタ管理</h3>

  <div class="master-toolbar">
    <button onclick="toggleAddForm('libraryAddForm')">追加</button>
    <button onclick="toggleSearchForm('librarySearchForm')">検索</button>
  </div>

  <div id="libraryAddForm" class="master-form" style="display:none;">
    <input id="libraryAddTitleInput" list="libraryAddTitleList" placeholder="作品名を入力">
    <datalist id="libraryAddTitleList"></datalist>

    <input id="libraryAddVolumeInput" type="text" placeholder="巻数 例: 1-31 / 1, 3, 5-7">

    <input id="libraryAddBoxInput" list="libraryAddBoxList" placeholder="Boxを入力">
    <datalist id="libraryAddBoxList"></datalist>

    <button onclick="addLibraryMaster()">保存</button>
  </div>

  <div id="librarySearchForm" class="master-form" style="display:none;">
    <input type="text" id="librarySearchKeyword" placeholder="キーワード">
    <button onclick="filterLibrary()">検索実行</button>
  </div>

  <div id="librarySearchNote" class="library-search-note" style="display:none;"></div>

  <!-- 一覧テーブル -->
  <table class="table table-striped" id="libraryMasterTable" style="display:none;">
    <thead>
      <tr>
        <th>LibraryID</th>
        <th>作品名</th>
        <th>巻数</th>
        <th>Box</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="libraryMasterTableBody"></tbody>
  </table>

</div>
