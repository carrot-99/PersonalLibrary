<!-- AnimeSeasonMasterView.html -->
<div id="AnimeSeasonMasterView" class="view">
  <h3>アニメ期マスタ管理</h3>

  <!-- ツールバー（追加は「アニメ登録」から） -->
  <div class="master-toolbar">
    <button onclick="toggleSearchForm('animeSeasonSearchForm')">検索</button>
  </div>

  <div id="animeSeasonSearchForm" class="master-form" style="display:none;">
    <input type="text" id="animeSeasonSearchKeyword" placeholder="キーワード（空欄で全件）">
    <p class="photo-import-note">編集時の入力値 — 種別: TV / OVA / 劇場版 / その他、状況: 視聴予定 / 視聴中 / 視聴済 / 視聴中断</p>
    <button onclick="filterAnimeSeasonMaster()">検索実行</button>
  </div>

  <table class="table table-striped" id="animeSeasonMasterTable" style="display:none;">
    <thead>
      <tr>
        <th>SeasonID</th>
        <th>作品</th>
        <th>期名</th>
        <th>種別</th>
        <th>視聴済話数</th>
        <th>状況</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
