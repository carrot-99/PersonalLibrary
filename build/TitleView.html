<!-- TitleView.html -->
<!-- 作品の詳細。作品名・種別・完結の見出し、数字のまとめ（所持・抜け・積読・次の巻）、所持状況の詳細、巻の一覧（所持・読書・抜け・欲しい巻を色で）、巻ごとの Box の表 -->
<div id="TitleView" class="view">
  <button type="button" class="detail-back" style="display:none;" onclick="backFromDetail()">← 戻る</button>
  <h3>作品の詳細</h3>
  <div class="detail-picker">
    <input id="titleViewSelectInput" list="titleViewSelectList" placeholder="作品名を入力" aria-label="作品名">
    <datalist id="titleViewSelectList"></datalist>
    <select id="titleViewSelect" style="display:none;"></select>
    <button onclick="showTitle()">表示</button>
  </div>

  <section id="titleDetailHero" class="detail-section detail-hero" style="display:none;">
    <div class="detail-hero-head">
      <h4 class="detail-hero-name"></h4>
      <div class="detail-hero-meta"></div>
    </div>
    <div class="stat-tiles"></div>
  </section>

  <div id="titleOwnershipSummary" class="ownership-summary" style="display:none;"></div>

  <section id="titleVolumeSection" class="detail-section detail-panel" style="display:none;">
    <h4 class="detail-section-title">巻の一覧</h4>
    <div id="titleVolumeGrid" class="volume-grid"></div>
    <div class="volume-legend" aria-hidden="true">
      <span><i class="volume-chip is-read"></i>読了</span>
      <span><i class="volume-chip is-reading"></i>読書中</span>
      <span><i class="volume-chip is-unread"></i>未読</span>
      <span><i class="volume-chip is-missing"></i>未所持</span>
      <span><i class="volume-chip is-wish"></i>欲しい巻</span>
    </div>
    <p class="volume-hint">持っている巻を押すと、読了 ⇄ 未読 を切り替えます。</p>
  </section>

  <details id="titleTableSection" class="detail-section detail-panel title-table-section" style="display:none;">
    <summary>巻ごとの保管場所（Box）・読書状況</summary>
    <table id="titleTable" style="display:none;">
      <thead><tr><th>巻</th><th>BoxID</th><th>読書</th></tr></thead>
      <tbody></tbody>
    </table>
  </details>
</div>
