<div id="BoxView" class="view">

  <h3>Box表示</h3>
  <label>Box

  <button onclick="showBox()">表示</button>
  <table id="boxTable" style="display:none;">
    <thead><tr><th>作品名</th><th>巻</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
