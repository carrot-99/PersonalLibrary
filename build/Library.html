<script>
const PAGE_SIZE = 100;
let currentLibraryPage = 1;

//////////////////////////////
// 新刊追加処理
//////////////////////////////
function parseVolumeInput(rawVolume) {
  const input = String(rawVolume ?? '').trim();
  if(!input) {
    return { valid: false, message: '巻数を入力してください' };
  }

  const tokens = input.split(',').map(token => token.trim()).filter(Boolean);
  if(tokens.length === 0) {
    return { valid: false, message: '巻数の形式が不正です' };
  }

  const values = [];
  const seen = new Set();

  for(const token of tokens){
    const rangeMatch = token.match(/^([1-9]\d*)\s*-\s*([1-9]\d*)$/);
    if(rangeMatch){
      const start = Number(rangeMatch[1]);
      const end = Number(rangeMatch[2]);

      if(end <= start){
        return { valid: false, message: `巻数 ${token} は A<B の形式で入力してください` };
      }

      for(let value = start; value <= end; value++){
        const valueKey = String(value);
        if(seen.has(valueKey)){
          return { valid: false, message: `巻数 ${value} が重複しています` };
        }
        seen.add(valueKey);
        values.push(valueKey);
      }
      continue;
    }

    const numericToken = token.trim();
    if(/^(?:0|[1-9]\d*)$/.test(numericToken)){
      const valueKey = String(Number(numericToken));
      if(seen.has(valueKey)){
        return { valid: false, message: `巻数 ${numericToken} が重複しています` };
      }
      seen.add(valueKey);
      values.push(valueKey);
      continue;
    }

    if(seen.has(token)){
      return { valid: false, message: `巻数 ${token} が重複しています` };
    }

    seen.add(token);
    values.push(token);
  }

  return { valid: true, values, text: values.join(', ') };
}

function addVolume() {
  const titleId = getAutocompleteValue('titleSelectInput') || document.getElementById('titleSelect').value;
  const volumeRaw = document.getElementById('volumeInput').value;
  const boxId   = getAutocompleteValue('boxSelectInput') || document.getElementById('boxSelect').value;

  if(!titleId || !boxId) return showError('入力が不完全です');

  const parsedVolume = parseVolumeInput(volumeRaw);
  if(!parsedVolume.valid) return showError(parsedVolume.message);

  callGAS('addNewVolumeWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('volumeInput').value = '';
      loadRecentLibrary('recentLibraryTableEntry');
      loadRecentLibrary('globalRecentLibraryTable');
      loadLibrarySummary('libraryEntry');
      loadLibrarySummary('libraryGlobal');
      loadLibraryMaster(currentLibraryPage);
    } else {
      showError(res.message);
    }
  }, titleId, volumeRaw, boxId);
}

//////////////////////////////
// 最近追加ライブラリ読み込み
//////////////////////////////
function loadRecentLibrary(tableId = 'recentLibraryTable') {
  callGAS('getRecentLibrary', function(data){
    renderRecentLibrary(data, tableId);
  });
}

function loadLibrarySummary(prefix = 'library') {
  callGAS('getLibrarySummary', function(summary){
    updateLibrarySummary(summary, prefix);
  });
}

function updateLibrarySummary(summary, prefix) {
  const idMap = {
    total: `${prefix}Total`,
    uniqueTitles: `${prefix}Unique`,
    uniqueBoxes: `${prefix}Boxes`,
    lastAdded: `${prefix}LastAdded`
  };

  Object.keys(idMap).forEach(key => {
    const el = document.getElementById(idMap[key]);
    if(el){
      el.textContent = summary[key] || (key === 'lastAdded' ? '-' : '0');
    }
  });

  const extraIds = {
    mangaTotal: `${prefix}MangaTotal`,
    novelTotal: `${prefix}NovelTotal`
  };

  Object.keys(extraIds).forEach(key => {
    const el = document.getElementById(extraIds[key]);
    if(el){
      el.textContent = summary[key] || '0';
    }
  });
}

function loadLibraryEntry(){
  loadRecentLibrary('recentLibraryTableEntry');
  loadLibrarySummary('libraryEntry');
}

//////////////////////////////
// 最近追加テーブル描画
//////////////////////////////
function renderRecentLibrary(data, tableId = 'recentLibraryTable') {
  const table = document.getElementById(tableId);
  if(!table) return;

  const tbody = table.querySelector('tbody');
  if(!tbody) return;

  tbody.innerHTML = '';

  const columns = tableId === 'globalRecentLibraryTable'
    ? ['title', 'volume']
    : ['date', 'title', 'volume', 'box'];

  data.forEach(row => {
    const tr = document.createElement('tr');

    columns.forEach(key => {
      const td = document.createElement('td');
      td.textContent = row[key] ?? '';
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

//////////////////////////////
// 初期表示時に呼ぶ
//////////////////////////////
function loadLibraryMaster(){
  const table = document.getElementById('libraryMasterTable');
  if(table) table.style.display = 'none';
  setLibrarySearchNote('');

  // 一覧は検索実行時にサーバーで絞り込んで取得する（全件は読み込まない）。
  // 更新・削除後の再読込では、入力済みのキーワードで検索し直す
  const keyword = document.getElementById('librarySearchKeyword');
  if(keyword && keyword.value.trim()){
    filterLibrary();
  }

  callGAS('getTitleMaster', function(titles){
    const input = document.getElementById('libraryAddTitleInput');
    const list = document.getElementById('libraryAddTitleList');
    if(!input || !list) return;
    list.innerHTML = '';
    titles.forEach(item => {
      const option = document.createElement('option');
      option.value = getTitleLabel(item);
      option.dataset.value = String(item.id);
      list.appendChild(option);
    });
    input.oninput = function(){
      const match = findDatalistOption(list, input.value);
      input.dataset.selectedId = match ? match.dataset.value : '';
    };
  });

  callGAS('getBoxMaster', function(boxes){
    const input = document.getElementById('libraryAddBoxInput');
    const list = document.getElementById('libraryAddBoxList');
    if(!input || !list) return;
    list.innerHTML = '';
    boxes.forEach(item => {
      const option = document.createElement('option');
      option.value = `${item.id} : ${item.place}`;
      option.dataset.value = String(item.id);
      list.appendChild(option);
    });
    input.oninput = function(){
      const match = findDatalistOption(list, input.value);
      input.dataset.selectedId = match ? match.dataset.value : '';
    };
  });
}

function addLibraryMaster(){
  const titleId = document.getElementById('libraryAddTitleInput').dataset.selectedId ||
    getAutocompleteValue('libraryAddTitleInput') ||
    '';
  const boxId = document.getElementById('libraryAddBoxInput').dataset.selectedId ||
    getAutocompleteValue('libraryAddBoxInput') ||
    '';
  const volume = document.getElementById('libraryAddVolumeInput').value.trim();

  if(!titleId || !boxId || !volume){
    return showError('作品名・巻数・Boxは必須です');
  }

  callGAS('addNewVolumeWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('libraryAddTitleInput').value = '';
      document.getElementById('libraryAddTitleInput').dataset.selectedId = '';
      document.getElementById('libraryAddVolumeInput').value = '';
      document.getElementById('libraryAddBoxInput').value = '';
      document.getElementById('libraryAddBoxInput').dataset.selectedId = '';
      loadRecentLibrary('globalRecentLibraryTable');
      loadLibrarySummary('libraryGlobal');
      loadLibraryMaster();
      refreshMasterData();
    } else {
      showError(res.message);
    }
  }, titleId, volume, boxId);
}

function filterLibrary(){
  const keyword = document.getElementById('librarySearchKeyword').value.trim();
  showInlineLoading('librarySearchForm', '検索中...');

  google.script.run
    .withSuccessHandler(function(res){
      hideInlineLoading('librarySearchForm');
      renderFilteredTable('libraryMasterTable', res.items || [], ['id', 'title', 'volume', 'box'], 'librarySearchKeyword');
      if(!res.total){
        setLibrarySearchNote('該当する書籍はありません');
      } else if(res.truncated){
        setLibrarySearchNote(`${res.items.length}件まで表示しています（該当 ${res.total}件）。キーワードを絞り込んでください`);
      } else {
        setLibrarySearchNote(`${res.total}件`);
      }
    })
    .withFailureHandler(function(error){
      hideInlineLoading('librarySearchForm');
      showError(error && error.message ? error.message : '検索に失敗しました');
    })
    .searchLibraryMaster(keyword);
}

function setLibrarySearchNote(text){
  const note = document.getElementById('librarySearchNote');
  if(!note) return;
  note.textContent = text;
  note.style.display = text ? 'block' : 'none';
}

function loadLibraryList(page = 1){
  const pageSize = 20;
  google.script.run
    .withSuccessHandler(function(res){
      hideInlineLoading('LibraryListView');
      const rows = (res.items || []).map(item => ({
        id: item.id,
        title: item.title,
        volume: item.volume,
        box: item.box,
        date: item.date
      }));

      renderPagedTableDOM({
        tableId: 'libraryListTable',
        data: rows,
        columns: ['id', 'title', 'volume', 'box', 'date'],
        currentPage: page,
        pageSize: pageSize,
        totalRows: res.total || rows.length,
        editable: false,
        onPageChange: loadLibraryList
      });
    })
    .withFailureHandler(function(error){
      hideInlineLoading('LibraryListView');
      showError(error && error.message ? error.message : '書籍一覧の読み込みに失敗しました');
    })
    .getLibraryPage(page, pageSize);
}

window.addVolume = addVolume;
window.addLibraryMaster = addLibraryMaster;
window.filterLibrary = filterLibrary;
window.loadRecentLibrary = loadRecentLibrary;
window.loadLibrarySummary = loadLibrarySummary;
window.updateLibrarySummary = updateLibrarySummary;
window.loadLibraryEntry = loadLibraryEntry;
window.loadLibraryMaster = loadLibraryMaster;
window.loadLibraryList = loadLibraryList;

</script>
