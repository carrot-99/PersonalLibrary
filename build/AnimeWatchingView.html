<!-- AnimeWatchingView.html -->
<!-- 視聴中の一覧（＋視聴予定）。アニメの登録もこの画面の [＋ アニメを登録] から行う -->
<div id="AnimeWatchingView" class="view">
  <!-- 見出しと操作（右寄せ） -->
  <div class="view-header">
    <h3>視聴中の一覧</h3>
    <div class="master-toolbar">
      <button type="button" class="is-anime" onclick="toggleAnimeEntryForm()">＋ アニメを登録</button>
    </div>
  </div>

  <!-- 登録フォーム（初期非表示）。登録後も開いたままにして続けて登録できる -->
  <!-- 今期のアニメの [登録] では、このフォームを今期のアニメの画面（#animeSeasonEntryHost）へ移して使う -->
  <div id="animeEntryHost">
  <div id="animeEntryForm" class="master-form form-grid anime-entry-panel" style="display:none;">
    <p class="photo-import-note">作品（例: オーバーロード）の下に、期（TV の各期・OVA・劇場版）を 1 件ずつ登録します。新しい作品のときはシリーズも指定できます（空欄なら作品名と同じシリーズ。書籍と共通）。</p>
    <div id="animeEntrySource" class="anime-entry-source"></div>
    <input id="animeEntryAnimeInput" list="animeEntryAnimeList" placeholder="作品名">
    <datalist id="animeEntryAnimeList"></datalist>
    <div id="animeEntryHint" class="anime-entry-hint"></div>
    <div id="animeEntrySeriesRow" style="display:none;">
      <input id="animeEntrySeriesInput" list="animeEntrySeriesList" placeholder="シリーズ（空欄なら作品名と同じ）">
      <datalist id="animeEntrySeriesList"></datalist>
    </div>
    <input id="animeEntrySeasonInput" placeholder="期名（例: オーバーロード Ⅱ。空欄なら作品名）">
    <select id="animeEntryType">
      <option value="TV">TV</option>
      <option value="OVA">OVA</option>
      <option value="劇場版">劇場版</option>
      <option value="その他">その他</option>
    </select>
    <input id="animeEntryEpisodesInput" placeholder="視聴済話数（例: 3）" inputmode="numeric">
    <select id="animeEntryStatus">
      <option value="視聴中">視聴中</option>
      <option value="視聴予定">視聴予定</option>
      <option value="視聴済">視聴済</option>
      <option value="視聴中断">視聴中断</option>
    </select>
    <button id="animeEntryButton" type="button" onclick="addAnimeSeasonFromForm()">登録する</button>
  </div>
  </div>

  <div id="animeWatchingSummary" class="photo-import-summary"></div>
  <div id="animeWatchingCards" class="anime-cards"></div>

  <h4 class="anime-section-title">🗓️ 視聴予定</h4>
  <div id="animePlannedCards" class="anime-cards"></div>
</div>
