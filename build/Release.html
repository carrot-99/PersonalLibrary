<!-- Release.html -->
<script>
//////////////////////////////
// 発売予定（連載中の漫画）
//////////////////////////////
const releaseState = {
  data: null,
  busy: false,
  view: null, // 'calendar'（既定）/ 'list'（月ごとの一覧）。このブラウザに保存（RELEASE_VIEW_STORAGE_KEY）
  month: 0,   // カレンダーで表示中の月（yyyyMM。0 は未選択 → 今月か発売予定のある月）
  day: 0      // カレンダーで選んだ日（sortKey）。'others' はその月の日付のない巻。0 は未選択 → pickReleaseCalendarDay
};
const RELEASE_VIEW_STORAGE_KEY = 'personalLibrary.releaseView';

function loadReleaseViewMode(){
  try {
    const saved = localStorage.getItem(RELEASE_VIEW_STORAGE_KEY);
    if(saved === 'list' || saved === 'calendar') return saved;
  } catch(e) {}
  return 'calendar';
}

// [一覧] / [カレンダー] の切り替え
function setReleaseViewMode(view){
  releaseState.view = view;
  try { localStorage.setItem(RELEASE_VIEW_STORAGE_KEY, view); } catch(e) {}
  if(releaseState.data) renderReleaseUpcoming(releaseState.data.upcoming || []);
}

function loadReleaseView(){
  showInlineLoading('ReleaseView', '読み込み中...');
  callGAS('getReleaseViewWeb', function(res){
    hideInlineLoading('ReleaseView');
    if(!res || !res.success) return showError(res && res.message ? res.message : '発売予定の読み込みに失敗しました');
    releaseState.data = res;
    renderReleaseView();
  });
}

// 楽天から取得（titleId 指定でその作品だけ）。画面からは 1 回 40 秒ほどで区切り、残りは [続きを取得]
function fetchReleases(titleId, btn){
  if(releaseState.busy) return;
  releaseState.busy = true;

  const mainButton = document.getElementById('releaseFetchButton');
  const button = btn || mainButton;
  button.disabled = true;
  button.textContent = '取得中...';
  showInlineLoading('ReleaseView', titleId ? '取得中...' : '楽天ブックスから取得中（1 分ほどかかります）...');

  const finish = function(){
    releaseState.busy = false;
    button.disabled = false;
    hideInlineLoading('ReleaseView');
  };

  google.script.run
    .withSuccessHandler(function(res){
      finish();
      if(res && res.success){
        showSuccess(res.message);
        mainButton.textContent = !titleId && res.remaining > 0 ? '続きを取得' : '発売情報を取得';
        if(btn) btn.textContent = '再取得';
        loadReleaseView();
      } else {
        button.textContent = btn ? '再取得' : '発売情報を取得';
        showError(res && res.message ? res.message : '取得に失敗しました');
      }
    })
    .withFailureHandler(function(error){
      finish();
      button.textContent = btn ? '再取得' : '発売情報を取得';
      showError(error && error.message ? error.message : '通信に失敗しました');
    })
    .updateReleasesWeb(titleId || '');
}

// 欲しい巻リストに追加（volumes: 巻の配列）。onAdded: 追加後の再読込（省略時は発売予定。ホームからも使う）
function addReleaseToWish(titleId, volumes, memo, btn, onAdded){
  btn.disabled = true;
  callGAS('addWishes', function(res){
    if(res && res.success){
      showSuccess(res.message);
      (onAdded || loadReleaseView)();
    } else {
      btn.disabled = false;
      showError(res && res.message ? res.message : '追加に失敗しました');
    }
  }, titleId, volumes.join(','), memo);
}

//////////////////////////////
// 表示用の整形（DOM を使わない）
//////////////////////////////
// 発売日の並べ替えキー（yyyyMMdd。上旬 10・中旬 20・下旬 31・日なし 99・月なし 9999）→ 月の見出し
function getReleaseMonthLabel(sortKey){
  const key = Number(sortKey) || 0;
  if(key <= 0 || key >= 99999999) return '発売日未定';
  const year = Math.floor(key / 10000);
  const month = Math.floor(key / 100) % 100;
  return month === 99 ? `${year}年（月未定）` : `${year}年${month}月`;
}

// 月の中の日の表示（例: 11/4、11月下旬、11月）
function formatReleaseDay(item){
  const key = Number(item.sortKey) || 0;
  const month = Math.floor(key / 100) % 100;
  const day = key % 100;
  if(item.precision === 'day') return `${month}/${day}`;
  if(item.precision === 'month'){
    const part = { 10: '上旬', 20: '中旬', 31: '下旬' }[day];
    return part ? `${month}月${part}` : `${month}月`;
  }
  return item.salesDate || '未定';
}

// 発売日の並べ替えキー → カレンダーの月（yyyyMM）。月が分からない（年だけ・未定）なら 0
function getReleaseMonthKey(sortKey){
  const key = Number(sortKey) || 0;
  const month = Math.floor(key / 100) % 100;
  if(key <= 0 || key >= 99999999 || month < 1 || month > 12) return 0;
  return Math.floor(key / 100);
}

// 月（yyyyMM）を offset か月ずらす
function shiftReleaseMonth(monthKey, offset){
  const index = Math.floor(monthKey / 100) * 12 + (monthKey % 100 - 1) + offset;
  return Math.floor(index / 12) * 100 + (index % 12) + 1;
}

// 発売予定のある月（昇順。月の分からない巻は含めない）
function getReleaseCalendarMonths(items){
  return Array.from(new Set((items || []).map(item => getReleaseMonthKey(item.sortKey)).filter(Boolean))).sort((a, b) => a - b);
}

// 最初に開く月: 今月に発売予定があれば今月、なければ今月より後で最初の月、それもなければ最後の月（発売予定がなければ今月）
function pickReleaseCalendarMonth(months, currentMonth){
  if(months.length === 0 || months.includes(currentMonth)) return currentMonth;
  return months.find(month => month > currentMonth) || months[months.length - 1];
}

// 月のカレンダー（日曜始まり）
// 戻り値: { year, month, weeks: [[{ day, sortKey, items } または null（月の外）] × 7], days: その月で日付の分かる巻, others: 日付のない巻（上旬・下旬など） }
function buildReleaseCalendar(monthKey, items){
  const year = Math.floor(monthKey / 100);
  const month = monthKey % 100;
  const inMonth = (items || []).filter(item => getReleaseMonthKey(item.sortKey) === monthKey);
  const days = inMonth.filter(item => item.precision === 'day');
  const others = inMonth.filter(item => item.precision !== 'day');

  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const lastDay = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i = 0; i < firstWeekday; i++) cells.push(null);
  for(let day = 1; day <= lastDay; day++){
    const sortKey = monthKey * 100 + day;
    cells.push({ day, sortKey, items: days.filter(item => Number(item.sortKey) === sortKey) });
  }
  while(cells.length % 7 !== 0) cells.push(null);

  const weeks = [];
  for(let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return { year, month, weeks, days, others };
}

// カレンダーで最初に選ぶ日: 今日に発売予定があれば今日、なければ月の中で最初に発売予定のある日、
// どの日にもなければ日付のない巻（'others'）、それもなければ 0
function pickReleaseCalendarDay(calendar, todayKey){
  const keys = calendar.days.map(item => Number(item.sortKey));
  if(keys.includes(todayKey)) return todayKey;
  if(keys.length > 0) return Math.min(...keys);
  return calendar.others.length > 0 ? 'others' : 0;
}

// 発売日順の配列 → 月ごとのまとまり [{ label, items }]
function groupReleasesByMonth(items){
  const groups = [];
  (items || []).forEach(item => {
    const label = getReleaseMonthLabel(item.sortKey);
    const last = groups[groups.length - 1];
    if(last && last.label === label){
      last.items.push(item);
    } else {
      groups.push({ label, items: [item] });
    }
  });
  return groups;
}

//////////////////////////////
// 描画
//////////////////////////////
function renderReleaseView(){
  const data = releaseState.data;
  if(!data) return;

  const byType = (data.typeCounts || []).map(t => `${t.type} ${t.count}`).join('・');
  const status = [`連載中 ${data.titleCount} 作品（${byType}。取得済 ${data.fetchedCount}）`, `最終取得: ${data.lastFetchedAt || '未取得'}`];
  if(!data.configured) status.push('楽天のアプリ ID が未設定です');
  document.getElementById('releaseStatus').textContent = status.join('・');

  renderReleaseUpcoming(data.upcoming || []);
  renderReleaseUnowned(data.unowned || []);
  renderReleaseProblems(data.problems || []);
}

function createReleaseTitleLink(item){
  return createCellLink(item.titleName || item.titleId, function(){ openTitleDetail(item.titleId); });
}

// 種別（漫画・ラノベ）のバッジ。同じ作品名の漫画とラノベを見分ける
function createReleaseTypeBadge(item){
  const type = item.titleType || '';
  return createReleaseBadge(type, type === 'ラノベ' ? 'is-type is-novel' : 'is-type');
}

function createReleaseWishButton(label, onClick){
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'photo-import-wish';
  button.textContent = label;
  button.addEventListener('click', function(){ onClick(button); });
  return button;
}

function createReleaseBadge(text, className){
  const badge = document.createElement('span');
  badge.className = `release-badge ${className || ''}`;
  badge.textContent = text;
  return badge;
}

function createReleaseShopLink(url){
  const link = document.createElement('a');
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener';
  link.className = 'release-shop';
  link.textContent = '楽天';
  return link;
}

// 発売予定: [一覧]（月ごとの一覧）と [カレンダー]（月のカレンダーと、選んだ日の巻）を切り替える
function renderReleaseUpcoming(items){
  document.getElementById('releaseUpcomingCount').textContent = `${items.length}冊`;
  if(!releaseState.view) releaseState.view = loadReleaseViewMode();
  const isCalendar = releaseState.view === 'calendar';
  document.querySelectorAll('#ReleaseView .release-view-switch button').forEach(button => {
    button.classList.toggle('active', button.dataset.view === releaseState.view);
  });
  document.getElementById('releaseCalendarArea').style.display = isCalendar ? '' : 'none';
  // 発売済・未所持は一覧のときだけ（カレンダーは発売予定を見る表示）
  document.getElementById('releaseUnownedSection').style.display = isCalendar ? 'none' : '';

  if(!isCalendar){
    document.getElementById('releaseUndatedSection').style.display = 'none';
    renderReleaseMonthGroups(items);
    return;
  }

  const now = new Date();
  const currentMonth = now.getFullYear() * 100 + now.getMonth() + 1;
  const months = getReleaseCalendarMonths(items);
  if(!releaseState.month) releaseState.month = pickReleaseCalendarMonth(months, currentMonth);

  renderReleaseCalendar(items, months, currentMonth, now);
  renderReleaseUndated(items.filter(item => !getReleaseMonthKey(item.sortKey)));
}

function moveReleaseMonth(offset){
  releaseState.month = shiftReleaseMonth(releaseState.month, offset);
  releaseState.day = 0;
  if(releaseState.data) renderReleaseUpcoming(releaseState.data.upcoming || []);
}

function selectReleaseDay(day){
  releaseState.day = day;
  if(releaseState.data) renderReleaseUpcoming(releaseState.data.upcoming || []);
}

// 一覧: 発売日順に月でまとめたカード（月の分からない巻は「2027年（月未定）」「発売日未定」のカード）
function renderReleaseMonthGroups(items){
  const container = document.getElementById('releaseUpcoming');
  container.innerHTML = '';
  if(items.length === 0){
    container.textContent = '発売予定の巻はありません';
    return;
  }

  groupReleasesByMonth(items).forEach(group => {
    const card = document.createElement('div');
    card.className = 'wish-group release-group';

    const head = document.createElement('div');
    head.className = 'wish-group-head';
    const label = document.createElement('strong');
    label.textContent = group.label;
    const count = document.createElement('span');
    count.className = 'wish-group-volumes';
    count.textContent = `${group.items.length}冊`;
    head.appendChild(label);
    head.appendChild(count);
    card.appendChild(head);

    group.items.forEach(item => card.appendChild(createReleaseUpcomingLine(item)));
    container.appendChild(card);
  });
}

function renderReleaseCalendar(items, months, currentMonth, now){
  const monthKey = releaseState.month;
  const calendar = buildReleaseCalendar(monthKey, items);
  const todayKey = currentMonth * 100 + now.getDate();
  if(!releaseState.day) releaseState.day = pickReleaseCalendarDay(calendar, todayKey);
  // 移動できる範囲: 発売予定のある最初の月〜最後の月（今月を含む）
  const minMonth = Math.min(currentMonth, months[0] || currentMonth);
  const maxMonth = Math.max(currentMonth, months[months.length - 1] || currentMonth);

  document.getElementById('releaseMonthLabel').textContent = `${calendar.year}年${calendar.month}月`;
  document.getElementById('releaseMonthCount').textContent = `${calendar.days.length + calendar.others.length}冊`;
  document.getElementById('releasePrevMonth').disabled = monthKey <= minMonth;
  document.getElementById('releaseNextMonth').disabled = monthKey >= maxMonth;

  const grid = document.getElementById('releaseCalendar');
  grid.innerHTML = '';
  ['日', '月', '火', '水', '木', '金', '土'].forEach((name, index) => {
    const head = document.createElement('div');
    head.className = `release-cal-head${index === 0 ? ' is-sun' : index === 6 ? ' is-sat' : ''}`;
    head.textContent = name;
    grid.appendChild(head);
  });

  calendar.weeks.forEach(week => week.forEach((cell, index) => {
    const box = document.createElement('div');
    if(!cell){
      box.className = 'release-cal-cell is-out';
      grid.appendChild(box);
      return;
    }
    box.className = 'release-cal-cell';
    if(index === 0) box.classList.add('is-sun');
    if(index === 6) box.classList.add('is-sat');
    if(cell.sortKey === todayKey) box.classList.add('is-today');
    if(cell.sortKey === releaseState.day) box.classList.add('is-selected');

    const day = document.createElement('div');
    day.className = 'release-cal-day';
    day.textContent = cell.day;
    box.appendChild(day);

    if(cell.items.length > 0){
      box.classList.add('has-items');
      // スマホ幅では件数だけ（CSS で書名を隠す）
      const count = document.createElement('div');
      count.className = 'release-cal-count';
      count.textContent = `${cell.items.length}冊`;
      box.appendChild(count);
      cell.items.forEach(item => {
        const label = document.createElement('div');
        label.className = `release-cal-item${item.titleType === 'ラノベ' ? ' is-novel' : ''}`;
        label.textContent = `${item.titleName} ${item.volume}`;
        label.title = `${item.titleName} ${item.volume}巻（${item.titleType || ''}）`;
        box.appendChild(label);
      });
      // 押すとその日の巻を下に表示する
      box.addEventListener('click', function(){ selectReleaseDay(cell.sortKey); });
    }
    grid.appendChild(box);
  }));

  // その月の日付のない巻（「11月下旬」など）はカレンダーの下のボタンで選ぶ
  const others = document.getElementById('releaseMonthOthers');
  others.innerHTML = '';
  if(calendar.others.length > 0){
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `release-cal-others${releaseState.day === 'others' ? ' is-selected' : ''}`;
    button.textContent = `${calendar.month}月中（日付未定） ${calendar.others.length}冊`;
    button.addEventListener('click', function(){ selectReleaseDay('others'); });
    others.appendChild(button);
  }

  renderReleaseDayList(calendar);
}

// カレンダーの下: 選んだ日（または日付のない巻）の巻だけ
function renderReleaseDayList(calendar){
  const container = document.getElementById('releaseUpcoming');
  container.innerHTML = '';
  const day = releaseState.day;
  const items = day === 'others'
    ? calendar.others
    : calendar.days.filter(item => Number(item.sortKey) === day);
  if(!day || items.length === 0){
    container.textContent = `${calendar.year}年${calendar.month}月の発売予定はありません`;
    if(day && calendar.days.length + calendar.others.length > 0) container.textContent = 'この日の発売予定はありません';
    return;
  }

  const card = document.createElement('div');
  card.className = 'wish-group release-group';
  const head = document.createElement('div');
  head.className = 'wish-group-head';
  const label = document.createElement('strong');
  label.textContent = day === 'others' ? `${calendar.month}月中（日付未定）` : `${calendar.month}月${day % 100}日`;
  const count = document.createElement('span');
  count.className = 'wish-group-volumes';
  count.textContent = `${items.length}冊`;
  head.appendChild(label);
  head.appendChild(count);
  card.appendChild(head);
  items.forEach(item => card.appendChild(createReleaseUpcomingLine(item)));
  container.appendChild(card);
}

// 月の分からない巻（年だけ・未定）
function renderReleaseUndated(items){
  const section = document.getElementById('releaseUndatedSection');
  const container = document.getElementById('releaseUndated');
  container.innerHTML = '';
  section.style.display = items.length > 0 ? '' : 'none';
  document.getElementById('releaseUndatedCount').textContent = `${items.length}冊`;
  if(items.length === 0) return;

  groupReleasesByMonth(items).forEach(group => {
    const card = document.createElement('div');
    card.className = 'wish-group release-group';
    const head = document.createElement('div');
    head.className = 'wish-group-head';
    const label = document.createElement('strong');
    label.textContent = group.label;
    head.appendChild(label);
    card.appendChild(head);
    group.items.forEach(item => card.appendChild(createReleaseUpcomingLine(item)));
    container.appendChild(card);
  });
}

// 発売予定の 1 行（日付 / 種別＋作品名＋巻 / 欲しい巻に追加 / 楽天）
function createReleaseUpcomingLine(item){
  const line = document.createElement('div');
  line.className = 'wish-item release-item';

  const day = document.createElement('span');
  day.className = 'release-day';
  day.textContent = formatReleaseDay(item);

  const text = document.createElement('span');
  text.className = 'release-title';
  text.appendChild(createReleaseTypeBadge(item));
  text.appendChild(createReleaseTitleLink(item));
  text.appendChild(document.createTextNode(` ${item.volume}巻`));
  if(item.edition) text.appendChild(createReleaseBadge('特装版など'));

  line.appendChild(day);
  line.appendChild(text);
  if(item.wished){
    line.appendChild(createReleaseBadge('欲しい巻に追加済', 'is-wished'));
  } else {
    line.appendChild(createReleaseWishButton('欲しい巻に追加', btn =>
      addReleaseToWish(item.titleId, [item.volume], `発売日 ${item.salesDate}`, btn)));
  }
  if(item.url) line.appendChild(createReleaseShopLink(item.url));
  return line;
}

function renderReleaseUnowned(groups){
  const container = document.getElementById('releaseUnowned');
  container.innerHTML = '';
  const total = groups.reduce((sum, group) => sum + group.volumes.length, 0);
  document.getElementById('releaseUnownedCount').textContent = `${groups.length}作品・${total}冊`;
  if(groups.length === 0){
    container.textContent = '発売済みで持っていない巻はありません';
    return;
  }

  groups.forEach(group => {
    const card = document.createElement('div');
    card.className = 'wish-group release-group is-unowned';

    const head = document.createElement('div');
    head.className = 'wish-group-head';
    head.appendChild(createReleaseTypeBadge(group));
    head.appendChild(createReleaseTitleLink(group));
    const numbers = group.volumes.map(v => Number(v.volume)).filter(n => Number.isFinite(n));
    const volumes = document.createElement('span');
    volumes.className = 'wish-group-volumes';
    volumes.textContent = `${formatVolumeRanges(numbers)}巻`;
    head.appendChild(volumes);
    if(group.stale) head.appendChild(createReleaseBadge('完結済みかも', 'is-stale'));
    card.appendChild(head);

    const line = document.createElement('div');
    line.className = 'wish-item release-item';
    const info = document.createElement('span');
    info.className = 'release-title';
    info.textContent = group.latestVolume ? `最新 ${group.latestVolume}巻（${group.latestSalesDate}）` : '';
    line.appendChild(info);

    const notWished = group.volumes.filter(v => !v.wished).map(v => v.volume);
    if(notWished.length === 0){
      line.appendChild(createReleaseBadge('欲しい巻に追加済', 'is-wished'));
    } else {
      const label = notWished.length === 1 ? '欲しい巻に追加' : `${notWished.length}冊を欲しい巻に追加`;
      line.appendChild(createReleaseWishButton(label, btn => addReleaseToWish(group.titleId, notWished, '', btn)));
    }
    card.appendChild(line);

    container.appendChild(card);
  });
}

function renderReleaseProblems(items){
  const container = document.getElementById('releaseProblems');
  container.innerHTML = '';
  document.getElementById('releaseProblemsCount').textContent = `${items.length}作品`;
  if(items.length === 0){
    container.textContent = 'ありません';
    return;
  }

  const card = document.createElement('div');
  card.className = 'wish-group release-group is-problem';
  items.forEach(item => {
    const line = document.createElement('div');
    line.className = 'wish-item release-item';

    const text = document.createElement('span');
    text.className = 'release-title';
    text.appendChild(createReleaseTypeBadge(item));
    text.appendChild(createReleaseTitleLink(item));
    text.appendChild(createReleaseBadge(item.result, 'is-stale'));
    const message = document.createElement('small');
    message.className = 'release-message';
    message.textContent = `${item.message}（${item.fetchedAt}）`;
    text.appendChild(message);

    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'anime-season-button release-retry';
    retry.textContent = '再取得';
    retry.addEventListener('click', function(){ fetchReleases(item.titleId, retry); });

    line.appendChild(text);
    line.appendChild(retry);
    card.appendChild(line);
  });
  container.appendChild(card);
}

window.loadReleaseView = loadReleaseView;
window.fetchReleases = fetchReleases;
window.moveReleaseMonth = moveReleaseMonth;
window.setReleaseViewMode = setReleaseViewMode;
</script>
