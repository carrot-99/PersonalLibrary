<!-- TitleListView.html -->
<div id="TitleListView" class="view" style="display:none;">
  <!-- 見出しと操作（右寄せ） -->
  <div class="view-header">
    <h3>作品一覧</h3>
    <div class="master-toolbar">
      <button onclick="toggleAddForm('titleAddForm')">＋ 追加</button>
      <!-- 作者が空の作品の作者・出版社を楽天ブックスから取得（fillTitleAuthors。1 回 4 分ほどまで） -->
      <button id="titleAuthorFillButton" class="is-secondary" type="button" onclick="fillTitleAuthors()">✎ 作者・出版社を補完</button>
    </div>
  </div>
  <p id="titleAuthorFillStatus" class="photo-import-note" style="display:none;"></p>

  <!-- 追加フォーム（初期非表示） -->
  <div id="titleAddForm" class="master-form form-grid" style="display:none;">

    <input type="text" id="newTitleName" placeholder="作品名">

    <input id="newTitleSeriesInput" list="newTitleSeriesList" placeholder="シリーズ（任意）">
    <datalist id="newTitleSeriesList"></datalist>
    <select id="newTitleSeries" style="display:none;"></select>

    <select id="newTitleType">
      <option value="漫画">漫画</option>
      <option value="ラノベ">ラノベ</option>
    </select>

    <select id="newTitleCompleted">
      <option value="連載中">連載中</option>
      <option value="完結済">完結済</option>
      <option value="未完結">未完結</option>
    </select>

    <!-- 作者・出版社は任意。空欄の項目は楽天ブックスから取得する -->
    <input type="text" id="newTitleAuthor" placeholder="作者（任意。複数なら / 区切り）">
    <input type="text" id="newTitlePublisher" placeholder="出版社（任意）">

    <button onclick="addTitleMaster()">保存</button>
  </div>

  <table class="table table-striped" id="titleListTable">
    <thead>
      <tr>
        <th>TitleID</th>
        <th>作品名</th>
        <th>シリーズ</th>
        <th>作者</th>
        <th>出版社</th>
        <th>種別</th>
        <th>完結</th>
        <th>所持巻</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
