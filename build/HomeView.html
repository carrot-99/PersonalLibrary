<!-- HomeView.html -->
<!-- ホーム（書籍・アニメ共通。起動時に開く）。発売予定・未所持の巻・欲しい巻・視聴中のアニメをまとめて表示 -->
<!-- 各欄は 1 枚のパネル（.home-section。上端の色は data-section ごと）。見出しを押すとたためる（<details>。開閉はこのブラウザに保存。setupHomeSections） -->
<div id="HomeView" class="view" style="display:none;">
  <h3>ホーム</h3>

  <!-- サマリー（書籍モードは所蔵、アニメモードは視聴。showTab がホームを開くたびに取り直す） -->
  <div class="top-summary-panel book-only">
    <div class="summary-item compact">所蔵冊数<strong id="libraryGlobalTotal">0</strong></div>
    <div class="summary-item compact">漫画所蔵冊数<strong id="libraryGlobalMangaTotal">0</strong></div>
    <div class="summary-item compact">ラノベ所蔵冊数<strong id="libraryGlobalNovelTotal">0</strong></div>
    <div class="summary-item compact">登録作品数<strong id="libraryGlobalUnique">0</strong></div>
    <div class="summary-item compact">積読<strong id="libraryGlobalUnread">0</strong></div>
    <div class="summary-item compact">最新登録<strong id="libraryGlobalLastAdded">-</strong></div>
  </div>

  <div class="top-summary-panel anime-only">
    <div class="summary-item compact">視聴済<strong id="animeGlobalDone">0</strong></div>
    <div class="summary-item compact">視聴中<strong id="animeGlobalWatching">0</strong></div>
    <div class="summary-item compact">視聴中断<strong id="animeGlobalDropped">0</strong></div>
    <div class="summary-item compact">視聴予定<strong id="animeGlobalPlanned">0</strong></div>
    <div class="summary-item compact">登録作品数<strong id="animeGlobalWorks">0</strong></div>
    <div class="summary-item compact">視聴話数<strong id="animeGlobalEpisodes">0</strong></div>
  </div>

  <div id="homeReleaseStatus" class="release-status"></div>

  <div class="home-sections">
    <details class="home-section" data-section="reading" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">📖</span>積読 <span id="homeReadingCount" class="release-count"></span>
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('LibraryListView');">書籍一覧 →</a></h4></summary>
      <div id="homeReading" class="wish-groups"></div>
    </details>

    <!-- 最近読了した漫画（直近 30 日に読了にした巻を作品ごとに。getRecentReadSummary） -->
    <details class="home-section" data-section="readDone" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">✅</span>最近読了した漫画 <span id="homeReadDoneCount" class="release-count"></span>
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('LibraryListView');">書籍一覧 →</a></h4></summary>
      <div id="homeReadDone" class="wish-groups"></div>
    </details>

    <details class="home-section" data-section="week" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">🆕</span>今週の発売 <span id="homeWeekCount" class="release-count"></span>
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('ReleaseView');">発売予定 →</a></h4></summary>
      <div id="homeWeek" class="wish-groups"></div>
    </details>

    <details class="home-section" data-section="month" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">📅</span>今月の発売 <span id="homeMonthCount" class="release-count"></span>
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('ReleaseView');">発売予定 →</a></h4></summary>
      <div id="homeMonth" class="wish-groups"></div>
    </details>

    <details class="home-section" data-section="unowned" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">🛒</span>発売済・未所持 <span id="homeUnownedCount" class="release-count"></span>
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('ReleaseView');">発売予定 →</a></h4></summary>
      <div id="homeUnowned" class="wish-groups"></div>
    </details>

    <details class="home-section" data-section="wishes" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">⭐</span>欲しい巻リスト <span id="homeWishCount" class="release-count"></span>
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('WishListView');">欲しい巻リスト →</a></h4></summary>
      <div id="homeWishes" class="wish-groups"></div>
    </details>

    <details class="home-section" data-section="watching" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">📺</span>視聴中のアニメ <span id="homeWatchingCount" class="release-count"></span>
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('AnimeWatchingView');">視聴中の一覧 →</a></h4></summary>
      <div id="homeWatching" class="wish-groups"></div>
    </details>

    <!-- 最近追加した漫画（書籍モードのみ） -->
    <details class="home-section recent-history-panel book-only" data-section="recent" open>
      <summary><h4 class="release-heading"><span class="home-icon" aria-hidden="true">🆙</span>最近追加した漫画
        <a href="#" class="home-more" onclick="event.preventDefault(); event.stopPropagation(); showTab('LibraryListView');">書籍一覧 →</a></h4></summary>
      <table class="table table-striped" id="globalRecentLibraryTable">
        <thead>
          <tr>
            <th>作品名</th>
            <th>巻数</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </details>
  </div>
</div>
