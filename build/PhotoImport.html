<!-- PhotoImport.html -->
<script>
//////////////////////////////
// 写真から一括登録
//////////////////////////////
const PHOTO_IMPORT_MAX_FILES = 5;
const PHOTO_IMPORT_MAX_FILE_SIZE = 20 * 1024 * 1024;
const PHOTO_IMPORT_MAX_EDGE = 1568;

const PHOTO_STATUS = {
  OK: '照合済み',
  REVIEW: '要確認',
  UNREGISTERED: 'マスタ未登録',
  DUPLICATE: '重複',
  INPUT_ERROR: '入力エラー'
};

const photoImportState = {
  titles: [],
  boxes: [],
  series: [],
  images: [],
  rows: [],
  existingKeys: new Set(),
  busy: false
};

function openPhotoImportForm(){
  toggleAddForm('libraryPhotoForm');

  callGAS('getTitleMaster', function(titles){
    photoImportState.titles = titles || [];
    fillPhotoImportDatalist('photoImportTitleList', photoImportState.titles);
  });

  callGAS('getSeries', function(series){
    photoImportState.series = series || [];
    fillPhotoImportDatalist('photoImportSeriesList', photoImportState.series);
  });

  callGAS('getBoxes', function(boxes){
    photoImportState.boxes = boxes || [];
    const select = document.getElementById('photoImportBulkBox');
    const current = select.value;
    fillPhotoImportBoxOptions(select, current);
  });
}

function fillPhotoImportDatalist(listId, items){
  const list = document.getElementById(listId);
  list.innerHTML = '';
  items.forEach(item => {
    const option = document.createElement('option');
    option.value = item.name;
    list.appendChild(option);
  });
}

function fillPhotoImportBoxOptions(select, selectedId){
  select.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = 'Boxを選択';
  select.appendChild(placeholder);

  photoImportState.boxes.forEach(box => {
    const option = document.createElement('option');
    option.value = String(box.id);
    option.textContent = `${box.id} : ${box.place}`;
    select.appendChild(option);
  });

  select.value = selectedId || '';
}

function setPhotoImportBusy(busy){
  photoImportState.busy = busy;
  ['photoImportAnalyzeButton', 'photoImportRegisterButton'].forEach(id => {
    const button = document.getElementById(id);
    if(button) button.disabled = busy;
  });
  if(!busy) updatePhotoImportRegisterButton();
}

//////////////////////////////
// 画像の読み込み・縮小
//////////////////////////////
function resizePhotoFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = function(){
      URL.revokeObjectURL(url);
      const scale = Math.min(1, PHOTO_IMPORT_MAX_EDGE / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      resolve({ mimeType: 'image/jpeg', data: dataUrl.split(',')[1] });
    };

    img.onerror = function(){
      URL.revokeObjectURL(url);
      reject(new Error(`${file.name} を読み込めませんでした`));
    };

    img.src = url;
  });
}

function validatePhotoImportFiles(files){
  if(files.length === 0) return '写真を選択してください';
  if(files.length > PHOTO_IMPORT_MAX_FILES) return `写真は${PHOTO_IMPORT_MAX_FILES}枚までです`;

  for(const file of files){
    if(!file.type.startsWith('image/')) return `${file.name} は画像ファイルではありません`;
    if(file.size > PHOTO_IMPORT_MAX_FILE_SIZE) return `${file.name} のサイズが大きすぎます（20MBまで）`;
  }
  return '';
}

//////////////////////////////
// 写真プレビュー
//////////////////////////////
let photoImportImagesPromise = null;

function previewPhotoImportFiles(){
  const files = Array.from(document.getElementById('photoImportFiles').files || []);
  photoImportState.images = [];
  renderPhotoImportPreview();

  const error = validatePhotoImportFiles(files);
  if(error){
    photoImportImagesPromise = null;
    if(files.length > 0) showError(error);
    return null;
  }

  photoImportImagesPromise = Promise.all(files.map(resizePhotoFile))
    .then(images => {
      photoImportState.images = images;
      renderPhotoImportPreview();
      return images;
    });
  photoImportImagesPromise.catch(e => showError(e.message));
  return photoImportImagesPromise;
}

function getPhotoImportImageUrl(index){
  const image = photoImportState.images[index];
  return image ? `data:${image.mimeType};base64,${image.data}` : '';
}

function renderPhotoImportPreview(){
  const area = document.getElementById('photoImportPreview');
  area.innerHTML = '';

  photoImportState.images.forEach((image, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'photo-import-thumb';
    button.title = `写真${index + 1}を拡大`;
    button.onclick = function(){ openPhotoImportViewer(index); };

    const img = document.createElement('img');
    img.src = getPhotoImportImageUrl(index);
    img.alt = `写真${index + 1}`;

    const label = document.createElement('span');
    label.textContent = `写真${index + 1}`;

    button.appendChild(img);
    button.appendChild(label);
    area.appendChild(button);
  });
}

function openPhotoImportViewer(index){
  const url = getPhotoImportImageUrl(index);
  if(!url) return;

  const image = document.getElementById('photoImportViewerImage');
  image.src = url;
  image.classList.remove('is-zoomed');
  document.getElementById('photoImportViewerLabel').textContent =
    `写真${index + 1}（画像をタップで拡大／縮小）`;
  document.getElementById('photoImportViewer').style.display = 'flex';
}

function closePhotoImportViewer(event){
  if(event && event.target !== event.currentTarget) return;
  document.getElementById('photoImportViewer').style.display = 'none';
}

async function analyzePhotoImport(){
  if(photoImportState.busy) return;

  const files = Array.from(document.getElementById('photoImportFiles').files || []);
  const error = validatePhotoImportFiles(files);
  if(error) return showError(error);

  setPhotoImportBusy(true);
  document.getElementById('photoImportResult').innerHTML = '';
  showInlineLoading('libraryPhotoForm', '解析中...（数十秒かかることがあります）');

  let images;
  try{
    images = await (photoImportImagesPromise || previewPhotoImportFiles());
  } catch(e){
    hideInlineLoading('libraryPhotoForm');
    setPhotoImportBusy(false);
    return showError(e.message);
  }

  google.script.run
    .withSuccessHandler(function(res){
      hideInlineLoading('libraryPhotoForm');
      setPhotoImportBusy(false);

      if(!res || !res.success){
        return showError(res && res.message ? res.message : '解析に失敗しました');
      }

      photoImportState.existingKeys = new Set(res.existingKeys || []);
      const bulkSelect = document.getElementById('photoImportBulkBox');
      if(!bulkSelect.value && res.defaultBoxId){
        bulkSelect.value = String(res.defaultBoxId);
      }
      const bulkBoxId = bulkSelect.value;

      photoImportState.rows = res.rows.map((row, idx) => ({
        rowId: `${Date.now()}-${idx}`,
        checked: true,
        recognizedTitle: row.recognizedTitle,
        titleId: row.titleId,
        titleName: row.titleName,
        volume: row.volume,
        boxId: bulkBoxId,
        needsReview: row.match !== 'exact' || row.uncertain,
        uncertain: row.uncertain,
        markCompleted: false,
        photo: row.photo || 0,
        candidates: row.candidates || [],
        notes: row.notes
      }));

      document.getElementById('photoImportReview').style.display = 'block';
      renderPhotoImportRows();

      if(photoImportState.rows.length === 0){
        showError('写真から本を読み取れませんでした');
      } else {
        showSuccess(`${photoImportState.rows.length} 冊を読み取りました。内容を確認してください`);
      }
    })
    .withFailureHandler(function(error){
      hideInlineLoading('libraryPhotoForm');
      setPhotoImportBusy(false);
      showError(error && error.message ? error.message : '解析に失敗しました');
    })
    .analyzeBookSpines(images);
}

//////////////////////////////
// 行の状態判定
//////////////////////////////
function getPhotoImportStatus(row, index){
  if(!row.titleId) return PHOTO_STATUS.UNREGISTERED;

  const volume = String(row.volume || '').trim();
  if(!volume) return PHOTO_STATUS.REVIEW;

  const parsed = parseVolumeInput(volume);
  if(!parsed.valid || parsed.values.length !== 1) return PHOTO_STATUS.INPUT_ERROR;

  if(row.needsReview) return PHOTO_STATUS.REVIEW;
  if(!row.boxId) return PHOTO_STATUS.INPUT_ERROR;

  const key = `${row.titleId}|${parsed.values[0]}`;
  if(photoImportState.existingKeys.has(key)) return PHOTO_STATUS.DUPLICATE;

  const earlier = photoImportState.rows.slice(0, index).some(other => {
    if(!other.checked || other.titleId !== row.titleId) return false;
    const otherParsed = parseVolumeInput(other.volume);
    return otherParsed.valid && otherParsed.values.length === 1 && otherParsed.values[0] === parsed.values[0];
  });
  if(row.checked && earlier) return PHOTO_STATUS.DUPLICATE;

  return PHOTO_STATUS.OK;
}

function getPhotoImportStatusDetail(row, status){
  if(status === PHOTO_STATUS.UNREGISTERED) return '作品マスタに無い作品です（自動作成しません）';
  if(status === PHOTO_STATUS.DUPLICATE) return '同じ作品・巻数が登録済みです';
  if(status === PHOTO_STATUS.INPUT_ERROR){
    return row.boxId ? '巻数は1つだけ入力してください' : 'Boxを選択してください';
  }
  if(status === PHOTO_STATUS.REVIEW){
    if(!String(row.volume || '').trim()) return '巻数を入力してください';
    return '作品・巻数を確認して「OK」を押してください';
  }
  return '';
}

//////////////////////////////
// 候補一覧描画
//////////////////////////////
function renderPhotoImportRows(){
  const container = document.getElementById('photoImportRows');
  container.innerHTML = '';

  photoImportState.rows.forEach((row, index) => {
    const card = document.createElement('div');
    card.className = 'photo-import-row';
    card.dataset.rowId = row.rowId;

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'photo-import-check';
    check.checked = row.checked;
    check.title = '登録対象';
    check.onchange = function(){
      row.checked = check.checked;
      refreshPhotoImportStatuses();
    };

    const titleInput = document.createElement('input');
    titleInput.className = 'photo-import-title';
    titleInput.setAttribute('list', 'photoImportTitleList');
    titleInput.placeholder = '作品名を選択';
    titleInput.value = row.titleName;
    titleInput.oninput = function(){
      const name = titleInput.value.trim();
      const match = photoImportState.titles.find(t => String(t.name).trim() === name);
      row.titleName = titleInput.value;
      row.titleId = match ? String(match.id) : '';
      row.needsReview = false;
      refreshPhotoImportStatuses();
    };

    const volumeInput = document.createElement('input');
    volumeInput.className = 'photo-import-volume';
    volumeInput.placeholder = '巻数';
    volumeInput.value = row.volume;
    volumeInput.oninput = function(){
      row.volume = volumeInput.value;
      row.needsReview = false;
      refreshPhotoImportStatuses();
    };

    const boxSelect = document.createElement('select');
    boxSelect.className = 'photo-import-box';
    fillPhotoImportBoxOptions(boxSelect, row.boxId);
    boxSelect.onchange = function(){
      row.boxId = boxSelect.value;
      refreshPhotoImportStatuses();
    };

    const statusArea = document.createElement('div');
    statusArea.className = 'photo-import-status';

    const recognized = document.createElement('div');
    recognized.className = 'photo-import-recognized';
    const recognizedParts = [`読み取り: ${row.recognizedTitle || '（不明）'} ${row.volume || ''}`.trim()];
    if(row.candidates.length > 1) recognizedParts.push(`候補: ${row.candidates.join(' / ')}`);
    if(row.notes) recognizedParts.push(row.notes);
    if(row.photo > 0 && photoImportState.images[row.photo - 1]){
      const photoLink = document.createElement('button');
      photoLink.type = 'button';
      photoLink.className = 'photo-import-photo-link';
      photoLink.textContent = `写真${row.photo}`;
      photoLink.onclick = function(){ openPhotoImportViewer(row.photo - 1); };
      recognized.appendChild(photoLink);
    }

    const recognizedText = document.createElement('span');
    recognizedText.textContent = recognizedParts.join('　');
    recognized.appendChild(recognizedText);

    const addPanel = buildPhotoTitleAddPanel(row);
    const addToggle = document.createElement('button');
    addToggle.type = 'button';
    addToggle.className = 'photo-import-add-toggle';
    addToggle.textContent = '作品を追加';
    addToggle.onclick = function(){
      const opening = addPanel.style.display === 'none';
      addPanel.style.display = opening ? 'grid' : 'none';
      if(opening) addPanel.querySelector('.photo-title-add-name').focus();
    };
    recognized.appendChild(addToggle);

    const finalToggle = document.createElement('button');
    finalToggle.type = 'button';
    finalToggle.className = 'photo-import-final-toggle';
    finalToggle.onclick = function(){
      row.markCompleted = !row.markCompleted;
      refreshPhotoImportStatuses();
    };
    recognized.appendChild(finalToggle);

    card.appendChild(check);
    card.appendChild(titleInput);
    card.appendChild(volumeInput);
    card.appendChild(boxSelect);
    card.appendChild(statusArea);
    card.appendChild(recognized);
    card.appendChild(addPanel);
    container.appendChild(card);

    row.render = function(status){
      statusArea.innerHTML = '';
      const badge = document.createElement('span');
      badge.className = `photo-import-badge status-${Object.keys(PHOTO_STATUS).find(k => PHOTO_STATUS[k] === status).toLowerCase()}`;
      badge.textContent = status;
      statusArea.appendChild(badge);

      const detail = getPhotoImportStatusDetail(row, status);
      if(detail){
        const note = document.createElement('span');
        note.className = 'photo-import-detail';
        note.textContent = detail;
        statusArea.appendChild(note);
      }

      if(status === PHOTO_STATUS.REVIEW && row.needsReview && String(row.volume || '').trim()){
        const ok = document.createElement('button');
        ok.type = 'button';
        ok.className = 'photo-import-ok';
        ok.textContent = 'OK';
        ok.onclick = function(){
          row.needsReview = false;
          refreshPhotoImportStatuses();
        };
        statusArea.appendChild(ok);
      }

      card.classList.toggle('is-unchecked', !row.checked);

      const title = photoImportState.titles.find(t => String(t.id) === String(row.titleId));
      const alreadyCompleted = !!title && String(title.completed || '').trim() === '完結済';
      if(!row.titleId || alreadyCompleted) row.markCompleted = false;
      finalToggle.style.display = row.titleId ? '' : 'none';
      finalToggle.disabled = alreadyCompleted;
      finalToggle.classList.toggle('is-active', row.markCompleted);
      finalToggle.textContent = alreadyCompleted
        ? '完結済の作品'
        : (row.markCompleted ? '✓ 最終巻（登録時に完結済へ更新）' : '最終巻');
    };
  });

  refreshPhotoImportStatuses();
}

//////////////////////////////
// 作品の追加（既存シリーズ / 新規シリーズ）
//////////////////////////////
function buildPhotoTitleAddPanel(row){
  const panel = document.createElement('div');
  panel.className = 'photo-title-add';
  panel.style.display = 'none';

  const nameInput = document.createElement('input');
  nameInput.className = 'photo-title-add-name';
  nameInput.placeholder = '作品名';
  nameInput.value = row.recognizedTitle || row.titleName || '';

  const modeName = `photoTitleAddMode-${row.rowId}`;
  const modeArea = document.createElement('div');
  modeArea.className = 'photo-title-add-mode';
  const modeInputs = {};
  [['existing', '既存シリーズ'], ['new', '新規シリーズ']].forEach(([value, text]) => {
    const label = document.createElement('label');
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = modeName;
    radio.value = value;
    radio.checked = value === 'existing';
    radio.onchange = syncMode;
    modeInputs[value] = radio;
    label.appendChild(radio);
    label.appendChild(document.createTextNode(text));
    modeArea.appendChild(label);
  });

  const seriesInput = document.createElement('input');
  seriesInput.className = 'photo-title-add-series';
  seriesInput.setAttribute('list', 'photoImportSeriesList');
  seriesInput.placeholder = '既存シリーズを選択';

  const newSeriesInput = document.createElement('input');
  newSeriesInput.className = 'photo-title-add-series';
  newSeriesInput.placeholder = '新規シリーズ名';
  newSeriesInput.value = nameInput.value;
  newSeriesInput.oninput = function(){ newSeriesInput.dataset.edited = '1'; };
  nameInput.oninput = function(){
    if(!newSeriesInput.dataset.edited) newSeriesInput.value = nameInput.value;
  };

  const typeSelect = document.createElement('select');
  ['漫画', 'ラノベ'].forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    typeSelect.appendChild(option);
  });

  const completedSelect = document.createElement('select');
  ['連載中', '完結済', '未完結'].forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    completedSelect.appendChild(option);
  });

  const actions = document.createElement('div');
  actions.className = 'photo-title-add-actions';
  const submit = document.createElement('button');
  submit.type = 'button';
  submit.textContent = '追加して選択';
  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.className = 'photo-title-add-cancel';
  cancel.textContent = 'キャンセル';
  cancel.onclick = function(){ panel.style.display = 'none'; };
  actions.appendChild(submit);
  actions.appendChild(cancel);

  function syncMode(){
    const isNew = modeInputs.new.checked;
    seriesInput.style.display = isNew ? 'none' : '';
    newSeriesInput.style.display = isNew ? '' : 'none';
  }
  syncMode();

  submit.onclick = function(){
    const name = nameInput.value.trim();
    const isNew = modeInputs.new.checked;
    const seriesName = seriesInput.value.trim();
    const series = photoImportState.series.find(s => String(s.name).trim() === seriesName);

    if(!name) return showError('作品名を入力してください');
    if(!isNew && !series) return showError('既存シリーズを一覧から選択してください');
    if(isNew && !newSeriesInput.value.trim()) return showError('新規シリーズ名を入力してください');

    submit.disabled = true;
    google.script.run
      .withSuccessHandler(function(res){
        submit.disabled = false;
        if(!res || !res.success){
          return showError(res && res.message ? res.message : '作品の追加に失敗しました');
        }
        applyAddedPhotoTitle(row, res);
        showSuccess(res.message);
      })
      .withFailureHandler(function(error){
        submit.disabled = false;
        showError(error && error.message ? error.message : '作品の追加に失敗しました');
      })
      .addTitleFromPhotoImport({
        name,
        seriesId: isNew ? '' : String(series.id),
        newSeriesName: isNew ? newSeriesInput.value.trim() : '',
        type: typeSelect.value,
        completed: completedSelect.value
      });
  };

  [nameInput, modeArea, seriesInput, newSeriesInput, typeSelect, completedSelect, actions]
    .forEach(el => panel.appendChild(el));
  return panel;
}

function applyAddedPhotoTitle(row, res){
  photoImportState.titles.push(res.title);
  fillPhotoImportDatalist('photoImportTitleList', photoImportState.titles);

  if(res.series && res.series.created){
    photoImportState.series.push({ id: res.series.id, name: res.series.name });
    fillPhotoImportDatalist('photoImportSeriesList', photoImportState.series);
  }

  // 同じ読み取り結果で未照合の行（同じ作品の別巻）にも適用する
  const recognized = String(row.recognizedTitle || '').trim();
  photoImportState.rows.forEach(other => {
    if(other === row){
      other.titleId = res.title.id;
      other.titleName = res.title.name;
      other.needsReview = false;
      return;
    }
    if(!other.titleId && recognized && String(other.recognizedTitle || '').trim() === recognized){
      other.titleId = res.title.id;
      other.titleName = res.title.name;
      other.needsReview = !!other.uncertain;
    }
  });

  renderPhotoImportRows();
  refreshMasterData();
}

function refreshPhotoImportStatuses(){
  photoImportState.rows.forEach((row, index) => {
    row.status = getPhotoImportStatus(row, index);
    if(row.render) row.render(row.status);
  });
  updatePhotoImportRegisterButton();
}

function getRegistrablePhotoRows(){
  return photoImportState.rows.filter(row => row.checked && row.status === PHOTO_STATUS.OK);
}

function updatePhotoImportRegisterButton(){
  const button = document.getElementById('photoImportRegisterButton');
  if(!button) return;
  const count = getRegistrablePhotoRows().length;
  button.textContent = `登録確定（${count}件）`;
  button.disabled = photoImportState.busy || count === 0;
}

//////////////////////////////
// Box一括指定（個別変更も含め全行に適用）
//////////////////////////////
function applyPhotoImportBulkBox(){
  const boxId = document.getElementById('photoImportBulkBox').value;
  photoImportState.rows.forEach(row => { row.boxId = boxId; });
  document.querySelectorAll('#photoImportRows .photo-import-box')
    .forEach(select => { select.value = boxId; });
  refreshPhotoImportStatuses();
}

//////////////////////////////
// 登録確定
//////////////////////////////
function registerPhotoImport(){
  if(photoImportState.busy) return;

  const targets = getRegistrablePhotoRows();
  if(targets.length === 0) return showError('登録できる行がありません');

  const payload = targets.map(row => ({
    rowId: row.rowId,
    titleId: row.titleId,
    volume: String(row.volume).trim(),
    boxId: row.boxId,
    label: `${row.titleName} ${String(row.volume).trim()}巻`,
    markCompleted: row.markCompleted
  }));

  setPhotoImportBusy(true);

  google.script.run
    .withSuccessHandler(function(res){
      setPhotoImportBusy(false);

      if(!res || !res.success){
        return showError(res && res.message ? res.message : '登録に失敗しました');
      }

      renderPhotoImportResult(res);

      const addedIds = new Set(res.addedRowIds || []);
      targets
        .filter(row => row.markCompleted && addedIds.has(row.rowId))
        .forEach(row => {
          const title = photoImportState.titles.find(t => String(t.id) === String(row.titleId));
          if(title) title.completed = '完結済';
        });
      if((res.completedTitles || []).length > 0) refreshMasterData();
      photoImportState.rows = photoImportState.rows.filter(row => !addedIds.has(row.rowId));
      targets.filter(row => addedIds.has(row.rowId)).forEach(row => {
        const parsed = parseVolumeInput(row.volume);
        if(parsed.valid) photoImportState.existingKeys.add(`${row.titleId}|${parsed.values[0]}`);
      });
      (res.duplicates || []).forEach(item => {
        const row = targets.find(t => t.rowId === item.rowId);
        const parsed = row ? parseVolumeInput(row.volume) : null;
        if(parsed && parsed.valid) photoImportState.existingKeys.add(`${row.titleId}|${parsed.values[0]}`);
      });
      renderPhotoImportRows();

      // 対応が必要な行が残っていなければ、写真と候補一覧をクリアする
      const pending = photoImportState.rows.some(row =>
        row.checked && row.status !== PHOTO_STATUS.DUPLICATE
      );
      if(res.added > 0 && !pending) resetPhotoImport();

      if(res.added > 0){
        showSuccess(`${res.added} 件を登録しました`);
        loadRecentLibrary('globalRecentLibraryTable');
        loadLibrarySummary('libraryGlobal');
        loadLibraryMaster();
      } else {
        showError('登録された本はありません');
      }
    })
    .withFailureHandler(function(error){
      setPhotoImportBusy(false);
      showError(error && error.message ? error.message : '登録に失敗しました');
    })
    .bulkAddLibraryFromPhoto(payload);
}

function resetPhotoImport(){
  document.getElementById('photoImportFiles').value = '';
  photoImportImagesPromise = null;
  photoImportState.images = [];
  photoImportState.rows = [];
  renderPhotoImportPreview();
  renderPhotoImportRows();
  document.getElementById('photoImportReview').style.display = 'none';
}

function renderPhotoImportResult(res){
  const area = document.getElementById('photoImportResult');
  area.innerHTML = '';

  const summary = document.createElement('div');
  summary.className = 'photo-import-result-summary';
  summary.textContent = `成功 ${res.added} 件 ／ 重複スキップ ${(res.duplicates || []).length} 件 ／ 失敗 ${(res.failed || []).length} 件`;
  area.appendChild(summary);

  if((res.completedTitles || []).length > 0){
    const completed = document.createElement('div');
    completed.textContent = `完結済に更新: ${res.completedTitles.join('、')}`;
    area.appendChild(completed);
  }

  const addList = (items, prefix) => {
    if(!items || items.length === 0) return;
    const list = document.createElement('ul');
    items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${prefix}: ${item.label} — ${item.message}`;
      list.appendChild(li);
    });
    area.appendChild(list);
  };

  addList(res.duplicates, '重複スキップ');
  addList(res.failed, '失敗');
}

window.openPhotoImportForm = openPhotoImportForm;
window.previewPhotoImportFiles = previewPhotoImportFiles;
window.closePhotoImportViewer = closePhotoImportViewer;
window.analyzePhotoImport = analyzePhotoImport;
window.applyPhotoImportBulkBox = applyPhotoImportBulkBox;
window.registerPhotoImport = registerPhotoImport;
</script>
