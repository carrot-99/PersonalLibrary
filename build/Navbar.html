<!-- Navbar.html -->
<div class="mode-switch" role="group" aria-label="管理対象の切り替え">
  <button type="button" data-mode="book" onclick="setAppMode('book');">📚 書籍</button>
  <button type="button" data-mode="anime" onclick="setAppMode('anime');">📺 アニメ</button>
</div>

<!-- ホーム（書籍・アニメ共通。起動時に開く） -->
<div class="tab-group common-group">
  <div class="tabs common-tabs">
    <button data-tab="HomeView" onclick="showTab('HomeView'); closeSidebar();">🏠 ホーム</button>
  </div>
</div>

<div class="tab-group entry-group book-only">
  <div class="tab-title">登録</div>
  <div class="tabs entry-tabs">
    <button data-tab="PhotoImportView" onclick="showTab('PhotoImportView'); closeSidebar();">写真で確認・登録</button>
    <button data-tab="WishListView" onclick="showTab('WishListView'); closeSidebar();">欲しい巻リスト</button>
    <button data-tab="ReleaseView" onclick="showTab('ReleaseView'); closeSidebar();">発売予定</button>
    <button data-tab="RecommendView" onclick="showTab('RecommendView'); closeSidebar();">おすすめ</button>
  </div>
</div>

<!-- 作品別・シリーズ別・箱別の詳細は、一覧の名前のリンクと上部の作品名検索から開く -->
<div class="tab-group list-group book-only">
  <div class="tab-title">一覧・管理</div>
  <div class="tabs list-tabs">
    <button data-tab="TitleListView" onclick="showTab('TitleListView'); closeSidebar();">作品一覧</button>
    <button data-tab="BoxListView" onclick="showTab('BoxListView'); closeSidebar();">箱一覧</button>
    <button data-tab="LibraryListView" onclick="showTab('LibraryListView'); closeSidebar();">書籍一覧</button>
  </div>
</div>

<div class="tab-group anime-group anime-only">
  <div class="tab-title">視聴・登録</div>
  <div class="tabs anime-tabs">
    <button data-tab="AnimeWatchingView" onclick="showTab('AnimeWatchingView'); closeSidebar();">視聴中の一覧（＋登録）</button>
    <button data-tab="AnimeSeasonView" onclick="showTab('AnimeSeasonView'); closeSidebar();">今期のアニメ</button>
  </div>
</div>

<div class="tab-group anime-group anime-only">
  <div class="tab-title">一覧・管理</div>
  <div class="tabs anime-tabs">
    <button data-tab="AnimeListView" onclick="showTab('AnimeListView'); closeSidebar();">アニメ一覧</button>
  </div>
</div>

<!-- 書籍・アニメ共通（どちらのモードでも表示。開いてもモードは切り替えない） -->
<div class="tab-group common-group">
  <div class="tab-title">シリーズ（書籍・アニメ共通）</div>
  <div class="tabs common-tabs">
    <button data-tab="SeriesListView" onclick="showTab('SeriesListView'); closeSidebar();">シリーズ一覧</button>
  </div>
</div>
