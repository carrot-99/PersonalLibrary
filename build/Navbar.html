<!-- Navbar.html -->
<div class="mode-switch" role="group" aria-label="管理対象の切り替え">
  <button type="button" data-mode="book" onclick="setAppMode('book'); closeSidebar();">📚 書籍</button>
  <button type="button" data-mode="anime" onclick="setAppMode('anime'); closeSidebar();">📺 アニメ</button>
</div>

<div class="tab-group entry-group book-only">
  <div class="tab-title">登録</div>
  <div class="tabs entry-tabs">
    <button data-tab="PhotoImportView" onclick="showTab('PhotoImportView'); closeSidebar();">写真で確認・登録</button>
    <button data-tab="WishListView" onclick="showTab('WishListView'); closeSidebar();">欲しい巻リスト</button>
  </div>
</div>

<div class="tab-group search-group book-only">
  <div class="tab-title">検索</div>
  <div class="tabs search-tabs">
    <button data-tab="SeriesView" onclick="showTab('SeriesView'); closeSidebar();">シリーズ別検索</button>
    <button data-tab="TitleView" onclick="showTab('TitleView'); closeSidebar();">作品別検索</button>
    <button data-tab="BoxView" onclick="showTab('BoxView'); closeSidebar();">箱別検索</button>
  </div>
</div>

<div class="tab-group list-group book-only">
  <div class="tab-title">一覧</div>
  <div class="tabs list-tabs">
    <button data-tab="SeriesListView" onclick="showTab('SeriesListView'); closeSidebar();">シリーズ一覧</button>
    <button data-tab="TitleListView" onclick="showTab('TitleListView'); closeSidebar();">作品一覧</button>
    <button data-tab="BoxListView" onclick="showTab('BoxListView'); closeSidebar();">箱一覧</button>
    <button data-tab="LibraryListView" onclick="showTab('LibraryListView'); closeSidebar();">書籍一覧</button>
  </div>
</div>

<div class="tab-group master-group book-only">
  <div class="tab-title">マスタ管理</div>
  <div class="tabs master-tabs">
    <button data-tab="SeriesMasterView" onclick="showTab('SeriesMasterView'); closeSidebar();">シリーズマスタ管理</button>
    <button data-tab="TitleMasterView" onclick="showTab('TitleMasterView'); closeSidebar();">作品マスタ管理</button>
    <button data-tab="BoxMasterView" onclick="showTab('BoxMasterView'); closeSidebar();">箱マスタ管理</button>
    <button data-tab="LibraryMasterView" onclick="showTab('LibraryMasterView'); closeSidebar();">書籍マスタ管理</button>
  </div>
</div>

<div class="tab-group anime-group anime-only">
  <div class="tab-title">視聴・登録</div>
  <div class="tabs anime-tabs">
    <button data-tab="AnimeWatchingView" onclick="showTab('AnimeWatchingView'); closeSidebar();">視聴中の一覧</button>
    <button data-tab="AnimeEntryView" onclick="showTab('AnimeEntryView'); closeSidebar();">アニメ登録</button>
  </div>
</div>

<div class="tab-group anime-group anime-only">
  <div class="tab-title">検索</div>
  <div class="tabs anime-tabs">
    <button data-tab="AnimeSeriesView" onclick="showTab('AnimeSeriesView'); closeSidebar();">シリーズ別検索</button>
  </div>
</div>

<div class="tab-group anime-group anime-only">
  <div class="tab-title">マスタ管理</div>
  <div class="tabs anime-tabs">
    <button data-tab="AnimeMasterView" onclick="showTab('AnimeMasterView'); closeSidebar();">アニメ作品マスタ管理</button>
    <button data-tab="AnimeSeasonMasterView" onclick="showTab('AnimeSeasonMasterView'); closeSidebar();">アニメ期マスタ管理</button>
  </div>
</div>
