<!-- Title.html -->
<script>
//////////////////////////////
// タイトル一覧
//////////////////////////////
// titleId: 上部バーの検索から呼ぶときに指定（入力欄の部分一致による取り違えを避ける）
function showTitle(titleId){
  const id = titleId || getAutocompleteValue('titleViewSelectInput') || document.getElementById('titleViewSelect').value;
  if(!id) return showError('作品を選択してください');

  showInlineLoading('TitleView', '検索中...');

  google.script.run
    .withSuccessHandler(function(data){
      hideInlineLoading('TitleView');
      const rows = (data || []).slice().sort((a, b) => compareVolumes(a.volume, b.volume));
      const title = (masterCache.titleOptions || []).find(t => String(t.id) === String(id));
      renderTitleHero(title, rows);
      renderTitleOwnershipSummary(rows.map(row => row.volume), title ? title.completed : '', title);
      appendTitleReadLine(rows, id);
      renderTitleVolumeGrid(rows, [], id);
      appendTitleWishLine(id, rows);
      renderTableReadOnly('titleTable', rows, ['volume','box','read'], {
        box: row => openBoxDetail(row.box)
      });
      document.getElementById('titleTableSection').style.display = rows.length > 0 ? 'block' : 'none';
    })
    .withFailureHandler(function(error){
      hideInlineLoading('TitleView');
      showError(error && error.message ? error.message : '検索に失敗しました');
    })
    .getTitleDetail(id);
}

// 作品の詳細の見出し（作品名・種別・完結）と数字のまとめ（所持・抜け・積読・次の巻）
function renderTitleHero(title, rows){
  const chips = title
    ? [title.type, title.completed].filter(Boolean).map(text => ({
        text,
        className: text === 'ラノベ' ? 'is-novel' : (text === '完結済' ? 'is-done' : '')
      }))
    : [];
  renderDetailHero('titleDetailHero', title ? title.name : '', chips, buildTitleStats(rows, title ? title.completed : ''));
}

// 数字のまとめ（DOM を使わない）。rows: getTitleDetail の行（volume, read）
// 戻り値: [{ label, value, tone? }]（tone: 'ok' / 'warning'）
function buildTitleStats(rows, completed){
  const summary = summarizeOwnedVolumes((rows || []).map(row => row.volume));
  const unread = (rows || []).filter(row => row.read === '未読').length;
  const isCompleted = String(completed || '').trim() === '完結済';
  const stats = [
    { label: '所持', value: `${summary.count}冊` },
    { label: '抜け', value: summary.count === 0 ? '-' : `${summary.missing.length}巻`, tone: summary.missing.length > 0 ? 'warning' : (summary.count > 0 ? 'ok' : '') },
    { label: '積読', value: `${unread}冊`, tone: unread === 0 && summary.count > 0 ? 'ok' : '' }
  ];
  if(isCompleted){
    const allOwned = summary.numbers.length > 0 && summary.missing.length === 0;
    stats.push({ label: '完結済', value: allOwned ? '全巻所持' : '抜けあり', tone: allOwned ? 'ok' : 'warning' });
  } else {
    stats.push({ label: '次の巻', value: `${summary.next}巻` });
  }
  return stats;
}

// 巻の一覧（1 巻から最大巻まで並べ、所持・読書・抜け・欲しい巻を色で示す）
// 持っている巻は押すと 読了 ⇄ 未読（読書中は読了）を切り替えて表示し直す（titleId があるとき）
function renderTitleVolumeGrid(rows, wishVolumes, titleId){
  const section = document.getElementById('titleVolumeSection');
  const grid = document.getElementById('titleVolumeGrid');
  if(!section || !grid) return;

  const cells = buildTitleVolumeGrid(rows, wishVolumes);
  grid.innerHTML = '';
  if(cells.length === 0){
    section.style.display = 'none';
    return;
  }
  const STATE_LABELS = { read: '読了', reading: '読書中', unread: '未読', missing: '未所持', wish: '欲しい巻' };
  cells.forEach(cell => {
    const clickable = Boolean(cell.id && titleId);
    const chip = document.createElement(clickable ? 'button' : 'span');
    chip.className = `volume-chip is-${cell.state}${cell.wished && cell.state !== 'wish' ? ' is-wished' : ''}`;
    chip.textContent = cell.label;
    chip.title = `${cell.label}${/^\d+(\.\d+)?$/.test(cell.label) ? '巻' : ''}: ${STATE_LABELS[cell.state]}${cell.wished && cell.state !== 'wish' ? '（欲しい巻）' : ''}`;
    if(clickable){
      const next = getVolumeToggleStatus(cell.state);
      chip.type = 'button';
      chip.title += `（押すと${next}に）`;
      chip.addEventListener('click', function(){
        setReadStatus([cell.id], next, function(){ showTitle(titleId); }, chip);
      });
    }
    grid.appendChild(chip);
  });
  section.style.display = 'block';
}

// 巻の一覧で押したときの読書状況（DOM を使わない）。読了 → 未読、未読・読書中 → 読了
function getVolumeToggleStatus(state){
  return state === 'read' ? '未読' : '読了';
}

// 巻の一覧のデータ（DOM を使わない）。整数の巻は 1 から最大巻まで（未所持も含める）、小数の巻（5.5 など）は
// 持っているか欲しい巻にあるものだけを数の順に間へ入れ、数字以外の巻は後ろに並べる
// rows: [{ id, volume, read }]、wishVolumes: 欲しい巻リストの巻
// 戻り値: [{ label, state: 'read'|'reading'|'unread'|'missing'|'wish', wished, id }]（id は持っている巻の書籍 ID）
function buildTitleVolumeGrid(rows, wishVolumes){
  const normalize = v => {
    const text = String(v == null ? '' : v).trim();
    return /^\d+(\.\d+)?$/.test(text) ? String(Number(text)) : text;
  };
  const owned = new Map();
  (rows || []).forEach(row => {
    const key = normalize(row.volume);
    if(key) owned.set(key, row);
  });
  const wished = new Set((wishVolumes || []).map(normalize).filter(Boolean));

  const readState = read => read === '読了' ? 'read' : (read === '読書中' ? 'reading' : 'unread');
  const toCell = key => {
    const row = owned.get(key);
    return {
      label: key,
      state: row ? readState(row.read || '未読') : (wished.has(key) ? 'wish' : 'missing'),
      wished: wished.has(key),
      id: row && row.id ? row.id : ''
    };
  };

  const keys = Array.from(new Set([...owned.keys(), ...wished]));
  const isNumber = k => /^\d+(\.\d+)?$/.test(k);
  const integers = keys.filter(k => /^\d+$/.test(k)).map(Number);
  const max = integers.length > 0 ? Math.max(...integers) : 0;
  const numberKeys = new Set(keys.filter(isNumber));
  for(let n = 1; n <= max; n++) numberKeys.add(String(n));

  return [
    ...Array.from(numberKeys).sort((a, b) => Number(a) - Number(b)),
    ...keys.filter(k => !isNumber(k)).sort(compareVolumes)
  ].map(toCell);
}

// 作品表示の所持状況（シリーズ・所持巻・抜け・次の巻）
// title: 作品の選択肢（seriesId / seriesName があればシリーズ別検索へのリンクを出す）
function renderTitleOwnershipSummary(volumes, completed, title){
  const box = document.getElementById('titleOwnershipSummary');
  if(!box) return;

  const summary = summarizeOwnedVolumes(volumes);
  const isCompleted = String(completed || '').trim() === '完結済';
  box.innerHTML = '';

  const addLine = (label, value, className) => {
    const line = document.createElement('div');
    line.className = `ownership-line ${className || ''}`.trim();
    const strong = document.createElement('strong');
    strong.textContent = label;
    const span = document.createElement('span');
    span.textContent = value;
    line.appendChild(strong);
    line.appendChild(span);
    box.appendChild(line);
    return span;
  };

  if(title && title.seriesId && title.seriesName){
    const span = addLine('シリーズ', '');
    span.appendChild(createCellLink(title.seriesName, () => openSeriesDetail(title.seriesId)));
  }

  if(summary.count === 0){
    addLine('所持', 'この作品の本はまだ登録されていません');
  } else {
    const owned = [];
    if(summary.numbers.length > 0) owned.push(`${formatVolumeRanges(summary.numbers)}巻`);
    owned.push(...summary.others);
    addLine('所持', `${summary.count}冊（${owned.join(', ')}）`);
    addLine('抜け',
      summary.missing.length > 0 ? `${formatVolumeRanges(summary.missing)}巻` : 'なし',
      summary.missing.length > 0 ? 'is-warning' : 'is-ok');
  }

  if(isCompleted){
    const allOwned = summary.numbers.length > 0 && summary.missing.length === 0;
    addLine('完結済', allOwned ? '抜けなく所持しています' : '抜けている巻があります', allOwned ? 'is-ok' : 'is-warning');
  } else {
    addLine('次の巻', `${summary.next}巻`);
  }

  box.style.display = 'block';
}

// 作品表示に読書状況を追記（積読の冊数と次に読む巻。[n巻を読了] で読了にして表示し直す）
function appendTitleReadLine(rows, titleId){
  const box = document.getElementById('titleOwnershipSummary');
  if(!box || rows.length === 0) return;

  const unread = rows.filter(row => row.read === '未読').length;
  const next = pickNextReadVolume(rows);

  const line = document.createElement('div');
  line.className = `ownership-line ${next ? '' : 'is-ok'}`.trim();
  const strong = document.createElement('strong');
  strong.textContent = '読書';
  const span = document.createElement('span');
  span.textContent = next
    ? `次は ${next.volume}巻${next.read === '読書中' ? '（読書中）' : ''}・積読 ${unread}冊 `
    : 'すべて読了';
  line.appendChild(strong);
  line.appendChild(span);
  if(next){
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'read-action';
    button.textContent = `${next.volume}巻を読了`;
    button.addEventListener('click', function(){
      setReadStatus([next.id], '読了', function(){ showTitle(titleId); }, button);
    });
    span.appendChild(button);
  }
  box.appendChild(line);

  appendTitleReadBulkLine(rows, titleId);
}

// まとめて読了（「n巻まで」を選んで、それまでの未読・読書中の巻を読了にする）。読了していない巻が 2 冊以上のときだけ出す
function appendTitleReadBulkLine(rows, titleId){
  const box = document.getElementById('titleOwnershipSummary');
  const targets = rows.filter(row => row.read !== '読了').sort((a, b) => compareVolumes(a.volume, b.volume));
  if(!box || targets.length < 2) return;

  const line = document.createElement('div');
  line.className = 'ownership-line read-bulk-line';
  const strong = document.createElement('strong');
  strong.textContent = 'まとめて';
  const span = document.createElement('span');
  span.className = 'read-bulk';

  const select = document.createElement('select');
  select.id = 'titleReadUpTo';
  select.setAttribute('aria-label', '読了にする最後の巻');
  targets.forEach(row => {
    const option = document.createElement('option');
    option.value = row.volume;
    option.textContent = `${row.volume}${/^\d+$/.test(String(row.volume).trim()) ? '巻' : ''}まで`;
    select.appendChild(option);
  });
  select.value = targets[targets.length - 1].volume;

  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'read-action';
  const updateLabel = () => {
    button.textContent = `${pickVolumesToMarkRead(rows, select.value).length}冊を読了にする`;
  };
  select.addEventListener('change', updateLabel);
  updateLabel();
  button.addEventListener('click', function(){
    const ids = pickVolumesToMarkRead(rows, select.value);
    if(ids.length === 0) return;
    setReadStatus(ids, '読了', function(){ showTitle(titleId); }, button);
  });

  span.appendChild(select);
  span.appendChild(button);
  line.appendChild(strong);
  line.appendChild(span);
  box.appendChild(line);
}

// まとめて読了にする巻の ID（DOM を使わない）。upTo の巻まで（巻の順）で、まだ読了でないもの
function pickVolumesToMarkRead(rows, upTo){
  return (rows || [])
    .filter(row => row.read !== '読了' && compareVolumes(row.volume, upTo) <= 0)
    .map(row => row.id);
}

// 作品表示に欲しい巻を追記（欲しい巻リストに登録がある場合のみ）。巻の一覧にも欲しい巻を反映する
function appendTitleWishLine(titleId, rows){
  callGAS('getWishKeys', function(keys){
    const box = document.getElementById('titleOwnershipSummary');
    if(!box || box.style.display === 'none') return;
    const prefix = `${titleId}|`;
    const volumes = (keys || []).filter(k => k.startsWith(prefix)).map(k => k.slice(prefix.length));
    if(volumes.length === 0) return;
    if(rows) renderTitleVolumeGrid(rows, volumes, titleId);

    const summary = summarizeOwnedVolumes(volumes);
    const parts = [];
    if(summary.numbers.length > 0) parts.push(`${formatVolumeRanges(summary.numbers)}巻`);
    parts.push(...summary.others);

    const line = document.createElement('div');
    line.className = 'ownership-line is-wish';
    const strong = document.createElement('strong');
    strong.textContent = '欲しい巻';
    const span = document.createElement('span');
    span.textContent = `★ ${parts.join(', ')}`;
    line.appendChild(strong);
    line.appendChild(span);
    box.appendChild(line);
  });
}

//////////////////////////////
// 作品一覧（絞り込み・並べ替えは createListFilter。追加・編集もこの画面で行う）
//////////////////////////////
let titleListFilter = null;

// options.refresh: 保存・追加の後（表示中の一覧のまま取り直す）
function loadTitleList(options = {}){
  if(!titleListFilter){
    titleListFilter = createListFilter({
      tableId: 'titleListTable',
      pageSize: 20,
      columns: [
        { key: 'id' },
        { key: 'name', edit: true, required: true, link: row => openTitleDetail(row.id) },
        { key: 'seriesName', edit: true, link: row => openSeriesDetail(row.seriesId) },
        { key: 'type', edit: true, editOptions: ['漫画', 'ラノベ'] },
        { key: 'completed', edit: true, editOptions: ['連載中', '完結済', '未完結'] },
        // 所持巻は抜けの多い順・所持冊数で並べる
        { key: 'owned', compare: (a, b) => (a.missingCount - b.missingCount) || (a.ownedCount - b.ownedCount) }
      ],
      keywordKeys: ['name', 'seriesName', 'owned'],
      filters: [
        { key: 'type', label: '種別' },
        { key: 'completed', label: '完結' },
        { key: 'ownStatus', label: '所持', options: ['抜けあり', '抜けなし', '未所持'] },
        // 未読あり: 未読・読書中の巻がある作品（未所持の作品はどちらにも入らない）
        { key: 'readStatus', label: '読書', options: ['未読あり', 'すべて読了'] },
        { key: 'seriesName', label: 'シリーズ' }
      ],
      defaultSort: { key: 'name', dir: 'asc' },
      edit: {
        update: 'updateTitleMaster',
        remove: 'deleteTitleMaster',
        onSaved: function(){ loadTitleList({ refresh: true }); refreshMasterData(); }
      }
    });
  }

  callGASCached('titleList', 'getTitleListWithOwnership', function(res){
      res = res || {};
      const volumesMap = res.volumes || {};
      const unreadMap = res.unread || {};
      const rows = (res.titles || []).map(item => {
        const summary = summarizeOwnedVolumes(volumesMap[String(item.id).trim()]);
        const unreadCount = Number(unreadMap[String(item.id).trim()]) || 0;
        return {
          id: item.id,
          name: item.name,
          seriesId: item.seriesId,
          seriesName: item.seriesName,
          type: item.type,
          completed: item.completed,
          owned: formatOwnershipText(summary, item.completed),
          ownedCount: summary.count,
          missingCount: summary.missing.length,
          ownStatus: summary.count === 0 ? '未所持' : (summary.missing.length > 0 ? '抜けあり' : '抜けなし'),
          readStatus: getTitleReadStatus(summary.count, unreadCount)
        };
      });
      titleListFilter.setRows(rows);
    }, { viewId: 'TitleListView', errorMessage: '作品一覧の読み込みに失敗しました', refresh: options.refresh });
}

// 作品一覧の「読書」の絞り込みの値（DOM を使わない）。所持なしは ''（どの選択肢にも入らない）
function getTitleReadStatus(ownedCount, unreadCount){
  if(!ownedCount) return '';
  return unreadCount > 0 ? '未読あり' : 'すべて読了';
}

//////////////////////////////
// 追加
//////////////////////////////
function addTitleMaster(){

  const name      = document.getElementById('newTitleName').value.trim();
  const seriesId  = getAutocompleteValue('newTitleSeriesInput') || document.getElementById('newTitleSeries').value;
  const type      = document.getElementById('newTitleType').value.trim();
  const completed = document.getElementById('newTitleCompleted').value;

  if(!name || !seriesId)
    return showError("作品名とシリーズは必須です");
  const message = checkTextInput(name, '作品名', { required: true });
  if(message) return showError(message);

  callGAS('addTitleMasterWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('newTitleName').value = '';
      document.getElementById('newTitleType').value = '';
      document.getElementById('newTitleCompleted').value = '連載中';
      loadTitleList({ refresh: true });
      refreshMasterData();
    }else{
      showError(res.message);
    }
  }, name, seriesId, type, completed);
}

window.showTitle = showTitle;
window.loadTitleList = loadTitleList;
window.addTitleMaster = addTitleMaster;

</script>
