<!-- Title.html -->
<script>
//////////////////////////////
// タイトル一覧
//////////////////////////////
// titleId: 上部バーの検索から呼ぶときに指定（入力欄の部分一致による取り違えを避ける）
function showTitle(titleId){
  const id = titleId || getAutocompleteValue('titleViewSelectInput') || document.getElementById('titleViewSelect').value;
  if(!id) return showError('作品を選択してください');

  showInlineLoading('TitleView', '検索中...');

  google.script.run
    .withSuccessHandler(function(data){
      hideInlineLoading('TitleView');
      const rows = (data || []).slice().sort((a, b) => compareVolumes(a.volume, b.volume));
      const title = (masterCache.titleOptions || []).find(t => String(t.id) === String(id));
      renderTitleOwnershipSummary(rows.map(row => row.volume), title ? title.completed : '', title);
      appendTitleReadLine(rows, id);
      appendTitleWishLine(id);
      renderTableReadOnly('titleTable', rows, ['volume','box','read'], {
        box: row => openBoxDetail(row.box)
      });
    })
    .withFailureHandler(function(error){
      hideInlineLoading('TitleView');
      showError(error && error.message ? error.message : '検索に失敗しました');
    })
    .getTitleDetail(id);
}

// 作品表示の所持状況（シリーズ・所持巻・抜け・次の巻）
// title: 作品の選択肢（seriesId / seriesName があればシリーズ別検索へのリンクを出す）
function renderTitleOwnershipSummary(volumes, completed, title){
  const box = document.getElementById('titleOwnershipSummary');
  if(!box) return;

  const summary = summarizeOwnedVolumes(volumes);
  const isCompleted = String(completed || '').trim() === '完結済';
  box.innerHTML = '';

  const addLine = (label, value, className) => {
    const line = document.createElement('div');
    line.className = `ownership-line ${className || ''}`.trim();
    const strong = document.createElement('strong');
    strong.textContent = label;
    const span = document.createElement('span');
    span.textContent = value;
    line.appendChild(strong);
    line.appendChild(span);
    box.appendChild(line);
    return span;
  };

  if(title && title.seriesId && title.seriesName){
    const span = addLine('シリーズ', '');
    span.appendChild(createCellLink(title.seriesName, () => openSeriesDetail(title.seriesId)));
  }

  if(summary.count === 0){
    addLine('所持', 'この作品の本はまだ登録されていません');
  } else {
    const owned = [];
    if(summary.numbers.length > 0) owned.push(`${formatVolumeRanges(summary.numbers)}巻`);
    owned.push(...summary.others);
    addLine('所持', `${summary.count}冊（${owned.join(', ')}）`);
    addLine('抜け',
      summary.missing.length > 0 ? `${formatVolumeRanges(summary.missing)}巻` : 'なし',
      summary.missing.length > 0 ? 'is-warning' : 'is-ok');
  }

  if(isCompleted){
    const allOwned = summary.numbers.length > 0 && summary.missing.length === 0;
    addLine('完結済', allOwned ? '抜けなく所持しています' : '抜けている巻があります', allOwned ? 'is-ok' : 'is-warning');
  } else {
    addLine('次の巻', `${summary.next}巻`);
  }

  box.style.display = 'block';
}

// 作品表示に読書状況を追記（積読の冊数と次に読む巻。[n巻を読了] で読了にして表示し直す）
function appendTitleReadLine(rows, titleId){
  const box = document.getElementById('titleOwnershipSummary');
  if(!box || rows.length === 0) return;

  const unread = rows.filter(row => row.read === '未読').length;
  const next = pickNextReadVolume(rows);

  const line = document.createElement('div');
  line.className = `ownership-line ${next ? '' : 'is-ok'}`.trim();
  const strong = document.createElement('strong');
  strong.textContent = '読書';
  const span = document.createElement('span');
  span.textContent = next
    ? `次は ${next.volume}巻${next.read === '読書中' ? '（読書中）' : ''}・積読 ${unread}冊 `
    : 'すべて読了';
  line.appendChild(strong);
  line.appendChild(span);
  if(next){
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'read-action';
    button.textContent = `${next.volume}巻を読了`;
    button.addEventListener('click', function(){
      setReadStatus([next.id], '読了', function(){ showTitle(titleId); }, button);
    });
    span.appendChild(button);
  }
  box.appendChild(line);
}

// 作品表示に欲しい巻を追記（欲しい巻リストに登録がある場合のみ）
function appendTitleWishLine(titleId){
  callGAS('getWishKeys', function(keys){
    const box = document.getElementById('titleOwnershipSummary');
    if(!box || box.style.display === 'none') return;
    const prefix = `${titleId}|`;
    const volumes = (keys || []).filter(k => k.startsWith(prefix)).map(k => k.slice(prefix.length));
    if(volumes.length === 0) return;

    const summary = summarizeOwnedVolumes(volumes);
    const parts = [];
    if(summary.numbers.length > 0) parts.push(`${formatVolumeRanges(summary.numbers)}巻`);
    parts.push(...summary.others);

    const line = document.createElement('div');
    line.className = 'ownership-line is-wish';
    const strong = document.createElement('strong');
    strong.textContent = '欲しい巻';
    const span = document.createElement('span');
    span.textContent = `★ ${parts.join(', ')}`;
    line.appendChild(strong);
    line.appendChild(span);
    box.appendChild(line);
  });
}

//////////////////////////////
// 作品一覧（絞り込み・並べ替えは createListFilter。追加・編集もこの画面で行う）
//////////////////////////////
let titleListFilter = null;

// options.refresh: 保存・追加の後（表示中の一覧のまま取り直す）
function loadTitleList(options = {}){
  if(!titleListFilter){
    titleListFilter = createListFilter({
      tableId: 'titleListTable',
      pageSize: 20,
      columns: [
        { key: 'id' },
        { key: 'name', edit: true, link: row => openTitleDetail(row.id) },
        { key: 'seriesName', edit: true, link: row => openSeriesDetail(row.seriesId) },
        { key: 'type', edit: true, editOptions: ['漫画', 'ラノベ'] },
        { key: 'completed', edit: true, editOptions: ['連載中', '完結済', '未完結'] },
        // 所持巻は抜けの多い順・所持冊数で並べる
        { key: 'owned', compare: (a, b) => (a.missingCount - b.missingCount) || (a.ownedCount - b.ownedCount) }
      ],
      keywordKeys: ['name', 'seriesName', 'owned'],
      filters: [
        { key: 'type', label: '種別' },
        { key: 'completed', label: '完結' },
        { key: 'ownStatus', label: '所持', options: ['抜けあり', '抜けなし', '未所持'] },
        { key: 'seriesName', label: 'シリーズ' }
      ],
      defaultSort: { key: 'name', dir: 'asc' },
      edit: {
        update: 'updateTitleMaster',
        remove: 'deleteTitleMaster',
        onSaved: function(){ loadTitleList({ refresh: true }); refreshMasterData(); }
      }
    });
  }

  callGASCached('titleList', 'getTitleListWithOwnership', function(res){
      res = res || {};
      const volumesMap = res.volumes || {};
      const rows = (res.titles || []).map(item => {
        const summary = summarizeOwnedVolumes(volumesMap[String(item.id).trim()]);
        return {
          id: item.id,
          name: item.name,
          seriesId: item.seriesId,
          seriesName: item.seriesName,
          type: item.type,
          completed: item.completed,
          owned: formatOwnershipText(summary, item.completed),
          ownedCount: summary.count,
          missingCount: summary.missing.length,
          ownStatus: summary.count === 0 ? '未所持' : (summary.missing.length > 0 ? '抜けあり' : '抜けなし')
        };
      });
      titleListFilter.setRows(rows);
    }, { viewId: 'TitleListView', errorMessage: '作品一覧の読み込みに失敗しました', refresh: options.refresh });
}

//////////////////////////////
// 追加
//////////////////////////////
function addTitleMaster(){

  const name      = document.getElementById('newTitleName').value.trim();
  const seriesId  = getAutocompleteValue('newTitleSeriesInput') || document.getElementById('newTitleSeries').value;
  const type      = document.getElementById('newTitleType').value.trim();
  const completed = document.getElementById('newTitleCompleted').value;

  if(!name || !seriesId)
    return showError("作品名とシリーズは必須です");

  callGAS('addTitleMasterWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('newTitleName').value = '';
      document.getElementById('newTitleType').value = '';
      document.getElementById('newTitleCompleted').value = '連載中';
      loadTitleList({ refresh: true });
      refreshMasterData();
    }else{
      showError(res.message);
    }
  }, name, seriesId, type, completed);
}

window.showTitle = showTitle;
window.loadTitleList = loadTitleList;
window.addTitleMaster = addTitleMaster;

</script>
