<!-- Title.html -->
<script>
//////////////////////////////
// タイトル一覧
//////////////////////////////
function showTitle(){
  const id = getAutocompleteValue('titleViewSelectInput') || document.getElementById('titleViewSelect').value;
  if(!id) return showError('作品を選択してください');

  callGAS('getTitleDetail', function(data){
    renderTableReadOnly('titleTable', data, ['volume','box']);
  }, id);
}

function loadTitleList(page = 1){
  const pageSize = 20;
  callGAS('getTitleMaster', function(data){
    const rows = (data || []).map(item => ({
      id: item.id,
      name: item.name,
      seriesName: item.seriesName,
      type: item.type,
      completed: item.completed
    }));

    const start = (page - 1) * pageSize;
    const pageRows = rows.slice(start, start + pageSize);

    renderPagedTableDOM({
      tableId: 'titleListTable',
      data: pageRows,
      columns: ['id', 'name', 'seriesName', 'type', 'completed'],
      currentPage: page,
      pageSize: pageSize,
      totalRows: rows.length,
      editable: false,
      onPageChange: loadTitleList
    });
  });
}

//////////////////////////////
// Master表示
//////////////////////////////
function loadTitleMaster(){
  document.getElementById('titleMasterTable').style.display = 'none';
  callGAS('getTitleMaster', function(data){
    masterCache.title = data;
    const keyword = document.getElementById('titleSearchKeyword').value.trim();
    if(keyword){
      filterTitle();
    }
  });
}

//////////////////////////////
// 追加
//////////////////////////////
function addTitleMaster(){

  const name      = document.getElementById('newTitleName').value.trim();
  const seriesId  = getAutocompleteValue('newTitleSeriesInput') || document.getElementById('newTitleSeries').value;
  const type      = document.getElementById('newTitleType').value.trim();
  const completed = document.getElementById('newTitleCompleted').value;

  if(!name || !seriesId)
    return showError("作品名とシリーズは必須です");

  callGAS('addTitleMasterWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('newTitleName').value = '';
      document.getElementById('newTitleType').value = '';
      document.getElementById('newTitleCompleted').value = '未完';
      loadTitleMaster();
      refreshMasterData();
    }else{
      showError(res.message);
    }
  }, name, seriesId, type, completed);
}

//////////////////////////////
// 検索
//////////////////////////////
function filterTitle(){
  const data = masterCache.title || [];
  renderFilteredTable('titleMasterTable', data, [
    'id',
    'name',
    'seriesName',
    'type',
    'completed'
  ], 'titleSearchKeyword');
}

</script>
