<!-- Anime.html -->
<script>
//////////////////////////////
// アニメ共通データ（getAnimeData の結果）
//////////////////////////////
const animeState = {
  anime: [],
  seasons: [],
  series: []
};

// サーバーの ANIME_STATUSES / ANIME_TYPES と同じ並び（一覧の絞り込み用）
const ANIME_STATUS_OPTIONS = ['視聴中', '視聴予定', '視聴済', '視聴中断'];
const ANIME_TYPE_OPTIONS = ['TV', 'OVA', '劇場版', 'その他'];

// 前回の結果をすぐ表示し、裏で取り直す（callGASCached）。refresh: 保存・登録の後（表示中のまま取り直す）
function loadAnimeData(viewId, onLoaded, refresh){
  callGASCached('animeData.' + viewId, 'getAnimeData', function(data){
    setAnimeState(data);
    onLoaded();
  }, { viewId, errorMessage: 'アニメの読み込みに失敗しました', refresh });
}

function setAnimeState(data){
  animeState.anime = (data && data.anime) || [];
  animeState.seasons = (data && data.seasons) || [];
  animeState.series = (data && data.series) || [];
  renderAnimeGlobalSummary(data);
}

// 上部のアニメサマリー（アニメモードで常時表示。アニメ画面でデータを取得するたびに更新）
function renderAnimeGlobalSummary(data){
  const seasons = (data && data.seasons) || [];
  const count = status => seasons.filter(s => s.status === status).length;
  const values = {
    animeGlobalDone: count('視聴済'),
    animeGlobalWatching: count('視聴中'),
    animeGlobalDropped: count('視聴中断'),
    animeGlobalPlanned: count('視聴予定'),
    animeGlobalWorks: ((data && data.anime) || []).length,
    animeGlobalEpisodes: seasons.reduce((sum, s) => sum + (Number(s.episodes) || 0), 0)
  };
  Object.entries(values).forEach(([id, value]) => {
    const el = document.getElementById(id);
    if(el) el.textContent = value.toLocaleString();
  });
}

function formatEpisodes(episodes){
  return episodes === '' || episodes == null ? '-' : `${episodes}話`;
}

// 期の行（表示用）
function toAnimeSeasonRow(season){
  return {
    id: season.id,
    animeName: season.animeName,
    name: season.name,
    type: season.type,
    episodes: formatEpisodes(season.episodes),
    status: season.status,
    updated: season.updated
  };
}

//////////////////////////////
// 視聴中の一覧（＋視聴予定）。登録フォームもこの画面に置く
//////////////////////////////
// options.refresh: 更新・登録の後（表示中のまま取り直す）
function loadAnimeWatchingView(options = {}){
  placeAnimeEntryForm('animeEntryHost', refreshAnimeWatchingView);
  loadAnimeData('AnimeWatchingView', function(){
    renderAnimeWatching();
    setupAnimeEntryForm();
  }, options.refresh);
}

function refreshAnimeWatchingView(){
  loadAnimeWatchingView({ refresh: true });
}

function renderAnimeWatching(){
  // 視聴中は最近更新した順、視聴予定は登録順
  const watching = animeState.seasons
    .filter(s => s.status === '視聴中')
    .sort((a, b) => (b.updatedValue - a.updatedValue) || b.id.localeCompare(a.id));
  const planned = animeState.seasons.filter(s => s.status === '視聴予定');

  document.getElementById('animeWatchingSummary').textContent = watching.length > 0
    ? `視聴中 ${watching.length}件`
    : '視聴中のアニメはありません（[＋ アニメを登録] で状況を「視聴中」にすると表示されます）';

  renderAnimeCards('animeWatchingCards', watching, season => [
    { label: '+1話', onClick: btn => updateAnimeWatchFromCard(btn, season, (Number(season.episodes) || 0) + 1, '視聴中') },
    { label: '視聴済にする', className: 'anime-done', onClick: btn => updateAnimeWatchFromCard(btn, season, season.episodes, '視聴済') },
    { label: '中断', className: 'anime-drop', onClick: btn => updateAnimeWatchFromCard(btn, season, season.episodes, '視聴中断') }
  ]);

  renderAnimeCards('animePlannedCards', planned, season => [
    { label: '視聴開始', onClick: btn => updateAnimeWatchFromCard(btn, season, season.episodes, '視聴中') }
  ], '視聴予定のアニメはありません');
}

function renderAnimeCards(containerId, seasons, actionsFn, emptyText){
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  if(seasons.length === 0 && emptyText){
    const empty = document.createElement('div');
    empty.className = 'anime-empty';
    empty.textContent = emptyText;
    container.appendChild(empty);
    return;
  }

  seasons.forEach(season => {
    const card = document.createElement('div');
    card.className = 'anime-card';

    const head = document.createElement('div');
    head.className = 'anime-card-head';
    const name = document.createElement('strong');
    name.textContent = season.name;
    const meta = document.createElement('span');
    meta.className = 'anime-card-meta';
    meta.textContent = [season.animeName !== season.name ? season.animeName : '', season.type].filter(Boolean).join('・');
    head.appendChild(name);
    head.appendChild(meta);
    card.appendChild(head);

    const line = document.createElement('div');
    line.className = 'anime-card-line';
    const episodes = document.createElement('span');
    episodes.className = 'anime-card-episodes';
    episodes.textContent = season.episodes === '' ? '未視聴' : `${season.episodes}話まで視聴`;
    line.appendChild(episodes);

    actionsFn(season).forEach(action => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `anime-action ${action.className || ''}`.trim();
      btn.textContent = action.label;
      btn.onclick = function(){ action.onClick(btn); };
      line.appendChild(btn);
    });

    card.appendChild(line);
    container.appendChild(card);
  });
}

function updateAnimeWatchFromCard(btn, season, episodes, status){
  const buttons = btn.closest('.anime-card').querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);

  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        showSuccess(res.message);
        // 取り直しを待たずにカードへ反映しておく
        season.episodes = episodes;
        season.status = status;
        renderAnimeWatching();
        refreshAnimeWatchingView();
      } else {
        buttons.forEach(b => b.disabled = false);
        showError(res && res.message ? res.message : '更新に失敗しました');
      }
    })
    .withFailureHandler(function(error){
      buttons.forEach(b => b.disabled = false);
      showError(error && error.message ? error.message : '更新に失敗しました');
    })
    .updateAnimeWatch(season.id, episodes, status);
}

//////////////////////////////
// 今期のアニメ（Annict から取得。getCurrentSeasonAnimeWeb）
// [登録] で登録フォームをこの画面へ移して開き、内容を確認してから登録する
//////////////////////////////
let animeSeasonFilter = null;
let animeSeasonKey = '';     // 表示する期（例: 2026-autumn。空欄なら今期）
let animeSeasonInfo = null;  // getCurrentSeasonAnimeWeb の結果

// メニューから開いたときは今期を表示
function loadAnimeSeasonView(){
  animeSeasonKey = '';
  fetchAnimeSeason(false);
}

function fetchAnimeSeason(forceRefresh){
  if(!animeSeasonFilter){
    animeSeasonFilter = createListFilter({
      tableId: 'animeSeasonTable',
      pageSize: 50,
      columns: [
        { key: 'title', link: row => window.open(row.url, '_blank', 'noopener') },
        { key: 'type' },
        { key: 'episodes', compare: (a, b) => (Number(a.episodesCount) || 0) - (Number(b.episodesCount) || 0) },
        { key: 'watchers' },
        { key: 'registered' },
        { key: 'action', button: row => row.work.registered ? null : { label: '登録', onClick: () => openAnimeEntryFromSeason(row.work) } }
      ],
      keywordKeys: ['title'],
      filters: [
        { key: 'type', label: '種別', options: ANIME_TYPE_OPTIONS },
        { key: 'registered', label: '登録' }
      ],
      defaultSort: { key: 'watchers', dir: 'desc' }
    });
  }

  const buttons = document.querySelectorAll('#AnimeSeasonView .anime-season-button');
  buttons.forEach(b => b.disabled = true);
  showInlineLoading('AnimeSeasonView', 'Annict から取得中...');

  const done = function(){
    hideInlineLoading('AnimeSeasonView');
    buttons.forEach(b => b.disabled = false);
  };

  google.script.run
    .withSuccessHandler(function(res){
      done();
      if(!res || !res.success){
        const message = res && res.message ? res.message : '今期のアニメの取得に失敗しました';
        document.getElementById('animeSeasonSummary').textContent = message;
        showError(message);
        return;
      }
      animeSeasonInfo = res;
      animeSeasonKey = res.season;
      setAnimeState(res.animeData);
      setupAnimeEntryForm();
      renderAnimeSeason();
    })
    .withFailureHandler(function(error){
      done();
      showError(error && error.message ? error.message : '今期のアニメの取得に失敗しました');
    })
    .getCurrentSeasonAnimeWeb(animeSeasonKey, !!forceRefresh);
}

function renderAnimeSeason(){
  const info = animeSeasonInfo;
  const works = info.works || [];
  const unregistered = works.filter(w => !w.registered).length;

  document.getElementById('animeSeasonTitle').textContent = `${info.seasonText}${info.isCurrent ? '（今期）' : ''}`;
  document.getElementById('animeSeasonSummary').textContent = works.length > 0
    ? `${works.length}作品（未登録 ${unregistered}件）・Annict から取得: ${info.fetchedAt}`
    : `この期の作品は Annict にありません（取得: ${info.fetchedAt}）`;

  animeSeasonFilter.setRows(works.map(toAnimeSeasonWorkRow));
}

// Annict の作品（表示用の行）
function toAnimeSeasonWorkRow(work){
  return {
    id: String(work.annictId),
    title: work.title,
    url: work.url,
    type: work.type,
    episodes: formatEpisodes(work.episodesCount),
    episodesCount: work.episodesCount,
    watchers: work.watchers,
    registered: work.registered ? (work.status || '登録済') : '未登録',
    work
  };
}

function moveAnimeSeason(offset){
  if(!animeSeasonInfo) return;
  animeSeasonKey = offset < 0 ? animeSeasonInfo.prevSeason : animeSeasonInfo.nextSeason;
  document.getElementById('animeEntryForm').style.display = 'none';
  fetchAnimeSeason(false);
}

function refreshAnimeSeason(){
  fetchAnimeSeason(true);
}

// [登録]: Annict の情報を登録フォームに入れて開く（状況は視聴予定。登録は [登録する] で確定）
function openAnimeEntryFromSeason(work){
  placeAnimeEntryForm('animeSeasonEntryHost', function(){
    document.getElementById('animeEntryForm').style.display = 'none';
    fetchAnimeSeason(false);
  });

  document.getElementById('animeEntryAnimeInput').value = work.suggestedAnimeName || work.title;
  document.getElementById('animeEntrySeriesInput').value = '';
  document.getElementById('animeEntrySeasonInput').value = work.title;
  document.getElementById('animeEntryType').value = work.type;
  document.getElementById('animeEntryEpisodesInput').value = '';
  document.getElementById('animeEntryStatus').value = '視聴予定';

  const detail = [work.mediaText, work.episodesCount ? `全${work.episodesCount}話` : ''].filter(Boolean).join('・');
  document.getElementById('animeEntrySource').textContent =
    `Annict の「${work.title}」${detail ? `（${detail}）` : ''}から入力しました。作品名・期名を確認して [登録する] を押してください`;

  const form = document.getElementById('animeEntryForm');
  form.style.display = 'block';
  syncAnimeEntrySeries();
  form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('animeEntryAnimeInput').focus();
}

//////////////////////////////
// アニメ一覧（絞り込み・並べ替えは createListFilter。編集・削除もこの画面で行う）
// 期ごと（期の編集・削除）と作品ごと（作品名・シリーズの編集）を切り替える
//////////////////////////////
let animeListFilter = null;
let animeWorkListFilter = null;
let animeListMode = 'season';

function refreshAnimeListView(){
  loadAnimeListView({ refresh: true });
}

// options.refresh: 保存・削除の後（表示中の一覧のまま取り直す）
function loadAnimeListView(options = {}){
  if(!animeListFilter){
    animeListFilter = createListFilter({
      tableId: 'animeListTable',
      pageSize: 30,
      columns: [
        { key: 'animeName', edit: true, required: true },
        { key: 'name', edit: true, required: true },
        { key: 'type', edit: true, editOptions: ANIME_TYPE_OPTIONS },
        // 表示は「12話」、編集は数値のまま
        { key: 'episodes', edit: row => row.episodeCount, compare: (a, b) => (Number(a.episodeCount) || 0) - (Number(b.episodeCount) || 0) },
        { key: 'status', edit: true, editOptions: ANIME_STATUS_OPTIONS },
        { key: 'updated', compare: (a, b) => a.updatedValue - b.updatedValue }
      ],
      keywordKeys: ['animeName', 'name', 'seriesName'],
      filters: [
        { key: 'status', label: '状況', options: ANIME_STATUS_OPTIONS },
        { key: 'type', label: '種別', options: ANIME_TYPE_OPTIONS },
        { key: 'seriesName', label: 'シリーズ' }
      ],
      defaultSort: { key: 'animeName', dir: 'asc' },
      edit: {
        update: 'updateAnimeSeasonMaster',
        remove: 'deleteAnimeSeason',
        onSaved: refreshAnimeListView
      }
    });
  }

  if(!animeWorkListFilter){
    animeWorkListFilter = createListFilter({
      tableId: 'animeWorkListTable',
      pageSize: 30,
      columns: [
        { key: 'name', edit: true, required: true },
        // シリーズ名からシリーズの詳細（書籍・アニメ共通）へ
        { key: 'seriesName', edit: true, link: row => openSeriesDetail(row.seriesId) },
        { key: 'seasonCount' },
        { key: 'episodeTotal' }
      ],
      keywordKeys: ['name', 'seriesName'],
      filters: [
        { key: 'seriesName', label: 'シリーズ' }
      ],
      defaultSort: { key: 'name', dir: 'asc' },
      edit: {
        update: 'updateAnimeMaster',
        onSaved: refreshAnimeListView
      }
    });
  }

  setAnimeListMode(animeListMode);

  loadAnimeData('AnimeListView', function(){
    animeListFilter.setRows(animeState.seasons.map(season => Object.assign(toAnimeSeasonRow(season), {
      seriesName: season.seriesName,
      episodeCount: season.episodes,
      updatedValue: season.updatedValue || 0
    })));

    animeWorkListFilter.setRows(animeState.anime.map(anime => {
      const seasons = animeState.seasons.filter(s => s.animeId === anime.id);
      return {
        id: anime.id,
        name: anime.name,
        seriesId: anime.seriesId,
        seriesName: anime.seriesName,
        seasonCount: seasons.length,
        episodeTotal: seasons.reduce((sum, s) => sum + (Number(s.episodes) || 0), 0)
      };
    }));
  }, options.refresh);
}

function setAnimeListMode(mode){
  animeListMode = mode === 'work' ? 'work' : 'season';
  document.getElementById('animeSeasonListPane').style.display = animeListMode === 'season' ? '' : 'none';
  document.getElementById('animeWorkListPane').style.display = animeListMode === 'work' ? '' : 'none';
  document.querySelectorAll('#AnimeListView .list-mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.listMode === animeListMode);
  });
}

//////////////////////////////
// アニメ登録（視聴中の一覧の [＋ アニメを登録]、今期のアニメの [登録]）
// フォームは 1 つで、開く画面へ移して使う。登録後の再読み込みは animeEntryOnSaved
//////////////////////////////
let animeEntryOnSaved = null;

function placeAnimeEntryForm(hostId, onSaved){
  const form = document.getElementById('animeEntryForm');
  const host = document.getElementById(hostId);
  if(form.parentElement !== host){
    form.style.display = 'none';
    host.appendChild(form);
  }
  animeEntryOnSaved = onSaved;
  document.getElementById('animeEntrySource').textContent = '';
}

function toggleAnimeEntryForm(){
  if(toggleAddForm('animeEntryForm')){
    document.getElementById('animeEntryAnimeInput').focus();
  }
}

// 作品・シリーズの候補を設定（データを取得するたびに呼ぶ）
function setupAnimeEntryForm(){
  populateAutocomplete('animeEntryAnimeInput', animeState.anime, a => a.name, 'id', '作品名（例: オーバーロード）');
  populateAutocomplete('animeEntrySeriesInput', animeState.series, s => s.name, 'id', 'シリーズ（空欄なら作品名と同じ）');

  // populateAutocomplete は oninput / onblur を上書きするため、作品の判定は addEventListener で 1 回だけ登録
  const input = document.getElementById('animeEntryAnimeInput');
  if(!input.dataset.animeEntryBound){
    input.dataset.animeEntryBound = '1';
    input.addEventListener('input', syncAnimeEntrySeries);
    input.addEventListener('blur', () => setTimeout(syncAnimeEntrySeries, 200));
  }
  syncAnimeEntrySeries();
}

function findAnimeByName(name){
  const key = String(name || '').trim().toLowerCase();
  if(!key) return null;
  return animeState.anime.find(a => a.name.trim().toLowerCase() === key) || null;
}

// 既存の作品ならシリーズ欄を隠し、新しい作品なら表示する
function syncAnimeEntrySeries(){
  const name = document.getElementById('animeEntryAnimeInput').value.trim();
  const anime = findAnimeByName(name);
  const hint = document.getElementById('animeEntryHint');
  const seriesRow = document.getElementById('animeEntrySeriesRow');

  if(!name){
    hint.textContent = '';
    seriesRow.style.display = 'none';
    return;
  }

  if(anime){
    const count = animeState.seasons.filter(s => s.animeId === anime.id).length;
    hint.textContent = `登録済みの作品に期を追加します（シリーズ: ${anime.seriesName || '未設定'}、登録済みの期 ${count}件）`;
    seriesRow.style.display = 'none';
  } else {
    hint.textContent = '新しい作品として登録します';
    seriesRow.style.display = '';
  }
}

function addAnimeSeasonFromForm(){
  const animeName = document.getElementById('animeEntryAnimeInput').value.trim();
  if(!animeName) return showError('作品名を入力してください');

  const form = {
    animeName,
    seriesName: findAnimeByName(animeName) ? '' : document.getElementById('animeEntrySeriesInput').value.trim(),
    seasonName: document.getElementById('animeEntrySeasonInput').value.trim(),
    type: document.getElementById('animeEntryType').value,
    episodes: document.getElementById('animeEntryEpisodesInput').value.trim(),
    status: document.getElementById('animeEntryStatus').value
  };

  const message = checkTextInputs([
    ['作品名', form.animeName],
    ['シリーズ', form.seriesName],
    ['期名', form.seasonName]
  ]);
  if(message) return showError(message);

  const button = document.getElementById('animeEntryButton');
  button.disabled = true;

  google.script.run
    .withSuccessHandler(function(res){
      button.disabled = false;
      if(res && res.success){
        showSuccess(res.message);
        document.getElementById('animeEntrySeasonInput').value = '';
        document.getElementById('animeEntryEpisodesInput').value = '';
        document.getElementById('animeEntrySeriesInput').value = '';
        // 新しいシリーズを作った可能性があるので書籍側の選択肢も更新
        refreshMasterData();
        (animeEntryOnSaved || refreshAnimeWatchingView)();
      } else {
        showError(res && res.message ? res.message : '登録に失敗しました');
      }
    })
    .withFailureHandler(function(error){
      button.disabled = false;
      showError(error && error.message ? error.message : '登録に失敗しました');
    })
    .addAnimeSeasonWeb(form);
}

window.loadAnimeWatchingView = loadAnimeWatchingView;
window.loadAnimeSeasonView = loadAnimeSeasonView;
window.moveAnimeSeason = moveAnimeSeason;
window.refreshAnimeSeason = refreshAnimeSeason;
window.toggleAnimeEntryForm = toggleAnimeEntryForm;
window.addAnimeSeasonFromForm = addAnimeSeasonFromForm;
window.setAnimeListMode = setAnimeListMode;
</script>
