<!-- AnimeMasterView.html -->
<div id="AnimeMasterView" class="view">
  <h3>アニメ作品マスタ管理</h3>

  <!-- ツールバー（追加は「アニメ登録」から） -->
  <div class="master-toolbar">
    <button onclick="toggleSearchForm('animeSearchForm')">検索</button>
  </div>

  <div id="animeSearchForm" class="master-form" style="display:none;">
    <input type="text" id="animeSearchKeyword" placeholder="キーワード（空欄で全件）">
    <button onclick="filterAnimeMaster()">検索実行</button>
  </div>

  <table class="table table-striped" id="animeMasterTable" style="display:none;">
    <thead>
      <tr>
        <th>AnimeID</th>
        <th>作品名</th>
        <th>シリーズ</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
