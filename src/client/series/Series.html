<!-- Series.html -->
<script>
//////////////////////////////
// シリーズ一覧
//////////////////////////////
function showSeries(){
  const id = getAutocompleteValue('seriesSelectInput') || document.getElementById('seriesSelect').value;
  if(!id) return showError('シリーズを選択してください');

  showInlineLoading('SeriesView', '検索中...');

  google.script.run
    .withSuccessHandler(function(data){
      hideInlineLoading('SeriesView');
      const rows = (data || []).map(item => ({
        name: item.name,
        count: item.count,
        owned: formatOwnershipText(summarizeOwnedVolumes(item.volumes), item.completed)
      }));
      renderTableReadOnly('seriesTable', rows, ['name','count','owned']);
    })
    .withFailureHandler(function(error){
      hideInlineLoading('SeriesView');
      showError(error && error.message ? error.message : '検索に失敗しました');
    })
    .getSeriesDetail(id);
}

function loadSeriesList(page = 1){
  const pageSize = 20;
  google.script.run
    .withSuccessHandler(function(data){
      hideInlineLoading('SeriesListView');
      const rows = (data || []).map(item => ({
        id: item.id,
        name: item.name
      }));

      const start = (page - 1) * pageSize;
      const pageRows = rows.slice(start, start + pageSize);

      renderPagedTableDOM({
        tableId: 'seriesListTable',
        data: pageRows,
        columns: ['id', 'name'],
        currentPage: page,
        pageSize: pageSize,
        totalRows: rows.length,
        editable: false,
        onPageChange: loadSeriesList
      });
    })
    .withFailureHandler(function(error){
      hideInlineLoading('SeriesListView');
      showError(error && error.message ? error.message : 'シリーズ一覧の読み込みに失敗しました');
    })
    .getSeriesMaster();
}

//////////////////////////////
// Master表示
//////////////////////////////
function loadSeriesMaster(){
  document.getElementById('seriesMasterTable').style.display = 'none';
  callGAS('getSeriesMaster', function(data){
    masterCache.series = data;
    const keyword = document.getElementById('seriesSearchKeyword').value.trim();
    if(keyword){
      filterSeries();
    }
  });
}

//////////////////////////////
// 追加
//////////////////////////////
function addSeriesMaster(){

  const name = document.getElementById('newSeriesName').value.trim();
  if(!name) return showError("シリーズ名は必須です");

  callGAS('addSeriesMasterWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('newSeriesName').value = '';
      loadSeriesMaster();
      refreshMasterData();
    }else{
      showError(res.message);
    }
  }, name);
}

//////////////////////////////
// 検索
//////////////////////////////
function filterSeries(){
  const data = masterCache.series || [];
  renderFilteredTable('seriesMasterTable', data, ['id','name'], 'seriesSearchKeyword');
}

window.showSeries = showSeries;
window.loadSeriesList = loadSeriesList;
window.loadSeriesMaster = loadSeriesMaster;
window.addSeriesMaster = addSeriesMaster;
window.filterSeries = filterSeries;
</script>
