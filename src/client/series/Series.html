<!-- Series.html -->
<script>
//////////////////////////////
// シリーズの詳細（書籍・アニメ共通）
//////////////////////////////
// seriesId: 一覧などのリンクから開くときに指定
function showSeries(seriesId){
  const id = seriesId || getAutocompleteValue('seriesSelectInput') || document.getElementById('seriesSelect').value;
  if(!id) return showError('シリーズを選択してください');

  showInlineLoading('SeriesView', '検索中...');

  google.script.run
    .withSuccessHandler(function(data){
      hideInlineLoading('SeriesView');
      renderSeriesBooks((data && data.titles) || []);
      renderSeriesAnime((data && data.seasons) || []);
    })
    .withFailureHandler(function(error){
      hideInlineLoading('SeriesView');
      showError(error && error.message ? error.message : '検索に失敗しました');
    })
    .getSeriesOverview(id);
}

// 書籍: 作品ごとの所持巻（作品名から作品の詳細へ）
function renderSeriesBooks(titles){
  const rows = titles.map(item => ({
    id: item.id,
    name: item.name,
    type: item.type,
    count: item.count,
    owned: formatOwnershipText(summarizeOwnedVolumes(item.volumes), item.completed)
  }));
  renderTableReadOnly('seriesTable', rows, ['name','type','count','owned'], {
    name: row => openTitleDetail(row.id)
  });
  document.getElementById('seriesBookEmpty').style.display = rows.length === 0 ? 'block' : 'none';
  document.getElementById('seriesBookSection').style.display = 'block';
}

// アニメ: まとめ（期の件数・状況・視聴話数）と期の表
function renderSeriesAnime(seasons){
  const box = document.getElementById('seriesAnimeSummary');
  box.innerHTML = '';

  const countBy = (key, values) => values
    .map(value => [value, seasons.filter(s => s[key] === value).length])
    .filter(([, count]) => count > 0)
    .map(([value, count]) => `${value} ${count}`)
    .join(' / ');

  const totalEpisodes = seasons.reduce((sum, s) => sum + (Number(s.episodes) || 0), 0);
  const lines = seasons.length === 0
    ? [['期', 'このシリーズのアニメは登録されていません']]
    : [
        ['期', `${seasons.length}件（${countBy('type', ANIME_TYPE_OPTIONS) || '種別未設定'}）`],
        ['状況', countBy('status', ANIME_STATUS_OPTIONS) || '未設定'],
        ['視聴話数', `合計 ${totalEpisodes}話`]
      ];

  lines.forEach(([label, value]) => {
    const line = document.createElement('div');
    line.className = 'ownership-line';
    const strong = document.createElement('strong');
    strong.textContent = label;
    const span = document.createElement('span');
    span.textContent = value;
    line.appendChild(strong);
    line.appendChild(span);
    box.appendChild(line);
  });
  box.style.display = 'block';

  renderTableReadOnly('seriesAnimeTable', seasons.map(toAnimeSeasonRow), ['animeName', 'name', 'type', 'episodes', 'status']);
  document.getElementById('seriesAnimeSection').style.display = 'block';
}

//////////////////////////////
// シリーズ一覧（書籍・アニメ共通。追加・編集・統合もこの画面で行う）
//////////////////////////////
let seriesListFilter = null;

function loadSeriesList(){
  if(!seriesListFilter){
    seriesListFilter = createListFilter({
      tableId: 'seriesListTable',
      pageSize: 20,
      columns: [
        { key: 'id' },
        { key: 'name', edit: true, link: row => openSeriesDetail(row.id) },
        { key: 'titleCount' },
        { key: 'seasonCount' }
      ],
      keywordKeys: ['id', 'name'],
      filters: [
        { key: 'hasBooks', label: '書籍', options: ['あり', 'なし'] },
        { key: 'hasAnime', label: 'アニメ', options: ['あり', 'なし'] }
      ],
      defaultSort: { key: 'name', dir: 'asc' },
      edit: {
        update: 'updateSeriesMaster',
        onSaved: function(){ loadSeriesList(); refreshMasterData(); }
      }
    });
  }

  google.script.run
    .withSuccessHandler(function(data){
      hideInlineLoading('SeriesListView');
      masterCache.series = data || [];
      seriesListFilter.setRows(masterCache.series.map(item => ({
        id: item.id,
        name: item.name,
        titleCount: item.titleCount,
        seasonCount: item.seasonCount,
        hasBooks: item.titleCount > 0 ? 'あり' : 'なし',
        hasAnime: item.seasonCount > 0 ? 'あり' : 'なし'
      })));
    })
    .withFailureHandler(function(error){
      hideInlineLoading('SeriesListView');
      showError(error && error.message ? error.message : 'シリーズ一覧の読み込みに失敗しました');
    })
    .getSeriesListWithCounts();
}

//////////////////////////////
// 統合（同じシリーズの別名を 1 つにまとめる）
//////////////////////////////
let seriesMergeConfirmTimer = null;

function toggleSeriesMergeForm(){
  if(!toggleMasterForm('seriesMergeForm')) return;
  const series = masterCache.series || [];
  ['seriesMergeFromInput', 'seriesMergeToInput'].forEach(id => {
    document.getElementById(id).value = '';
    populateAutocomplete(id, series, s => s.name, 'id', id === 'seriesMergeFromInput' ? 'まとめるシリーズ（削除される）' : '残すシリーズ');
  });
  resetSeriesMergeButton();
}

function resetSeriesMergeButton(){
  clearTimeout(seriesMergeConfirmTimer);
  const btn = document.getElementById('seriesMergeButton');
  btn.classList.remove('is-confirm');
  btn.textContent = '統合する';
  btn.disabled = false;
}

// 1 回目で確認表示、4 秒以内にもう一度押すと実行
function mergeSeriesFromForm(){
  const fromId = getAutocompleteValue('seriesMergeFromInput');
  const toId = getAutocompleteValue('seriesMergeToInput');
  if(!fromId || !toId) return showError('シリーズを候補から選択してください');
  if(fromId === toId) return showError('同じシリーズは統合できません');

  const btn = document.getElementById('seriesMergeButton');
  if(!btn.classList.contains('is-confirm')){
    const fromName = document.getElementById('seriesMergeFromInput').value.trim();
    const toName = document.getElementById('seriesMergeToInput').value.trim();
    btn.classList.add('is-confirm');
    btn.textContent = `「${fromName}」を「${toName}」に統合（もう一度押す）`;
    seriesMergeConfirmTimer = setTimeout(resetSeriesMergeButton, 4000);
    return;
  }

  clearTimeout(seriesMergeConfirmTimer);
  btn.disabled = true;
  callGAS('mergeSeries', function(res){
    resetSeriesMergeButton();
    if(res && res.success){
      showSuccess(res.message);
      document.getElementById('seriesMergeFromInput').value = '';
      document.getElementById('seriesMergeToInput').value = '';
      loadSeriesList();
      refreshMasterData();
    } else {
      showError(res && res.message ? res.message : '統合に失敗しました');
    }
  }, fromId, toId);
}

//////////////////////////////
// 追加
//////////////////////////////
function addSeriesMaster(){

  const name = document.getElementById('newSeriesName').value.trim();
  if(!name) return showError("シリーズ名は必須です");

  callGAS('addSeriesMasterWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('newSeriesName').value = '';
      loadSeriesList();
      refreshMasterData();
    }else{
      showError(res.message);
    }
  }, name);
}

window.showSeries = showSeries;
window.loadSeriesList = loadSeriesList;
window.toggleSeriesMergeForm = toggleSeriesMergeForm;
window.mergeSeriesFromForm = mergeSeriesFromForm;
window.addSeriesMaster = addSeriesMaster;
</script>
