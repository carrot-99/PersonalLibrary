<!-- TitleListView.html -->
<div id="TitleListView" class="view" style="display:none;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>作品一覧</h3>
    <button onclick="showInlineLoading('TitleListView', '読み込み中...'); loadTitleList(1, currentTitleListFilter || 'all')">読込</button>
  </div>

  <div class="master-toolbar" style="margin-bottom: 12px;">
    <button type="button" onclick="loadTitleList(1, 'all')">全作品</button>
    <button type="button" onclick="loadTitleList(1, '漫画')">漫画</button>
    <button type="button" onclick="loadTitleList(1, 'ラノベ')">ラノベ</button>
  </div>

  <table class="table table-striped" id="titleListTable">
    <thead>
      <tr>
        <th>TitleID</th>
        <th>作品名</th>
        <th>シリーズ</th>
        <th>種別</th>
        <th>完結</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
