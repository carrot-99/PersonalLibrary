<!-- TitleMasterView.html -->
<div id="TitleMasterView" class="view">
  <h3>作品マスタ管理</h3>

  <!-- ツールバー -->
  <div class="master-toolbar">
    <button onclick="toggleAddForm('titleAddForm')">追加</button>
    <button onclick="toggleSearchForm('titleSearchForm')">検索</button>
  </div>

  <!-- 追加フォーム（初期非表示） -->
  <div id="titleAddForm" class="master-form" style="display:none;">

    <input type="text" id="newTitleName" placeholder="作品名">

    <input id="newTitleSeriesInput" list="newTitleSeriesList" placeholder="シリーズを入力">
    <datalist id="newTitleSeriesList"></datalist>
    <select id="newTitleSeries" style="display:none;"></select>

    <select id="newTitleType">
      <option value="漫画">漫画</option>
      <option value="ラノベ">ラノベ</option>
    </select>

    <select id="newTitleCompleted">
      <option value="連載中">連載中</option>
      <option value="完結済">完結済</option>
      <option value="未完結">未完結</option>
    </select>

    <button onclick="addTitleMaster()">保存</button>
  </div>

  <!-- 検索フォーム（初期非表示） -->
  <div id="titleSearchForm" class="master-form" style="display:none;">
    <input type="text" id="titleSearchKeyword" placeholder="キーワード">
    <button onclick="filterTitle()">検索実行</button>
  </div>

  <!-- 一覧テーブル -->
  <table class="table table-striped" id="titleMasterTable" style="display:none;">
    <thead>
      <tr>
        <th>TitleID</th>
        <th>作品名</th>
        <th>シリーズ</th>
        <th>種別</th>
        <th>完結</th>
      </tr>
    </thead>
    <tbody id="titleMasterTableBody"></tbody>
  </table>
</div>
