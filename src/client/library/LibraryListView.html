<!-- LibraryListView.html -->
<div id="LibraryListView" class="view" style="display:none;">
  <!-- 見出しと操作（右寄せ） -->
  <div class="view-header">
    <h3>書籍一覧</h3>
    <div class="master-toolbar">
      <button onclick="toggleAddForm('libraryAddForm')">＋ 追加</button>
    </div>
  </div>

  <div id="libraryAddForm" class="master-form form-grid" style="display:none;">
    <input id="libraryAddTitleInput" list="libraryAddTitleList" placeholder="作品名を入力">
    <datalist id="libraryAddTitleList"></datalist>

    <input id="libraryAddVolumeInput" type="text" placeholder="巻数 例: 1-31 / 1, 3, 5-7">

    <input id="libraryAddBoxInput" list="libraryAddBoxList" placeholder="Box（任意）">
    <datalist id="libraryAddBoxList"></datalist>

    <button onclick="addLibraryMaster()">保存</button>
  </div>

  <!-- 絞り込み中（全ページ分）の書籍の読書状況をまとめて変更（applyLibraryReadBulk） -->
  <div class="read-bulk">
    <span>表示中の書籍を</span>
    <select id="libraryReadBulkStatus" onchange="resetLibraryReadBulkButton(document.getElementById('libraryReadBulkButton'))">
      <option value="読了">読了</option>
      <option value="読書中">読書中</option>
      <option value="未読">未読</option>
    </select>
    <button id="libraryReadBulkButton" type="button" onclick="applyLibraryReadBulk(this)">にする</button>
  </div>

  <table class="table table-striped" id="libraryListTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>作品名</th>
        <th>巻数</th>
        <th>Box</th>
        <th>読書</th>
        <th>追加日</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
