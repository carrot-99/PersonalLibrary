<!-- LibraryListView.html -->
<div id="LibraryListView" class="view" style="display:none;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>書籍一覧</h3>
    <button onclick="showInlineLoading('LibraryListView', '読み込み中...'); loadLibraryList(1)">読込</button>
  </div>
  <table class="table table-striped" id="libraryListTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>作品名</th>
        <th>巻数</th>
        <th>Box</th>
        <th>追加日</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
