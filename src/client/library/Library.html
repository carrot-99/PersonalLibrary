<script>
//////////////////////////////
// 巻数式の解析（写真で確認・登録で使用。サーバーの parseVolumeExpression と同じ仕様）
//////////////////////////////
function parseVolumeInput(rawVolume) {
  const input = String(rawVolume ?? '').trim();
  if(!input) {
    return { valid: false, message: '巻数を入力してください' };
  }

  const tokens = input.split(',').map(token => token.trim()).filter(Boolean);
  if(tokens.length === 0) {
    return { valid: false, message: '巻数の形式が不正です' };
  }

  const values = [];
  const seen = new Set();

  for(const token of tokens){
    const rangeMatch = token.match(/^([1-9]\d*)\s*-\s*([1-9]\d*)$/);
    if(rangeMatch){
      const start = Number(rangeMatch[1]);
      const end = Number(rangeMatch[2]);

      if(end <= start){
        return { valid: false, message: `巻数 ${token} は A<B の形式で入力してください` };
      }

      for(let value = start; value <= end; value++){
        const valueKey = String(value);
        if(seen.has(valueKey)){
          return { valid: false, message: `巻数 ${value} が重複しています` };
        }
        seen.add(valueKey);
        values.push(valueKey);
      }
      continue;
    }

    const numericToken = token.trim();
    if(/^(?:0|[1-9]\d*)$/.test(numericToken)){
      const valueKey = String(Number(numericToken));
      if(seen.has(valueKey)){
        return { valid: false, message: `巻数 ${numericToken} が重複しています` };
      }
      seen.add(valueKey);
      values.push(valueKey);
      continue;
    }

    // 数字以外の巻（「上」「外伝」など）
    const message = checkTextInput(token, `巻数「${token}」`, { max: SHORT_MAX_LENGTH });
    if(message){
      return { valid: false, message };
    }
    if(seen.has(token)){
      return { valid: false, message: `巻数 ${token} が重複しています` };
    }

    seen.add(token);
    values.push(token);
  }

  return { valid: true, values, text: values.join(', ') };
}

// 書籍一覧の編集の巻数（1 巻だけ）。エラーメッセージを返す（問題なければ ''）
function checkSingleVolumeInput(value){
  const parsed = parseVolumeInput(value);
  if(!parsed.valid) return parsed.message;
  return parsed.values.length === 1 ? '' : '巻数は 1 巻だけ入力してください';
}

//////////////////////////////
// 最近追加ライブラリ読み込み
//////////////////////////////
// 前回の結果をすぐ表示し、裏で取り直す（callGASCached）
function loadRecentLibrary(tableId = 'globalRecentLibraryTable') {
  callGASCached('recentLibrary.' + tableId, 'getRecentLibrary', function(data){
    renderRecentLibrary(data || [], tableId);
  });
}

function loadLibrarySummary(prefix = 'libraryGlobal') {
  callGASCached('librarySummary.' + prefix, 'getLibrarySummary', function(summary){
    updateLibrarySummary(summary || {}, prefix);
  });
}

function updateLibrarySummary(summary, prefix) {
  const idMap = {
    total: `${prefix}Total`,
    uniqueTitles: `${prefix}Unique`,
    uniqueBoxes: `${prefix}Boxes`,
    lastAdded: `${prefix}LastAdded`
  };

  Object.keys(idMap).forEach(key => {
    const el = document.getElementById(idMap[key]);
    if(el){
      el.textContent = summary[key] || (key === 'lastAdded' ? '-' : '0');
    }
  });

  const extraIds = {
    mangaTotal: `${prefix}MangaTotal`,
    novelTotal: `${prefix}NovelTotal`,
    unread: `${prefix}Unread`
  };

  Object.keys(extraIds).forEach(key => {
    const el = document.getElementById(extraIds[key]);
    if(el){
      el.textContent = summary[key] || '0';
    }
  });
}

//////////////////////////////
// 最近追加テーブル描画（作品名・巻数）
//////////////////////////////
function renderRecentLibrary(data, tableId = 'globalRecentLibraryTable') {
  const table = document.getElementById(tableId);
  if(!table) return;

  const tbody = table.querySelector('tbody');
  if(!tbody) return;

  tbody.innerHTML = '';

  const columns = ['title', 'volume'];

  data.forEach(row => {
    const tr = document.createElement('tr');

    columns.forEach(key => {
      const td = document.createElement('td');
      td.textContent = row[key] ?? '';
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

//////////////////////////////
// 書籍一覧の追加フォーム（作品・Box の候補）。画面を開いたときに呼ぶ
//////////////////////////////
function loadLibraryAddForm(){
  callGASCached('libraryAdd.titles', 'getTitleMaster', function(titles){
    titles = titles || [];
    const input = document.getElementById('libraryAddTitleInput');
    const list = document.getElementById('libraryAddTitleList');
    if(!input || !list) return;
    list.innerHTML = '';
    titles.forEach(item => {
      const option = document.createElement('option');
      option.value = getTitleLabel(item);
      option.dataset.value = String(item.id);
      list.appendChild(option);
    });
    input.oninput = function(){
      const match = findDatalistOption(list, input.value);
      input.dataset.selectedId = match ? match.dataset.value : '';
    };
  });

  callGASCached('libraryAdd.boxes', 'getBoxMaster', function(boxes){
    boxes = boxes || [];
    const input = document.getElementById('libraryAddBoxInput');
    const list = document.getElementById('libraryAddBoxList');
    if(!input || !list) return;
    list.innerHTML = '';
    boxes.forEach(item => {
      const option = document.createElement('option');
      option.value = `${item.id} : ${item.place}`;
      option.dataset.value = String(item.id);
      list.appendChild(option);
    });
    input.oninput = function(){
      const match = findDatalistOption(list, input.value);
      input.dataset.selectedId = match ? match.dataset.value : '';
    };
  });
}

function addLibraryMaster(){
  const titleId = document.getElementById('libraryAddTitleInput').dataset.selectedId ||
    getAutocompleteValue('libraryAddTitleInput') ||
    '';
  const boxId = document.getElementById('libraryAddBoxInput').dataset.selectedId ||
    getAutocompleteValue('libraryAddBoxInput') ||
    '';
  const volume = document.getElementById('libraryAddVolumeInput').value.trim();

  // Box は任意（空ならBoxなしで登録）
  if(!titleId || !volume){
    return showError('作品名・巻数は必須です');
  }
  const boxText = document.getElementById('libraryAddBoxInput').value.trim();
  if(boxText && !boxId){
    return showError('Boxは候補から選んでください（Boxなしなら空欄）');
  }

  callGAS('addNewVolumeWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('libraryAddTitleInput').value = '';
      document.getElementById('libraryAddTitleInput').dataset.selectedId = '';
      document.getElementById('libraryAddVolumeInput').value = '';
      document.getElementById('libraryAddBoxInput').value = '';
      document.getElementById('libraryAddBoxInput').dataset.selectedId = '';
      loadRecentLibrary('globalRecentLibraryTable');
      loadLibrarySummary('libraryGlobal');
      loadLibraryList({ refresh: true });
      refreshMasterData();
    } else {
      showError(res.message);
    }
  }, titleId, volume, boxId);
}

//////////////////////////////
// 書籍一覧（追加・編集・削除もこの画面で行う）
//////////////////////////////
let libraryListFilter = null;

// options.refresh: 保存・追加・削除の後（表示中の一覧のまま取り直す）
function loadLibraryList(options = {}){
  if(!libraryListFilter){
    libraryListFilter = createListFilter({
      tableId: 'libraryListTable',
      pageSize: 20,
      columns: [
        { key: 'id' },
        // 作品名は作品名→巻数の順で並べる
        { key: 'title', edit: true, required: true, link: row => openTitleDetail(row.titleId), compare: (a, b) => a.title.localeCompare(b.title, 'ja') || compareVolumes(a.volume, b.volume) },
        { key: 'volume', edit: true, required: true, validate: checkSingleVolumeInput, compare: (a, b) => compareVolumes(a.volume, b.volume) },
        // Box は任意（空欄で保存するとBoxなし）
        { key: 'box', edit: true, link: row => openBoxDetail(row.boxId) },
        // 読書状況（未読・読書中・読了。編集の 4 つ目の値として updateLibraryMaster に渡す）
        { key: 'read', edit: true, editOptions: READ_STATUS_OPTIONS },
        { key: 'date', compare: (a, b) => (a.dateValue - b.dateValue) || a.id.localeCompare(b.id) }
      ],
      keywordKeys: ['id', 'title', 'volume', 'box', 'date'],
      filters: [
        { key: 'read', label: '読書', options: READ_STATUS_OPTIONS },
        { key: 'type', label: '種別' },
        { key: 'box', label: 'Box' },
        { key: 'month', label: '追加月' }
      ],
      defaultSort: { key: 'date', dir: 'desc' },
      edit: {
        update: 'updateLibraryMaster',
        remove: 'deleteLibraryMaster',
        onSaved: function(){
          loadLibraryList({ refresh: true });
          loadRecentLibrary('globalRecentLibraryTable');
          loadLibrarySummary('libraryGlobal');
        }
      }
    });
  }

  callGASCached('libraryList', 'getLibraryListAll', function(rows){
    libraryListFilter.setRows((rows || []).map(row => Object.assign({}, row, { id: String(row.id) })));
  }, { viewId: 'LibraryListView', errorMessage: '書籍一覧の読み込みに失敗しました', refresh: options.refresh });
}

//////////////////////////////
// 書籍一覧: 絞り込み中の書籍の読書状況をまとめて変更（誤操作防止のため 2 回押しで確定）
//////////////////////////////
function applyLibraryReadBulk(btn){
  if(!libraryListFilter) return;
  const status = document.getElementById('libraryReadBulkStatus').value;
  const targets = libraryListFilter.getFilteredRows().filter(row => row.read !== status);
  if(targets.length === 0) return showError(`表示中の書籍はすべて「${status}」です`);

  if(btn.dataset.confirm !== 'true'){
    btn.dataset.confirm = 'true';
    btn.textContent = `${targets.length}冊を「${status}」にする（もう一度押して確定）`;
    btn.classList.add('is-confirm');
    clearTimeout(btn._resetTimer);
    btn._resetTimer = setTimeout(() => resetLibraryReadBulkButton(btn), 4000);
    return;
  }

  resetLibraryReadBulkButton(btn);
  const ids = targets.map(row => row.id);
  setReadStatus(ids, status, function(){
    libraryListFilter.updateRows(ids, { read: status });
    loadLibraryList({ refresh: true });
  }, btn);
}

function resetLibraryReadBulkButton(btn){
  clearTimeout(btn._resetTimer);
  btn.dataset.confirm = '';
  btn.textContent = 'にする';
  btn.classList.remove('is-confirm');
}

window.addLibraryMaster = addLibraryMaster;
window.loadRecentLibrary = loadRecentLibrary;
window.loadLibrarySummary = loadLibrarySummary;
window.updateLibrarySummary = updateLibrarySummary;
window.loadLibraryAddForm = loadLibraryAddForm;
window.loadLibraryList = loadLibraryList;

</script>
