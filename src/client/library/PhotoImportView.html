<!-- PhotoImportView.html -->
<div id="PhotoImportView" class="view">
  <h3>写真で確認・登録</h3>

  <!-- 手順の表示（今の段階を強調。updatePhotoImportSteps） -->
  <ol id="photoImportSteps" class="step-indicator" aria-label="手順">
    <li data-step="1"><span class="step-number">1</span><span class="step-label">写真を選ぶ</span></li>
    <li data-step="2"><span class="step-number">2</span><span class="step-label">所持を確認</span></li>
    <li data-step="3"><span class="step-number">3</span><span class="step-label">未所持を登録</span></li>
    <li data-step="4"><span class="step-number">4</span><span class="step-label">完了</span></li>
  </ol>

  <div id="photoImportPanel" class="photo-import-panel is-check-mode">
    <p class="photo-import-note">本の表紙・背表紙を撮ると、持っている巻かを確認できます。持っていない本はそのまま登録でき、持っている本はまとめて読了にできます。</p>
    <label for="photoImportFiles">本の写真（最大5枚）</label>
    <input id="photoImportFiles" type="file" accept="image/*" multiple onchange="previewPhotoImportFiles()">
    <div id="photoImportPreview" class="photo-import-preview"></div>
    <button id="photoImportAnalyzeButton" type="button" onclick="analyzePhotoImport()">チェック</button>

    <div id="photoImportReview" style="display:none;">
      <div id="photoImportSummary" class="photo-import-summary" style="display:none;"></div>

      <div class="register-only">
        <label for="photoImportBulkBox">一括Box</label>
        <select id="photoImportBulkBox" onchange="applyPhotoImportBulkBox()"></select>
      </div>

      <datalist id="photoImportTitleList"></datalist>
      <datalist id="photoImportSeriesList"></datalist>
      <div id="photoImportRows" class="photo-import-rows"></div>

      <!-- 確認モードの操作（スマホ幅では 2 つ並べて画面下に固定） -->
      <div class="photo-import-check-actions check-only">
        <button id="photoImportStartRegister" type="button" title="未所持の本を登録する" onclick="startPhotoImportRegister()">登録</button>
        <!-- 所持済みで読了でない本をまとめて読了にする（行の [読了にしない] で外せる。markPhotoImportRead） -->
        <button id="photoImportMarkRead" class="photo-import-mark-read" type="button" title="所持済みの本を読了にする" onclick="markPhotoImportRead()">読了</button>
      </div>
      <label class="register-only photo-import-read"><input type="checkbox" id="photoImportReadDone"> 読了として登録（チェックなしは未読）</label>
      <button id="photoImportRegisterButton" class="register-only" type="button" onclick="registerPhotoImport()">登録確定</button>
      <button id="photoImportBackToCheck" class="register-only photo-import-back" type="button" onclick="backToPhotoImportCheck()">確認結果に戻る</button>
    </div>

    <div id="photoImportResult" class="photo-import-result"></div>
  </div>

  <div id="photoImportViewer" class="photo-import-viewer" style="display:none;" onclick="closePhotoImportViewer(event)">
    <div class="photo-import-viewer-bar">
      <span id="photoImportViewerLabel"></span>
      <button type="button" onclick="closePhotoImportViewer()">閉じる</button>
    </div>
    <img id="photoImportViewerImage" alt="選択した写真" onclick="this.classList.toggle('is-zoomed')">
  </div>
</div>
