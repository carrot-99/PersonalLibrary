<!DOCTYPE html>
<html>
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <base target="_top">
    <?!= include('Styles') ?>
  </head>
  <body onload="initApp()">
    <div class="app-shell">
      <button id="menuToggle" class="menu-toggle" aria-label="メニューを開く" onclick="toggleSidebar()">
        ☰
      </button>

      <div id="sideMenuBackdrop" class="side-menu-backdrop" onclick="closeSidebar()"></div>

      <aside id="sideMenu" class="side-menu">
        <?!= include('Navbar') ?>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <h2>にんじん図書館</h2>
          <div class="global-search book-only">
            <input id="globalSearchInput" type="search" list="globalSearchList" placeholder="作品名で所持巻を検索" enterkeyhint="search" autocomplete="off"
              onchange="runGlobalSearch()" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); runGlobalSearch(); }">
            <datalist id="globalSearchList"></datalist>
          </div>
          <div id="globalNotification" class="notification" aria-live="polite"></div>
        </div>

        <div class="app-layout">
          <div class="left-panel-column">
            <div class="top-summary-panel book-only">
              <div class="summary-item compact">所蔵冊数<strong id="libraryGlobalTotal">0</strong></div>
              <div class="summary-item compact">漫画所蔵冊数<strong id="libraryGlobalMangaTotal">0</strong></div>
              <div class="summary-item compact">ラノベ所蔵冊数<strong id="libraryGlobalNovelTotal">0</strong></div>
              <div class="summary-item compact">登録作品数<strong id="libraryGlobalUnique">0</strong></div>
              <div class="summary-item compact">登録Box数<strong id="libraryGlobalBoxes">0</strong></div>
              <div class="summary-item compact">最新登録<strong id="libraryGlobalLastAdded">-</strong></div>
            </div>

            <div class="top-summary-panel anime-only">
              <div class="summary-item compact">視聴済<strong id="animeGlobalDone">0</strong></div>
              <div class="summary-item compact">視聴中<strong id="animeGlobalWatching">0</strong></div>
              <div class="summary-item compact">視聴中断<strong id="animeGlobalDropped">0</strong></div>
              <div class="summary-item compact">視聴予定<strong id="animeGlobalPlanned">0</strong></div>
              <div class="summary-item compact">登録作品数<strong id="animeGlobalWorks">0</strong></div>
              <div class="summary-item compact">視聴話数<strong id="animeGlobalEpisodes">0</strong></div>
            </div>

            <div class="content-area">
              <div id="tabContent">
                <?!= include('PhotoImportView') ?>
                <?!= include('WishListView') ?>
                <?!= include('SeriesView') ?>
                <?!= include('TitleView') ?>
                <?!= include('BoxView') ?>
                <?!= include('SeriesListView') ?>
                <?!= include('TitleListView') ?>
                <?!= include('BoxListView') ?>
                <?!= include('LibraryListView') ?>
                <?!= include('AnimeWatchingView') ?>
                <?!= include('AnimeSeriesView') ?>
                <?!= include('AnimeListView') ?>
                <?!= include('AnimeEntryView') ?>
              </div>
            </div>
          </div>

          <aside class="recent-history-panel book-only">
            <h4>最近追加した漫画</h4>
            <table class="table table-striped" id="globalRecentLibraryTable">
              <thead>
                <tr>
                  <th>作品名</th>
                  <th>巻数</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </aside>
        </div>
      </main>
    </div>
