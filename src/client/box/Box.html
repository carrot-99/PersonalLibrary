<!-- Box.html -->
<script>
//////////////////////////////
// 箱一覧
//////////////////////////////
// boxId: 一覧などのリンクから開くときに指定
function showBox(boxId) {
  const id = boxId || getAutocompleteValue('boxViewSelectInput') || document.getElementById('boxViewSelect').value;
  if(!id) return showError('Boxを選択してください');

  showInlineLoading('BoxView', '検索中...');

  google.script.run
    .withSuccessHandler(function(data){
      hideInlineLoading('BoxView');
      renderSummaryLines('boxSummary', formatGroupSummaryLines(data && data.summary));
      renderTableReadOnly('boxTable', (data && data.items) || [], ['name','volume'], {
        name: row => openTitleDetail(row.titleId)
      });
    })
    .withFailureHandler(function(error){
      hideInlineLoading('BoxView');
      showError(error && error.message ? error.message : '検索に失敗しました');
    })
    .getBoxOverview(id);
}

//////////////////////////////
// 箱一覧（追加・編集もこの画面で行う）
//////////////////////////////
let boxListFilter = null;

// options.refresh: 保存・追加の後（表示中の一覧のまま取り直す）
function loadBoxList(options = {}){
  if(!boxListFilter){
    boxListFilter = createListFilter({
      tableId: 'boxListTable',
      pageSize: 20,
      columns: [
        { key: 'id', link: row => openBoxDetail(row.id) },
        { key: 'place', edit: true, link: row => openBoxDetail(row.id) },
        { key: 'bookCount' },
        { key: 'titleCount' }
      ],
      keywordKeys: ['id', 'place'],
      defaultSort: { key: 'id', dir: 'asc' },
      edit: {
        update: 'updateBoxMaster',
        remove: 'deleteBoxMaster',
        onSaved: function(){ loadBoxList({ refresh: true }); refreshMasterData(); }
      }
    });
  }

  callGASCached('boxListWithCounts', 'getBoxListWithCounts', function(data){
    boxListFilter.setRows((data || []).map(item => ({ id: item.id, place: item.place, bookCount: item.bookCount, titleCount: item.titleCount })));
  }, { viewId: 'BoxListView', errorMessage: '箱一覧の読み込みに失敗しました', refresh: options.refresh });
}

//////////////////////////////
// 追加
//////////////////////////////
function addBoxMaster(){

  const id    = document.getElementById('newBoxId').value.trim();
  const place = document.getElementById('newBoxPlace').value.trim();

  if(!id || !place)
    return showError("BoxIDと保管場所は必須です");

  callGAS('addBoxMasterWeb', function(res){
    if(res.success){
      showSuccess(res.message);
      document.getElementById('newBoxId').value = '';
      document.getElementById('newBoxPlace').value = '';
      loadBoxList({ refresh: true });
      refreshMasterData();
    }else{
      showError(res.message);
    }
  }, id, place);
}

window.showBox = showBox;
window.loadBoxList = loadBoxList;
window.addBoxMaster = addBoxMaster;

</script>
