<!-- BoxMasterView.html -->
<div id="BoxMasterView" class="view">
  <h3>Boxマスタ管理</h3>

  <div class="master-toolbar">
    <button onclick="toggleAddForm('boxAddForm')">追加</button>
    <button onclick="toggleSearchForm('boxSearchForm')">検索</button>
    <button onclick="loadBoxMaster()">読込</button>
  </div>

  <!-- 追加フォーム（最初は非表示） -->
  <div id="boxAddForm" class="master-form" style="display:none;">
    <input type="text" id="newBoxId" placeholder="BoxID">
    <input type="text" id="newBoxPlace" placeholder="場所">
    <button onclick="addBoxMaster()">保存</button>
  </div>

  <!-- 検索フォーム（最初は非表示） -->
  <div id="boxSearchForm" class="master-form" style="display:none;">
    <input type="text" id="boxSearchKeyword" placeholder="キーワード">
    <button onclick="filterBox()">検索実行</button>
  </div>

  <!-- Box一覧テーブル -->
  <table class="table table-striped" id="boxMasterTable" style="display:none;">
    <thead>
      <tr>
        <th>BoxID</th>
        <th>保管場所</th>
      </tr>
    </thead>
    <tbody id="boxMasterTableBody">
    </tbody>
  </table>
</div>
